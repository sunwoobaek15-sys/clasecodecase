/* ---------------------------------------------------------------
   18. 지도 · 런 진행 (노드 진입/종료 · 보상 · 장터 · 보물)
---------------------------------------------------------------- */
const NODE_WEIGHTS = [['battle',45],['event',20],['inn',12],['elite',10],['shop',8],['treasure',5]];
/* 정예는 6층부터만 나오므로, 1~14층 전체에서 약 10%가 되도록 6층 이후 가중치를 보정한다 */
const LATE_WEIGHT_BOOST = {elite:2.3};
const NODE_NAME = {battle:'전투', elite:'정예', event:'사건', inn:'주막', shop:'장터', treasure:'보물', boss:'우두머리'};

/* 1막 지도 생성 (시드 기반). 0~13행 = 1~14층, 14행 = 보스.
   3~4줄의 길을 아래에서 위로 걸으며 노드를 찍고, 같은 칸을 지나면 길이 합쳐진다. */
function generateMap(seed, act){
  const rng = makeRng(seed, 'map', act || 1);
  const ROWS = ACT1_FLOORS - 1;
  const nodes = {}, edges = new Set();
  const key = (r, c) => r + '-' + c;
  const nPaths = rint(rng, 3, 4);
  const starts = shuffle(rng, Array.from({length:MAP_COLS}, (_, i) => i)).slice(0, nPaths);
  for(let p = 0; p < nPaths; p++){
    let c = starts[p];
    for(let r = 0; r < ROWS; r++){
      if(!nodes[key(r, c)]) nodes[key(r, c)] = {id:key(r, c), r, c};
      if(r < ROWS - 1){
        let nc = clamp(c + rint(rng, -1, 1), 0, MAP_COLS - 1);
        if(nc !== c && edges.has(key(r, nc) + '>' + key(r + 1, c))) nc = c;   // 길이 X자로 엇갈리지 않게
        edges.add(key(r, c) + '>' + key(r + 1, nc));
        c = nc;
      }
    }
  }
  nodes.boss = {id:'boss', r:ROWS, c:(MAP_COLS - 1) / 2, type:'boss'};
  Object.values(nodes).forEach(n => { if(n.r === ROWS - 1) edges.add(n.id + '>boss'); });
  const edgeList = [...edges];
  const parentsOf = id => edgeList.filter(e => e.split('>')[1] === id).map(e => nodes[e.split('>')[0]]);
  const ids = Object.keys(nodes).filter(k => k !== 'boss').sort((a, b) => nodes[a].r - nodes[b].r || nodes[a].c - nodes[b].c);
  for(const id of ids){
    const n = nodes[id];
    if(n.r === 0) n.type = 'battle';                 // 1층은 전투만
    else if(n.r === ROWS - 1) n.type = 'inn';         // 14층은 주막 고정
    else{
      const ps = parentsOf(id).map(p => p.type);
      const w = NODE_WEIGHTS.map(([t, v]) => [t, n.r >= 5 && LATE_WEIGHT_BOOST[t] ? v * LATE_WEIGHT_BOOST[t] : v]).filter(([t]) => {
        if((t === 'elite' || t === 'inn') && n.r < 5) return false;   // 정예·주막은 6층부터
        if(t === 'inn' && n.r === ROWS - 2) return false;             // 14층 주막 바로 앞에는 주막 X
        if(t !== 'battle' && t !== 'event' && ps.includes(t)) return false;   // 같은 특수 노드 연속 방지
        return true;
      });
      n.type = weighted(rng, w);
    }
    n.jx = (rng() - 0.5) * 0.5;
    n.jy = (rng() - 0.5) * 0.35;
  }
  if(!ids.some(id => nodes[id].type === 'elite')){
    const c = ids.filter(id => nodes[id].r >= 6 && nodes[id].r <= 11);
    if(c.length) nodes[pick(rng, c)].type = 'elite';
  }
  return {nodes, edges:edgeList};
}
function childrenOf(id){ return G.run.map.edges.filter(e => e.split('>')[0] === id).map(e => e.split('>')[1]); }
/* 다음에 고를 수 있는 노드. skip = 헌 짚신으로 한 칸 건너뛰기 */
function availableNodes(skip){
  const run = G.run;
  let base = run.path.length ? childrenOf(run.path[run.path.length - 1]) : Object.values(run.map.nodes).filter(n => n.r === 0).map(n => n.id);
  if(!skip) return base;
  const next = new Set();
  base.forEach(id => childrenOf(id).forEach(c => next.add(c)));
  return [...next];
}
function canUseSandal(){ const run = G.run; return hasRelic('jipsin') && !run.flags.sandalUsed && run.floor < ACT1_FLOORS - 1; }

function startRun(seedStr){
  const seed = (seedStr && seedStr.trim()) ? seedStr.trim().toUpperCase().slice(0, 16) : randomSeedString();
  G.run = newRun(STARTER_DECK, seed, 'run');
  G.run.map = generateMap(seed, 1);
  G.meta.stats.runs++;
  saveMeta();
  saveRun();
  G.ui.skipMode = false;
  setScreen('actIntro');
}
/* 막 전환: 다음 막 지도 생성 (보스 보상에서 생명력 회복·보스 보물은 이미 처리) */
function nextAct(){
  const run = G.run;
  run.act++;
  run.map = generateMap(run.seed, run.act);
  run.path = [];
  run.floor = 0;
  run.actBattles = 0;
  run.pendingNode = null; run.nodeState = null; run.rewardState = null;
  G.meta.stats.bestAct = Math.max(G.meta.stats.bestAct || 1, run.act);
  saveMeta();
  saveRun();
  setScreen('actIntro');
}
function enterNode(id){
  const run = G.run;
  const node = run.map.nodes[id];
  if(!node) return;
  if(G.ui.skipMode){
    run.flags.sandalUsed = true;
    G.ui.skipMode = false;
    toast('헌 짚신으로 한 칸을 훌쩍 건너뛰었다');
  }
  Sound.play('tap');
  run.path.push(id);
  run.floor = node.r + 1;
  run.pendingNode = id;
  run.nodeState = null;
  run.rewardState = null;
  G.meta.stats.bestFloor = Math.max(G.meta.stats.bestFloor, run.floor);
  saveMeta();
  saveRun();                                    // 노드 진입 시 자동 저장
  openNode(node);
}
function openNode(node){
  const run = G.run;
  const rng = makeRng(run.seed, 'node', node.id);
  switch(node.type){
    case 'battle':{
      const enc = ENCOUNTERS[run.act];
      const pool = run.actBattles < (run.act === 1 ? 3 : 2) ? enc.easy : enc.normal;
      startBattle(pick(rng, pool).slice(), 'battle', node.id);
      break;
    }
    case 'elite': startBattle(pick(rng, ENCOUNTERS[run.act].elite).slice(), 'elite', node.id); break;
    case 'boss': startBattle(ENCOUNTERS[run.act].boss[0].slice(), 'boss', node.id); break;
    case 'shop':
      if(!run.nodeState) run.nodeState = makeShop(rng);
      saveRun(); setScreen('shop'); break;
    case 'inn':
      if(!run.nodeState) run.nodeState = {done:false, msg:''};
      saveRun(); setScreen('inn'); break;
    case 'treasure':
      if(!run.nodeState) run.nodeState = {relic:rollRelic(rng, 0.3), opened:false};
      saveRun(); setScreen('treasure'); break;
    case 'event':{
      if(!run.nodeState){
        let pool = Object.keys(EVENTS).filter(k => EVENTS[k].acts.includes(run.act) && !run.seenEvents.includes(k));
        if(!pool.length) pool = Object.keys(EVENTS).filter(k => EVENTS[k].acts.includes(run.act));
        const ev = pick(rng, pool);
        run.seenEvents.push(ev);
        run.nodeState = {event:ev, done:false, resultText:'', gainedText:''};
      }
      saveRun(); setScreen('event'); break;
    }
  }
}
function completeNode(){
  const run = G.run;
  run.pendingNode = null;
  run.nodeState = null;
  run.rewardState = null;
  saveRun();                                    // 노드 종료 시 자동 저장
  setScreen('map');
}
function continueRun(){
  const r = loadRun();
  if(!r){ toast('이어갈 행렬이 없다'); render(); return; }
  G.run = r;
  r.stats.lastTick = Date.now();
  G.ui.skipMode = false;
  if(r.rewardState) setScreen('reward');
  else if(r.pendingNode) openNode(r.map.nodes[r.pendingNode]);
  else setScreen('map');
}
function endRun(win){
  const run = G.run;
  updatePlayTime();
  G.ui.result = {mode:'run', win, act:run.act, floor:run.floor, kills:run.stats.kills, elites:run.stats.elites,
    cards:run.deck.length, relics:run.relics.length, gold:run.gold, time:run.stats.playTime, seed:run.seed, reason:G.ui.loseReason || null};
  G.ui.loseReason = null;
  if(win){ G.meta.stats.clears++; G.meta.stats.fullClears = (G.meta.stats.fullClears || 0) + 1; }
  G.meta.stats.bestAct = Math.max(G.meta.stats.bestAct || 1, run.act);
  G.meta.stats.bestFloor = Math.max(G.meta.stats.bestFloor, run.floor);
  saveMeta();
  clearRun();
  G.battle = null;
  setScreen('result');
}

/* --- 카드·보물 뽑기 --- */
function rewardPool(rarity){
  return Object.keys(CARDS).filter(id => {
    const c = CARDS[id];
    if(c.rarity !== 'common' && c.rarity !== 'rare') return false;
    return !rarity || c.rarity === rarity;
  });
}
/* 카드 n장 (중복 없음). rareChance: 장마다 희귀일 확률 */
function rollCardChoices(rng, rareChance, n){
  const res = [];
  let guard = 0;
  while(res.length < n && guard++ < 100){
    const rar = rng() < rareChance ? 'rare' : 'common';
    const pool = rewardPool(rar).filter(id => !res.includes(id));
    if(pool.length) res.push(pick(rng, pool));
  }
  return res;
}
function relicPool(tier){ return Object.keys(RELICS).filter(id => RELICS[id].tier === tier && !G.run.relics.includes(id)); }
function rollRelicOfTier(rng, tier){
  let pool = relicPool(tier);
  if(!pool.length && tier !== 'boss') pool = relicPool(tier === 'rare' ? 'common' : 'rare');
  return pool.length ? pick(rng, pool) : null;
}
function rollRelic(rng, rareChance){ return rollRelicOfTier(rng, rng() < rareChance ? 'rare' : 'common'); }
function gainRelic(id){
  if(!id || G.run.relics.includes(id)) return;
  G.run.relics.push(id);
  codexSee('relics', id);
  Sound.play('relic');
  toast(`보물 「${RELICS[id].name}」 획득`);
  const d = RELICS[id];
  if(d.onPickup) executeEffects(d.onPickup, {run:G.run});
}
function addCardToDeck(id, up){
  G.run.deck.push(newCardInst(G.run, id, up));
  codexSee('cards', id);
}
function makeReward(kind, nodeId){
  const run = G.run;
  const rng = makeRng(run.seed, 'reward', nodeId);
  const n = Math.max(1, 3 + relicMod('rewardChoices'));
  const r = {kind, gold:0, goldTaken:false, cards:[], cardTaken:false, relic:null, relicTaken:false, bossRelics:null};
  if(kind === 'elite'){ r.gold = rint(rng, 25, 35); r.cards = rollCardChoices(rng, RARE_CHANCE.elite, n); r.relic = rollRelic(rng, 0.3); }
  else if(kind === 'boss'){
    r.gold = rint(rng, 60, 80); r.cards = rollCardChoices(rng, RARE_CHANCE.boss, n);
    r.bossRelics = shuffle(rng, relicPool('boss')).slice(0, 3); r.relicTaken = !r.bossRelics.length;
    r.healed = healRun(Math.ceil(run.maxHp * BOSS_HEAL));   // 막 보스 처치: 최대 생명력의 25% 회복
  }
  else{ r.gold = rint(rng, 10, 20); r.cards = rollCardChoices(rng, RARE_CHANCE.battle, n); }
  if(!r.relic && kind === 'elite'){ r.relicTaken = true; }
  r.cards.forEach(id => codexSee('cards', id));
  return r;
}
function makeShop(rng){
  const commons = shuffle(rng, rewardPool('common')).slice(0, 3);
  const rares = shuffle(rng, rewardPool('rare')).slice(0, 2);
  const cards = commons.concat(rares).map(id => ({id, price:CARDS[id].rarity === 'rare' ? PRICE.rare : PRICE.common, sold:false}));
  const relicIds = shuffle(rng, relicPool('common')).slice(0, 1).concat(shuffle(rng, relicPool('rare')).slice(0, 1));
  const relics = relicIds.map(id => ({id, price:RELICS[id].tier === 'rare' ? rint(rng, 200, PRICE.relicMax) : rint(rng, PRICE.relicMin, 199), sold:false}));
  return {cards, relics, removed:false};
}

/* --- 윷 던지기 연출 (주막 노름판) --- */
function yutStickSvg(flat){
  return svgWrap(flat
    ? `<rect x="3" y="2" width="16" height="92" rx="7" fill="#f2e8d0" stroke="${INK}" stroke-width="2.5"/><path d="M7 20 l8 8 M15 20 l-8 8 M7 44 l8 8 M15 44 l-8 8 M7 68 l8 8 M15 68 l-8 8" stroke="#c8323a" stroke-width="2"/>`
    : `<rect x="3" y="2" width="16" height="92" rx="7" fill="#a8743a" stroke="${INK}" stroke-width="2.5"/><path d="M8 10 Q11 48 8 86 M14 12 Q12 50 14 84" fill="none" stroke="#7a4a1a" stroke-width="1.6"/>`, '0 0 22 96');
}
async function playYutAnimation(sticks, res){
  const box = document.createElement('div');
  box.className = 'yut-box';
  box.innerHTML = `<div class="yut-sticks">${sticks.map((f, i) => `<div class="yut-stick spin" style="animation-delay:${i * 70}ms">${yutStickSvg(i % 2 === 0)}</div>`).join('')}</div><div class="yut-result"></div>`;
  $('#fx').appendChild(box);
  Sound.play('yut');
  await sleep(1300);
  box.querySelectorAll('.yut-stick').forEach((el, i) => { el.classList.remove('spin'); el.classList.add('land'); el.innerHTML = yutStickSvg(sticks[i]); });
  Sound.play('block');
  await sleep(350);
  box.querySelector('.yut-result').textContent = res + '!';
  Sound.play(res === '모' ? 'victory' : (res === '도' || res === '개') ? 'error' : 'coin');
  await sleep(1400);
  box.remove();
}

SCREENS.map = () => {
  const run = G.run;
  const m = run.map;
  const W = 400, RH = 80, TOP = 70;
  const H = TOP + (ACT1_FLOORS - 1) * RH + 70;
  const pos = n => n.id === 'boss' ? {x:W / 2, y:TOP - 14} : {x:44 + (n.c + 0.5 + (n.jx || 0)) * ((W - 64) / MAP_COLS), y:TOP + (ACT1_FLOORS - 1 - n.r) * RH + (n.jy || 0) * 26};
  const avail = new Set(availableNodes(G.ui.skipMode));
  const visited = new Set(run.path);
  const pathEdges = new Set();
  for(let i = 1; i < run.path.length; i++) pathEdges.add(run.path[i - 1] + '>' + run.path[i]);
  let edges = '';
  for(const e of m.edges){
    const [a, b] = e.split('>');
    const pa = pos(m.nodes[a]), pb = pos(m.nodes[b]);
    const on = pathEdges.has(e);
    edges += on
      ? `<line x1="${pa.x}" y1="${pa.y}" x2="${pb.x}" y2="${pb.y}" stroke="#ffb24a" stroke-width="9" stroke-linecap="round" opacity=".35"/><line x1="${pa.x}" y1="${pa.y}" x2="${pb.x}" y2="${pb.y}" stroke="#d8501e" stroke-width="3.5" stroke-linecap="round"/>`
      : `<line x1="${pa.x}" y1="${pa.y}" x2="${pb.x}" y2="${pb.y}" stroke="rgba(40,30,22,.55)" stroke-width="2.4" stroke-dasharray="2 6" stroke-linecap="round"/>`;
  }
  let floors = '';
  for(let f = 1; f <= ACT1_FLOORS; f++){
    const y = f === ACT1_FLOORS ? TOP - 14 : TOP + (ACT1_FLOORS - f) * RH;
    floors += `<text x="10" y="${y + 4}" font-size="11" fill="rgba(60,40,25,.55)" font-weight="700">${f}</text>`;
  }
  const cur = run.path[run.path.length - 1];
  let nodes = '';
  for(const id in m.nodes){
    const n = m.nodes[id];
    const p = pos(n);
    const isAvail = avail.has(id);
    const isDone = visited.has(id);
    const dim = !isAvail && !isDone;
    const r = id === 'boss' ? 28 : 19;
    nodes += `<g transform="translate(${p.x} ${p.y})"><g class="map-node ${isAvail ? 'avail' : ''} ${dim ? 'dim' : ''}" ${isAvail ? `data-action="node" data-id="${id}"` : ''}>
      ${isDone ? `<circle r="${r + 14}" fill="url(#lit)"/>` : ''}
      <circle r="${r + 7}" class="ring"/>
      <g class="core">
        <circle r="${r}" fill="${isDone ? '#ffd9a0' : id === 'boss' ? '#2a1010' : '#f6eedb'}" stroke="${INK}" stroke-width="2.5"/>
        ${NODE_ICON[n.type](id === 'boss' ? 1.7 : 1.25)}
      </g>
      ${isDone ? `<g transform="translate(${r - 2} ${-r - 6})"><path d="M0 -6 L0 -2" stroke="${INK}" stroke-width="1.5"/><rect x="-4" y="-2" width="8" height="10" rx="2" fill="#e8572a" stroke="${INK}" stroke-width="1.5"/><circle cx="0" cy="3" r="9" fill="#ffb24a" opacity=".35"/></g>` : ''}
      ${id === cur ? `<circle r="${r + 4}" fill="none" stroke="#c8323a" stroke-width="3"/>` : ''}
    </g></g>`;
  }
  const deco = run.act === 2 ? `${[0.15, 0.4, 0.65, 0.88].map(f => `<path d="M${20 + f * 300} ${H * f} l14 -10 l14 10 l0 14 l-28 0Z" fill="rgba(60,50,40,.1)"/>`).join('')}
    <path d="M0 ${H * 0.5} L400 ${H * 0.5}" stroke="rgba(60,40,25,.08)" stroke-width="18"/><path d="M30 ${H * 0.3} L370 ${H * 0.3}" stroke="rgba(60,40,25,.06)" stroke-width="10" stroke-dasharray="20 10"/>`
    : run.act === 3 ? `${[0.25, 0.6, 0.85].map(f => `<circle cx="${f > 0.5 ? 300 : 110}" cy="${H * f}" r="70" fill="none" stroke="rgba(120,30,30,.1)" stroke-width="3"/><circle cx="${f > 0.5 ? 300 : 110}" cy="${H * f}" r="50" fill="none" stroke="rgba(120,30,30,.08)" stroke-width="2" stroke-dasharray="6 6"/>`).join('')}`
    : `<path d="M0 ${H * 0.62} Q60 ${H * 0.55} 120 ${H * 0.6} T260 ${H * 0.58} T400 ${H * 0.62}" fill="none" stroke="rgba(60,40,25,.08)" stroke-width="22"/>
    <path d="M0 ${H * 0.25} L40 ${H * 0.2} L80 ${H * 0.24} L130 ${H * 0.17} L180 ${H * 0.23}" fill="none" stroke="rgba(60,40,25,.12)" stroke-width="2"/>
    <path d="M220 ${H * 0.8} L260 ${H * 0.75} L300 ${H * 0.79} L350 ${H * 0.72} L400 ${H * 0.78}" fill="none" stroke="rgba(60,40,25,.12)" stroke-width="2"/>`;
  const sandal = canUseSandal()
    ? `<button class="btn small ${G.ui.skipMode ? 'primary' : 'ghost'}" data-action="sandal">${G.ui.skipMode ? '건너뛰기 취소' : '헌 짚신 사용'}</button>` : '';
  return `<div class="screen">
    <div class="bgart">${actBackground()}</div>
    ${topbarHtml()}
    <div class="map-head"><b class="serif">${run.act}막 · ${ACTS[run.act].name}</b>${sandal || `<span>${G.ui.skipMode ? '' : '불 켜진 길을 따라 위로'}</span>`}</div>

          ${deco}${floors}${edges}${nodes}
        </svg>
      </div>
      <div class="roller"></div>

    <div class="map-legend">${['battle','elite','event','inn','shop','treasure','boss'].map(t => `<span><svg viewBox="-16 -16 32 32">${NODE_ICON[t](t === 'boss' ? 0.75 : 1)}</svg>${NODE_NAME[t]}</span>`).join('')}</div>

      <div class="npc"><div class="npc-art">${art('merchant')}</div><p>"어서 오시오, 요괴 나리! 봉요사 몰래 연 밤장이오. 일반 카드 ${PRICE.common}냥, 희귀 카드 ${PRICE.rare}냥. 엽전만 있으면 뭐든 드리지."</p></div>
      <div class="shop-section"><h3>카드</h3><div class="shop-items">
        ${s.cards.map((c, i) => `<div class="shop-item ${c.sold ? 'sold' : ''}" data-action="buyCard" data-i="${i}">${cardHtml(getCardDef({id:c.id, up:false}))}${price(c.price)}</div>`).join('')}
      </div></div>
      <div class="shop-section"><h3>보물</h3><div class="shop-items">
        ${s.relics.length ? s.relics.map((r, i) => `<div class="shop-item ${r.sold ? 'sold' : ''}" data-action="buyRelic" data-i="${i}" style="width:140px;text-align:center"><div class="shop-relic">${art(RELICS[r.id].art)}</div><b style="font-size:13px">${RELICS[r.id].name}</b><span style="font-size:11px;color:var(--muted);word-break:keep-all">${RELIC_TIER_NAME[RELICS[r.id].tier]} · ${RELICS[r.id].desc}</span>${price(r.price)}</div>`).join('') : '<span style="color:var(--muted);font-size:12px">보물은 다 팔렸소</span>'}
      </div></div>
      <div class="shop-section"><h3>부정 씻기</h3><div class="shop-items">
        <div class="shop-item ${s.removed ? 'sold' : ''}" data-action="removeService" style="width:160px;text-align:center"><div class="shop-relic">${art('remove')}</div><b style="font-size:13px">카드 1장 제거</b><span style="font-size:11px;color:var(--muted)">한 번 쓸 때마다 +${PRICE.removeStep}냥</span>${price(run.removeCost)}</div>
      </div></div>
    </div>
    <div class="panel-foot"><button class="btn primary" data-action="leaveNode">장터를 떠난다</button></div>
  </div>`;
};

const BOSS_CLEAR = {
  1:{title:'대장승을 쓰러뜨렸다!', desc:'고갯길의 봉인 말뚝이 뽑혀 나갔다. 저 아래 한양의 불빛이 보인다.'},
  2:{title:'해태 석상이 무너졌다!', desc:'광화문 앞 해태가 금이 가며 주저앉았다. 봉요사 본진으로 가는 길이 열렸다.'},
  3:{title:'천명을 쓰러뜨렸다', desc:''},
};
SCREENS.actIntro = () => {
  const act = G.run.act;
  return `<div class="screen">
    <div class="bgart">${actBackground(act)}</div>
    <div class="panel-body" style="justify-content:center;gap:18px">
      <div class="serif" style="font-size:16px;color:var(--lamp2);letter-spacing:.5em">제${['','一','二','三'][act]}막</div>
      <div class="serif" style="font-size:34px;font-weight:900;letter-spacing:.15em;text-shadow:2px 2px 0 #1b1512,0 0 18px rgba(232,87,42,.6)">${ACTS[act].name}</div>
      <div class="story serif">${ACTS[act].story}</div>
      ${act > 1 ? `<div style="color:#7fe0a0;font-weight:700;font-size:13px">생명력 ${G.run.hp}/${G.run.maxHp} · 덱 ${G.run.deck.length}장 · 보물 ${G.run.relics.length}개</div>` : ''}
    </div>
    <div class="panel-foot"><button class="btn primary" data-action="actGo">행렬 출발</button></div>
  </div>`;
};
/* 엔딩 대화: 봉요사가 요괴를 봉인하는 진짜 이유의 단서 (답은 주지 않는다) */
const ENDING_DIALOGUE = [
  {who:'cheonmyeong', text:'…끝내 여기까지 왔구나, 도깨비.'},
  {who:'me', text:'백 년마다 우리를 가두려 드는 이유가 뭐냐. 우리가 사람을 해친 적이 있었나?'},
  {who:'cheonmyeong', text:'가두려던 것이 아니다. …숨기려던 것이다.'},
  {who:'cheonmyeong', text:'백귀야행의 밤에 열리는 문은, 너희가 여는 것이 아니다. 너희 등불을 보고 저편에서 무언가가 길을 찾아온다.'},
  {who:'me', text:'저편? 무슨 소리냐.'},
  {who:'cheonmyeong', text:'첫 봉인을 친 것은 사람이 아니었다. 봉요사의 초대 수장은… 너희와 같은 뿔이 있었지.'},
  {who:'cheonmyeong', text:'등불을 꺼라, 도깨비. 이번 밤은 너희가 이겼지만… 문은 아직 닫히지 않았다.'},
  {who:'me', text:'…행렬은 산으로 돌아간다. 하지만 이 말은 잊지 않겠다.'},
];
SCREENS.ending = () => {
  const n = Math.min(G.ui.endingStep || 0, ENDING_DIALOGUE.length - 1);
  const lines = ENDING_DIALOGUE.slice(0, n + 1).map(l => `<div class="dlg-line ${l.who === 'me' ? 'me' : ''}">
      <div class="dlg-face">${l.who === 'me' ? art(LEADERS[G.run.leader].art) : enemyArtSvg('cheonmyeong')}</div>
      <div><div class="dlg-name">${l.who === 'me' ? LEADERS[G.run.leader].name : '천명 · 봉요사 수장'}</div><div class="dlg-text">${esc(l.text)}</div></div>
    </div>`).join('');
  const last = n >= ENDING_DIALOGUE.length - 1;
  return `<div class="screen">
    <div class="bgart">${actBackground(3)}</div>
    <div class="panel-head serif"><h2>대봉인진이 흩어진다</h2><p>쓰러진 천명이 마지막 숨을 고른다</p></div>
    <div class="panel-scroll"><div class="dialogue">${lines}</div></div>
    <div class="panel-foot"><button class="btn primary" data-action="endingNext">${last ? '동이 튼다' : '다음'}</button></div>
  </div>`;
};
function innHealAmount(){ return Math.ceil(G.run.maxHp * (INN_HEAL + relicMod('innHeal'))); }
SCREENS.inn = () => {
  const run = G.run, s = run.nodeState || {};
  const pct = Math.round((INN_HEAL + relicMod('innHeal')) * 100);
  return `<div class="screen">
    <div class="bgart">${actBackground()}</div>
    ${topbarHtml()}
    <div class="panel-head serif"><h2>산길 주막</h2><p>봉요사도 모르는, 요괴들만 아는 주막</p></div>
    <div class="panel-scroll">
      <div class="npc"><div class="npc-art">${art('innkeeper')}</div><p>"오늘 같은 밤엔 다들 바쁘구먼. 쉬어 가든 몸을 풀든, 한 가지만 하시게."</p></div>
      ${s.done ? `<div class="story" style="margin-top:12px">${s.msg}</div>${s.cardId ? `<div style="margin-top:6px">${cardHtml(getCardDef({id:s.cardId, up:true}), {cls:'md'})}</div>` : ''}` : `
      <div class="inn-opts">
        <button class="inn-opt ${relicMod('noRest') ? 'disabled' : ''}" data-action="innRest">${art('rest')}<b>쉬어 간다</b><small>${relicMod('noRest') ? '호랑이 가죽 때문에 쉴 수 없다' : `생명력 ${pct}% (${innHealAmount()}) 회복`}</small></button>
        <button class="inn-opt ${run.deck.some(canUpgrade) ? '' : 'disabled'}" data-action="innTrain">${art('train')}<b>수련한다</b><small>카드 1장 강화</small></button>
      </div>`}
    </div>
    <div class="panel-foot">${s.done ? `<button class="btn primary" data-action="leaveNode">길을 나선다</button>` : ''}</div>
  </div>`;
};

SCREENS.treasure = () => {
  const run = G.run, s = run.nodeState;
  const R = s.relic ? RELICS[s.relic] : null;
  return `<div class="screen">
    <div class="bgart">${actBackground()}</div>
    ${topbarHtml()}
    <div class="panel-head serif"><h2>봉요사의 압수 궤짝</h2><p>요괴들에게서 빼앗아 간 물건이 들어 있다</p></div>
    <div class="panel-scroll" style="justify-content:center">
      ${s.opened ? `<div class="chest" style="animation:none">${art('chest_open')}</div>
        ${R ? `<div class="reward-item" style="cursor:default">${art(R.art)}<div>${R.name} <small>${RELIC_TIER_NAME[R.tier]} 보물 · ${R.desc}</small></div></div>` : `<div class="story">궤짝은 비어 있었다… 대신 엽전 50냥이 굴러 나왔다.</div>`}`
      : `<div class="chest" data-action="openChest">${art('chest_closed')}</div><div style="color:var(--muted);font-size:13px">궤짝을 눌러 연다</div>`}
    </div>
    <div class="panel-foot">${s.opened ? `<button class="btn primary" data-action="leaveNode">챙겨서 떠난다</button>` : ''}</div>
  </div>`;
};

function reqOk(req){
  if(!req) return true;
  if(req.gold && G.run.gold < req.gold) return false;
  if(req.hp && G.run.hp < req.hp) return false;
  return true;
}
SCREENS.event = () => {
  const run = G.run, s = run.nodeState;
  const ev = EVENTS[s.event];
  const choices = ev.choices.map((c, i) => {
    const ok = reqOk(c.req);
    const why = !ok ? (c.req.gold ? ' (엽전 부족)' : ' (생명력 부족)') : '';
    return `<button class="choice ${ok ? '' : 'disabled'}" data-action="eventChoice" data-i="${i}">${c.label}<small>${c.desc}${why}</small></button>`;
  }).join('');
  return `<div class="screen">
    <div class="bgart">${actBackground()}</div>
    ${topbarHtml()}
    <div class="panel-head serif"><h2>${ev.title}</h2></div>
    <div class="panel-scroll">
      <div class="event-art">${eventArt(ev.art)}</div>
      <div class="event-text">${esc(s.done ? s.resultText : ev.text)}</div>
      ${s.done ? (s.gainedText ? `<div class="gained">${s.gainedText}</div>` : '') : choices}
    </div>
    <div class="panel-foot">${s.done ? `<button class="btn primary" data-action="leaveNode">길을 계속 간다</button>` : ''}</div>
  </div>`;
};

/* ---------------------------------------------------------------
   20. 시작
---------------------------------------------------------------- */
function boot(){
  G.meta = loadMeta();
  setScreen('title');
}
boot();
window.BAEKGWI = {G, CARDS, ENEMIES, SPIRITS, SYNERGIES, RELICS, EVENTS, LEADERS, executeEffects, startBattle, startTestBattle, playCard, endTurn, setScreen, summonSpirit,
  startRun, enterNode, availableNodes, generateMap, gainRelic, completeNode};
</script>
</body>
