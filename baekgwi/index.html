---------------------------------------------------------------- */
const Sound = {
  ctx:null, master:null, bgmGain:null, bgmTimer:null, bgmMode:null, step:0, noiseBuf:null,
  init(){
    if(this.ctx) return;
    try{
      const AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return;
      this.ctx = new AC();
      this.master = this.ctx.createGain(); this.master.gain.value = 0.55; this.master.connect(this.ctx.destination);
      this.bgmGain = this.ctx.createGain(); this.bgmGain.gain.value = 0.16; this.bgmGain.connect(this.master);
      const len = this.ctx.sampleRate * 0.6;
      this.noiseBuf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const data = this.noiseBuf.getChannelData(0);
      for(let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
    }catch(e){ this.ctx = null; }
  },
  resume(){ try{ if(this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); }catch(e){} },
  tone(freq, dur, type, vol, when, dest, slideTo){
    if(!this.ctx) return;
    const t = this.ctx.currentTime + (when || 0);
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type || 'sine'; o.frequency.setValueAtTime(freq, t);
    if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol || 0.2, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(dest || this.master);
    o.start(t); o.stop(t + dur + 0.05);
  },
  noise(dur, vol, freq, when, q, dest){
    if(!this.ctx || !this.noiseBuf) return;
    const t = this.ctx.currentTime + (when || 0);
    const s = this.ctx.createBufferSource(); s.buffer = this.noiseBuf;
    const f = this.ctx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq || 1000; f.Q.value = q || 1;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(vol || 0.2, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(dest || this.master);
    s.start(t); s.stop(t + dur + 0.05);
  },
  play(name){
    if(!this.ctx || !G.meta || !G.meta.settings.sfx) return;
    switch(name){
      case 'tap': this.tone(880, 0.06, 'triangle', 0.08); break;
      case 'card': this.noise(0.12, 0.18, 2400, 0, 0.8); this.tone(520, 0.1, 'triangle', 0.08, 0.02, null, 780); break;
      case 'draw': this.noise(0.06, 0.1, 3000, 0, 1.5); break;
      case 'hit': this.noise(0.16, 0.35, 700, 0, 0.7); this.tone(140, 0.16, 'square', 0.12, 0, null, 60); break;
      case 'block': this.tone(300, 0.12, 'triangle', 0.15); this.noise(0.08, 0.15, 3000, 0, 2); break;
      case 'burn': this.noise(0.35, 0.22, 500, 0, 0.5); this.tone(220, 0.25, 'sawtooth', 0.05, 0, null, 110); break;
      case 'ward': [988, 1319].forEach((f, i)=>this.tone(f, 0.3, 'sine', 0.09, i * 0.05)); this.noise(0.15, 0.1, 5000, 0, 3); break;
      case 'seal': this.noise(0.25, 0.2, 1800, 0, 1); this.tone(660, 0.2, 'square', 0.05, 0.25, null, 330); break;
      case 'coin': this.tone(1320, 0.08, 'square', 0.06); this.tone(1760, 0.14, 'square', 0.05, 0.06); break;
      case 'death': this.tone(300, 0.5, 'sawtooth', 0.08, 0, null, 60); this.noise(0.5, 0.15, 400, 0, 0.5); break;
      case 'turn': this.tone(294, 0.4, 'triangle', 0.1); this.tone(440, 0.5, 'triangle', 0.08, 0.1); break;
      case 'enemyturn': this.tone(196, 0.35, 'sawtooth', 0.06); this.noise(0.2, 0.15, 200, 0, 1); break;
      case 'summon': [392, 523, 659, 784].forEach((f, i)=>this.tone(f, 0.22, 'triangle', 0.1, i * 0.06)); this.noise(0.4, 0.08, 1800, 0, 0.6); break;
      case 'spirit': this.tone(620, 0.1, 'triangle', 0.08, 0, null, 900); break;
      case 'charm': [660, 880, 990].forEach((f, i)=>this.tone(f, 0.25, 'sine', 0.08, i * 0.05)); break;
      case 'wet': this.noise(0.3, 0.18, 900, 0, 0.6); this.tone(500, 0.25, 'sine', 0.06, 0, null, 250); break;
      case 'grudge': this.tone(330, 0.5, 'sine', 0.1, 0, null, 250); this.tone(336, 0.5, 'sine', 0.08); break;
      case 'synergy': [523, 659, 784, 1047].forEach((f, i)=>this.tone(f, 0.35, 'sine', 0.08, i * 0.08)); break;
      case 'heal': [523, 659, 784].forEach((f, i)=>this.tone(f, 0.3, 'sine', 0.08, i * 0.07)); break;
      case 'relic': [784, 988, 1175, 1568].forEach((f, i)=>this.tone(f, 0.3, 'sine', 0.07, i * 0.05)); break;
      case 'yut': for(let i = 0; i < 8; i++) this.noise(0.05, 0.16, 2600, i * 0.15, 2); break;
      case 'error': this.tone(180, 0.15, 'square', 0.07); break;
      case 'victory': [392, 440, 523, 587, 784].forEach((f, i)=>this.tone(f, 0.45, 'triangle', 0.1, i * 0.12)); break;
      case 'defeat': [392, 349, 294, 262].forEach((f, i)=>this.tone(f, 0.6, 'sine', 0.1, i * 0.22)); break;
    }
  },
  /* 배경음: 계면조 5음계 뜯기 + 전투 시 장구 */
  bgm(mode){
    if(!this.ctx || this.bgmMode === mode) return;
    this.bgmMode = mode;
    if(this.bgmTimer){ clearInterval(this.bgmTimer); this.bgmTimer = null; }
    if(!mode) return;
    const scale = [146.8, 174.6, 196, 220, 261.6, 293.7, 349.2, 392, 440];
    let last = 4;
    const beat = mode === 'battle' ? 330 : 520;
    this.step = 0;
    this.bgmTimer = setInterval(()=>{
      if(!G.meta.settings.bgm || !this.ctx || this.ctx.state !== 'running') return;
      const s = this.step++;
      if(Math.random() < (mode === 'battle' ? 0.55 : 0.42)){
        last = clamp(last + pick(Math.random, [-2,-1,-1,1,1,2,0]), 0, scale.length - 1);
        this.tone(scale[last], 1.4, 'triangle', 0.22, 0, this.bgmGain);
        this.tone(scale[last] * 2, 0.5, 'sine', 0.06, 0, this.bgmGain);
      }
      if(s % 8 === 0) this.tone(73.4, 2.2, 'sine', 0.18, 0, this.bgmGain);
      if(mode === 'battle'){
        if([1,0,0,1,0,1,0,0][s % 8]) this.tone(90, 0.25, 'sine', 0.35, 0, this.bgmGain, 55);
        if(s % 4 === 2) this.noise(0.08, 0.18, 3200, 0, 3, this.bgmGain);
      }
    }, beat);
  },
};

/* ---------------------------------------------------------------
   10. 공용 효과 실행기 executeEffects()
   ctx: {battle, source, target, attackTarget, card, force}
     source       : 효과를 일으킨 유닛 (대장·요괴·적)
     target       : 카드/요괴가 고른 대상 적
     attackTarget : 적의 공격이 향할 대상 (대장·요괴·홀려서 고른 아무나)
---------------------------------------------------------------- */
const EFFECTS = {};
async function executeEffects(effects, ctx){
  if(!effects) return;
  ctx = ctx || {};
  for(const e of effects){
    const b = ctx.battle;
    if(b && b.over && !ctx.force) return;
    const h = EFFECTS[e.type];
    if(!h){ console.warn('알 수 없는 효과', e.type); continue; }
    await h(e, ctx);
    if(b && !ctx.force) checkBattleEnd();
  }
}
/* 카드 정의: 강화(inst.up)면 up 필드를 덮어쓰고 이름 뒤에 '+' */
function getCardDef(inst){
  const base = CARDS[inst.id];
  if(!base) return null;
  if(!inst.up) return Object.assign({id:inst.id, upgraded:false}, base);
  return Object.assign({id:inst.id}, base, base.up || {}, {name:base.name + '+', upgraded:true});
}
function canUpgrade(inst){ const d = CARDS[inst.id]; return !!(d && !inst.up && d.up && d.type !== 'curse'); }
/* 카드 비용: 복제 카드는 「메아리」면 0 / 깨진 대봉인 조각으로 봉인 카드를 쓰면 +1 */
function cardCost(inst){
  const d = getCardDef(inst);
  let c = d.cost;
  if(inst.copy && hasSyn('sound')) c = 0;
  const b = G.battle;
  if(b && b.sealed.has(inst.uid) && relicMod('sealedPlayable')) c += 1;
  return c;
}
function isAllySide(u){ return u && (u.kind === 'player' || u.kind === 'spirit'); }
function aliveEnemies(){ const b = G.battle; return b ? b.enemies.filter(e => e.hp > 0) : []; }
function aliveSpirits(){ const b = G.battle; return b ? b.spirits.filter(s => s && s.hp > 0 && !s.dead) : []; }
function findSpirit(uid){ const b = G.battle; return b ? b.spirits.find(s => s && s.uid === uid) || null : null; }
function st(u, k){ return (u && u.status && u.status[k]) || 0; }
function hasSyn(key){ const b = G.battle; return !!(b && b.syn && b.syn[key]); }
function spiritChance(d){ return d.spiritTarget === undefined ? DEFAULT_SPIRIT_TARGET : d.spiritTarget; }

/* 가장 강한 적: 이번 턴 예고한 공격 피해가 가장 큰 적 (같으면 체력이 많은 적) */
function strongestEnemy(){
  const alive = aliveEnemies();
  if(!alive.length) return null;
  const score = e => {
    const ii = intentInfo(e);
    const atk = ii && (ii.kind === 'attack' || ii.kind === 'attackSpirit') ? (ii.value || 0) * (ii.hits || 1) : 0;
    return atk * 1000 + e.hp;
  };
  return alive.slice().sort((a, c) => score(c) - score(a))[0];
}
function neighborEnemy(u){
  const b = G.battle;
  const i = b.enemies.indexOf(u);
  for(const j of [i + 1, i - 1, i + 2, i - 2]){
    const e = b.enemies[j];
    if(e && e !== u && e.hp > 0) return e;
  }
  return null;
}

/* 대상 해석 */
function resolveTargets(e, ctx, def){
  const b = ctx.battle;
  if(!b) return [];
  const src = ctx.source || b.player;
  const ally = isAllySide(src);
  const alive = aliveEnemies();
  switch(e.target || def){
    case 'enemy':
      if(!ally){
        const t = ctx.attackTarget;
        if(t && t.hp > 0 && !t.dead) return [t];
        if(t && t.kind === 'spirit'){ const sp = aliveSpirits(); return sp.length ? [pick(b.rng, sp)] : [b.player]; }
        return [b.player];
      }
      if(ctx.target && ctx.target.hp > 0 && ctx.target.kind === 'enemy') return [ctx.target];
      return alive.length ? [pick(b.rng, alive)] : [];
    case 'randomEnemy': return ally ? (alive.length ? [pick(b.rng, alive)] : []) : [b.player];
    case 'strongestEnemy':{ if(!ally) return [b.player]; const s = strongestEnemy(); return s ? [s] : []; }
    case 'allEnemies': return ally ? alive : [b.player];
    case 'player': return [b.player];
    case 'self': return [src];
    case 'allSpirits': return aliveSpirits();
    case 'allAllies': return ally ? [b.player] : alive;
    default: return [];
  }
}

/* 피해 계산 · 적용 */
function actScale(){ return ACT_SCALE[(G.run && G.run.act) || 1] || {hp:1, dmg:1, bossHp:1, bossDmg:1}; }
function calcDamage(src, tgt, base){
  let dmg = base;
  if(src){
    dmg += st(src, 'str');
    if(src.kind === 'enemy'){
      dmg -= st(src, 'dread');                 // 위축: 타격마다 -N
      if(st(src, 'charm') > 0) dmg *= 0.75;    // 홀림: 25% 감소
      dmg *= ENEMIES[src.id] && ENEMIES[src.id].boss ? actScale().bossDmg : actScale().dmg;   // 막별 보정
    }
    if(isAllySide(src) && tgt && st(tgt, 'wet') > 0) dmg += relicMod('wetBonus');   // 이무기 비늘
  }
  return Math.max(0, Math.floor(dmg));
}
async function dealDamage(src, tgt, base, opts){
  opts = opts || {};
  if(!tgt || tgt.hp <= 0 || tgt.dead) return 0;
  const b = G.battle;
  let dmg = opts.raw ? base : calcDamage(src, tgt, base);
  // 결계: 공격 피해를 통째로 무효 (불씨 같은 raw 피해는 통과)
  if(!opts.raw && dmg > 0 && st(tgt, 'ward') > 0){
    tgt.status.ward--;
    if(tgt.status.ward <= 0) delete tgt.status.ward;
    renderBattle();
    fxText(tgt.uid, '결계!', 'ward');
    fxClass(tgt.uid, 'warded');
    Sound.play('ward');
    return 0;
  }
  // 철갑: 모든 피해를 수치만큼 줄인다 (무시 불가)
  if(dmg > 0 && st(tgt, 'armor') > 0){ dmg = Math.max(0, dmg - tgt.status.armor); if(dmg === 0) fxText(tgt.uid, '철갑', 'blk'); }
  let blocked = 0;
  if(!opts.pierce){ blocked = Math.min(tgt.block || 0, dmg); tgt.block -= blocked; dmg -= blocked; }
  tgt.hp = Math.max(0, tgt.hp - dmg);
  if(isAllySide(src) && tgt.kind === 'enemy') b.stats.dealt += dmg;
  if(tgt.kind === 'player') b.stats.taken += dmg;
  renderBattle();
  if(dmg > 0){
    fxShake(tgt.uid);
    fxText(tgt.uid, '-' + dmg, opts.cls || '');
    Sound.play(opts.sound || 'hit');
  }else if(blocked > 0){
    fxText(tgt.uid, '막음', 'blk');
    Sound.play('block');
  }
  if(tgt.kind === 'enemy' && tgt.hp > 0) checkPhase(tgt);
  if(tgt.kind === 'spirit' && dmg > 0) await emit('spiritDamaged', {spirit:tgt});
  // 해태 석상: 불 계열 피해를 받으면 정의의 불 +1, 쌓인 만큼 반격
  if(opts.fire && tgt.kind === 'enemy' && tgt.hp > 0 && ENEMIES[tgt.id].justice){
    tgt.status.justice = (tgt.status.justice || 0) + 1;
    const back = (src && src.kind === 'spirit' && src.hp > 0 && !src.dead) ? src : b.player;
    fxText(tgt.uid, '정의의 불 ' + tgt.status.justice, 'burn');
    fxEmbers(back.uid, 8);
    await dealDamage(tgt, back, tgt.status.justice, {raw:true, cls:'burn', sound:'burn'});
  }
  if(tgt.hp <= 0) await onUnitDeath(tgt);
  return dmg;
}
/* 수치 계산: scale = {status, mult} 이면 대장의 그 상태 수치만큼 더한다 */
function scaledValue(e, ctx){
  let v = e.value || 0;
  if(e.scale && ctx.battle) v += Math.floor(st(ctx.battle.player, e.scale.status) * (e.scale.mult || 1));
  return v;
}
function isFireSource(src, ctx){
  if(ctx && ctx.card) return ctx.card.family === 'fire';
  return !!(src && src.kind === 'spirit' && src.family === 'fire');
}
function applyStatus(tgt, key, val){
  if(!tgt || tgt.hp <= 0 || tgt.dead || !val) return;
  tgt.status[key] = (tgt.status[key] || 0) + val;
  if(tgt.status[key] <= 0) delete tgt.status[key];
  renderBattle();
  const si = STATUS_INFO[key];
  fxText(tgt.uid, si.name + (val > 0 ? ' +' : ' ') + val, ['burn','ward','charm','wet','grudge'].includes(key) ? key : 'st');
  if(key === 'burn'){ fxEmbers(tgt.uid, 6 + val * 2); Sound.play('burn'); }
  else if(key === 'ward') Sound.play('ward');
  else if(key === 'charm') Sound.play('charm');
  else if(key === 'wet') Sound.play('wet');
  else if(key === 'grudge') Sound.play('grudge');
}
function gainBlock(u, v){
  if(!u || u.hp <= 0 || v <= 0) return;
  if(st(u, 'wet') > 0) v = Math.floor(v * 0.75);   // 젖음: 얻는 방어 25% 감소
  if(v <= 0) return;
  u.block = (u.block || 0) + v;
  renderBattle();
  fxText(u.uid, '방어 +' + v, 'blk');
  Sound.play('block');
}
/* 적이 예고한 행동을 내 편이 따라 할 때의 효과 변환 (장산범 울음 · 흉내 홀림) */
function mirrorEffects(enemy){
  const mv = ENEMIES[enemy.id].moves[enemy.intent];
  if(!mv) return [];
  return mv.effects.map(x => {
    switch(x.type){
      case 'damage':   return {type:'damage', value:x.value, hits:x.hits, target:'enemy'};
      case 'block':    return {type:'block', value:x.value, target:'player'};
      case 'ward':     return {type:'block', value:x.value * 4, target:'player'};
      case 'sealCard': return {type:'charm', value:2, target:'enemy'};
      case 'purify':   return {type:'stripWard', target:'enemy'};
      case 'strength': return {type:'strength', value:x.value, target:'player'};
      default: return null;
    }
  }).filter(Boolean);
}

/* --- 효과 정의 --- */
EFFECTS.damage = async (e, ctx) => {
  const b = ctx.battle; if(!b) return;
  const src = ctx.source || b.player;
  const hits = e.hits || 1;
  for(let i = 0; i < hits; i++){
    if(b.over) return;
    const targets = resolveTargets(e, ctx, 'enemy');
    if(src.kind === 'enemy' && targets.length) fxClass(src.uid, 'lunge');
    for(const t of targets){
      let v = scaledValue(e, ctx);
      if(e.bonusIf && st(t, e.bonusIf) > 0) v += e.bonus || 0;
      if(ctx.card && ctx.card.type === 'attack' && b.turn === 1) v += relicMod('firstTurnAttack');
      await dealDamage(src, t, v, {fire:isFireSource(src, ctx)});
    }
    if(hits > 1) await sleep(200);
  }
};
EFFECTS.block = async (e, ctx) => {
  const b = ctx.battle; if(!b) return;
  const src = ctx.source || b.player;
  const v = scaledValue(e, ctx);
  resolveTargets(e, ctx, src.kind === 'enemy' ? 'self' : 'player').forEach(t => gainBlock(t, v));
};
for(const k of ['burn','charm','wet','dread']){
  EFFECTS[k] = async (e, ctx) => {
    if(!ctx.battle) return;
    let v = e.value;
    if(k === 'burn' && isAllySide(ctx.source || ctx.battle.player)) v += relicMod('burnBonus');   // 꺼지지 않는 숯
    resolveTargets(e, ctx, 'enemy').forEach(t => applyStatus(t, k, v));
    await sleep(120);
  };
}
/* 결계: 다시 치면 더해지지 않고 「결계 N」으로 새로 친다 (끝없이 쌓여 전투가 막히는 것을 방지) */
EFFECTS.ward = async (e, ctx) => {
  if(!ctx.battle) return;
  resolveTargets(e, ctx, 'self').forEach(t => {
    const add = e.value - st(t, 'ward');
    if(add > 0) applyStatus(t, 'ward', add); else fxText(t.uid, '결계 유지', 'ward');
  });
};
EFFECTS.multiplyStatus = async (e, ctx) => {
  const b = ctx.battle; if(!b) return;
  for(const t of resolveTargets(e, ctx, 'enemy')){
    const cur = st(t, e.status);
    if(cur <= 0){ fxText(t.uid, STATUS_INFO[e.status].name + ' 없음', 'st'); continue; }
    t.status[e.status] = cur * e.mult;
    renderBattle();
    fxText(t.uid, STATUS_INFO[e.status].name + ' ×' + e.mult, e.status === 'burn' ? 'burn' : 'st');
    if(e.status === 'burn'){ fxEmbers(t.uid, 18); Sound.play('burn'); }
  }
  await sleep(150);
};
EFFECTS.draw = async (e, ctx) => { if(ctx.battle) await drawCards(e.value || 1); };
EFFECTS.energy = async (e, ctx) => {
  const b = ctx.battle; if(!b) return;
  b.energy += e.value || 1;
  renderBattle();
  fxText('P', '혼력 +' + (e.value || 1), 'st');
};
EFFECTS.gold = async (e, ctx) => {
  G.run.gold = Math.max(0, G.run.gold + e.value);
  if(ctx.battle){ ctx.battle.stats.gold += e.value; renderBattle(); fxText('P', '엽전 +' + e.value, 'gold'); }
  Sound.play('coin');
};
EFFECTS.strength = async (e, ctx) => {
  const b = ctx.battle; if(!b) return;
  resolveTargets(e, ctx, 'self').forEach(t => { t.status.str = (t.status.str || 0) + e.value; fxText(t.uid, '요기 +' + e.value, 'st'); });
  renderBattle();
};
/* 봉인: 적 차례에는 손패가 비어 있으므로, 다음 턴 손패를 뽑은 직후 카드 1장에 부적이 붙는다 */
EFFECTS.sealCard = async (e, ctx) => {
  const b = ctx.battle; if(!b) return;
  for(let i = 0; i < (e.value || 1); i++) b.pendingSeals.push(ctx.source ? ctx.source.uid : null);
  if(ctx.source) fxText(ctx.source.uid, '부적을 날린다!', 'st');
  Sound.play('seal');
  await sleep(250);
};
/* 정화(적 전용): 다음에 소환되는 내 요괴의 체력 절반 */
EFFECTS.purify = async (e, ctx) => {
  const b = ctx.battle; if(!b) return;
  b.player.status.purify = (b.player.status.purify || 0) + (e.value || 1);
  renderBattle();
  fxText('P', '정화 부적!', 'st');
  Sound.play('seal');
  await sleep(250);
};
EFFECTS.cleanse = async (e, ctx) => {
  const src = ctx.source; if(!src) return;
  ['burn'].forEach(k => delete src.status[k]);
  renderBattle();
  fxText(src.uid, '정화', 'st');
};
EFFECTS.stripWard = async (e, ctx) => {
  const b = ctx.battle; if(!b) return;
  for(const t of resolveTargets(e, ctx, 'enemy')){
    delete t.status.ward;
    t.block = 0;
    renderBattle();
    fxText(t.uid, '결계·방어 해제', 'ward');
  }
};
/* 원한 (대장 자원) */
EFFECTS.gainGrudge = async (e, ctx) => {
  const b = ctx.battle; if(!b) return;
  applyStatus(b.player, 'grudge', e.value);
  await sleep(100);
  await emit('grudgeGain');
};
EFFECTS.selfDamage = async (e, ctx) => {
  const b = ctx.battle; if(!b) return;
  await dealDamage(null, b.player, e.value, {raw:true, pierce:true});
};
EFFECTS.grudgeBurst = async (e, ctx) => {
  const b = ctx.battle; if(!b) return;
  const g = st(b.player, 'grudge');
  if(g <= 0){ toast('쌓인 원한이 없다'); fxText('P', '원한 0', 'st'); return; }
  const wail = hasSyn('wail');
  const targets = wail ? aliveEnemies() : resolveTargets({target:'enemy'}, ctx, 'enemy');
  delete b.player.status.grudge;
  renderBattle();
  if(wail){ showBanner('곡소리'); Sound.play('grudge'); await sleep(300); }
  fxFlash();
  for(const t of targets) await dealDamage(ctx.source || b.player, t, g * (e.mult || 2));
};
/* 물귀신 손: 대상을 맨 앞으로 끌어옴 */
EFFECTS.pullFront = async (e, ctx) => {
  const b = ctx.battle; if(!b) return;
  const t = resolveTargets({target:'enemy'}, ctx, 'enemy')[0];
  if(!t || t.hp <= 0) return;
  const i = b.enemies.indexOf(t);
  if(i > 0){
    b.enemies.splice(i, 1);
    b.enemies.unshift(t);
    renderBattle();
    fxText(t.uid, '끌려왔다!', 'wet');
    Sound.play('wet');
    await sleep(200);
  }
};
/* 흉내 소리: 이번 턴 마지막에 쓴 카드 1장을 복제해 손에 추가 */
EFFECTS.copyLastCard = async (e, ctx) => {
  const b = ctx.battle; if(!b) return;
  const last = b.turnPlayed[b.turnPlayed.length - 1];
  if(!last){ toast('이번 턴에 쓴 카드가 없다'); return; }
  if(b.hand.length >= MAX_HAND){ toast('손패가 가득 찼다'); return; }
  const c = {uid:'cp' + (++b.copyN), id:last.id, up:last.up, copy:true};
  b.hand.push(c);
  b.newCards.add(c.uid);
  Sound.play('draw');
  renderBattle();
  toast(`「${getCardDef(last).name}」을(를) 흉내 냈다${hasSyn('sound') ? ' — 메아리: 비용 0' : ''}`);
  await sleep(250);
};
/* 장산범 울음: 적 하나의 다음 행동을 그대로 따라 함 */
EFFECTS.mimicIntent = async (e, ctx) => {
  const b = ctx.battle; if(!b) return;
  const t = resolveTargets({target:'enemy'}, ctx, 'enemy')[0];
  if(!t) return;
  const effs = mirrorEffects(t);
  if(!effs.length){ toast('흉내 낼 행동이 없다'); return; }
  fxText(t.uid, '「' + ENEMIES[t.id].moves[t.intent].name + '」 흉내!', 'st');
  Sound.play('charm');
  await sleep(300);
  await executeEffects(effs, Object.assign({}, ctx, {target:t}));
};
/* 정화 풀기: 봉인된 카드 1장의 봉인 해제 */
EFFECTS.unseal = async (e, ctx) => {
  const b = ctx.battle; if(!b) return;
  const all = b.hand.concat(b.drawPile, b.discard).filter(c => b.sealed.has(c.uid));
  if(!all.length){ toast('봉인된 카드가 없다'); return; }
  let uid = all[0].uid;
  if(all.length > 1){
    const picked = await pickBattleCard(all, '봉인을 풀 카드를 고르세요');
    uid = picked || all[0].uid;
  }
  b.sealed.delete(uid);
  delete b.sealedBy[uid];
  const c = all.find(x => x.uid === uid);
  renderBattle();
  Sound.play('ward');
  toast(`「${CARDS[c.id].name}」의 봉인이 풀렸다`);
};
/* 박수무당 「넋 정화」: 노린 요괴의 체력 절반을 깎는다. 요괴가 없으면 다음 소환 요괴 체력 절반 */
EFFECTS.purifySpirit = async (e, ctx) => {
  const b = ctx.battle; if(!b) return;
  const t = ctx.attackTarget;
  const alive = aliveSpirits();
  const sp = (t && t.kind === 'spirit' && t.hp > 0 && !t.dead) ? t : (alive.length ? pick(b.rng, alive) : null);
  if(!sp){ await EFFECTS.purify({value:1}, ctx); return; }
  fxText(sp.uid, '넋 정화!', 'st');
  Sound.play('seal');
  await sleep(250);
  await dealDamage(null, sp, Math.ceil(sp.hp / 2), {raw:true, pierce:true});
};
EFFECTS.heal = async (e, ctx) => {
  const b = ctx.battle;
  if(!b){ healRun(e.value); Sound.play('heal'); return; }
  const p = b.player;
  if(p.hp <= 0) return;
  const before = p.hp;
  p.hp = Math.min(p.maxHp, p.hp + e.value);
  if(p.hp > before){ renderBattle(); fxText('P', '+' + (p.hp - before), 'heal'); Sound.play('heal'); }
};
/* --- 런 단위 효과 (사건 · 보물 획득) --- */
EFFECTS.loseHp = async (e, ctx) => {
  if(ctx.battle){ await dealDamage(null, ctx.battle.player, e.value, {raw:true, pierce:true}); return; }
  G.run.hp = Math.max(1, G.run.hp - e.value);
  Sound.play('hit');
};
EFFECTS.healRun = async (e, ctx) => { healRun(e.value); Sound.play('heal'); };
EFFECTS.addCard = async (e, ctx) => {
  const rng = ctx.rng || Math.random;
  let id = e.id;
  if(!id){
    const pool = rewardPool().filter(k => (!e.family || CARDS[k].family === e.family) && (!e.rarity || CARDS[k].rarity === e.rarity));
    if(!pool.length) return;
    id = pick(rng, pool);
  }
  addCardToDeck(id);
  (ctx.gained = ctx.gained || []).push({kind:'card', id});
};
EFFECTS.addRelic = async (e, ctx) => {
  const rng = ctx.rng || Math.random;
  const id = e.id || rollRelicOfTier(rng, e.tier || 'common');
  if(!id){ G.run.gold += 50; (ctx.gained = ctx.gained || []).push({kind:'gold', value:50}); return; }
  gainRelic(id);
  (ctx.gained = ctx.gained || []).push({kind:'relic', id});
};
EFFECTS.removeCard = async (e, ctx) => {
  const uid = await pickFromDeck('없앨 카드를 고르세요', () => true);
  if(!uid){ ctx.cancelled = true; return; }
  const c = G.run.deck.find(x => x.uid === uid);
  G.run.deck = G.run.deck.filter(x => x.uid !== uid);
  (ctx.gained = ctx.gained || []).push({kind:'removed', id:c.id, up:c.up});
};
/* 주막 노름판: 윷 4개. 평평한 면(배) 개수 1~4 = 도·개·걸·윷, 0 = 모 */
EFFECTS.yut = async (e, ctx) => {
  const rng = ctx.rng || Math.random;
  const sticks = [0, 1, 2, 3].map(() => rng() < 0.5);
  const res = ['모','도','개','걸','윷'][sticks.filter(Boolean).length];
  await playYutAnimation(sticks, res);
  const bet = e.bet;
  if(res === '도' || res === '개'){
    G.run.gold = Math.max(0, G.run.gold - bet);
    ctx.resultText = `「${res}」! 판돈 ${bet}냥을 몽땅 잃었다. 주모가 혀를 끌끌 찬다.`;
  }else if(res === '모'){
    G.run.gold += bet;
    ctx.resultText = `「모」! 판이 뒤집혔다. 판돈이 두 배가 되어 ${bet * 2}냥을 챙겼다.`;
    Sound.play('coin');
  }else{
    ctx.resultText = `「${res}」. 본전은 건졌다. 노름꾼들이 아쉬운 입맛을 다신다.`;
  }
  (ctx.gained = ctx.gained || []).push({kind:'yut', res});
};
/* ===== 4단계 추가 효과 ===== */
EFFECTS.stripBlock = async (e, ctx) => {
  const b = ctx.battle; if(!b) return;
  for(const t of resolveTargets(e, ctx, 'enemy')){ if(t.block){ t.block = 0; renderBattle(); fxText(t.uid, '방어 해제', 'st'); } }
};
/* 업화: 대상의 불씨 × 배수 만큼 피해 (불씨는 그대로) */
EFFECTS.burnBurst = async (e, ctx) => {
  const b = ctx.battle; if(!b) return;
  const t = resolveTargets({target:'enemy'}, ctx, 'enemy')[0];
  if(!t) return;
  const v = st(t, 'burn') * (e.mult || 2);
  if(v <= 0){ fxText(t.uid, '불씨 없음', 'st'); return; }
  fxEmbers(t.uid, 20); fxFlash();
  await dealDamage(ctx.source || b.player, t, v, {raw:true, cls:'burn', sound:'burn', fire:true});
};
EFFECTS.drawPerStatus = async (e, ctx) => {
  const n = aliveEnemies().filter(x => st(x, e.status) > 0).length;
  if(n) await drawCards(n); else toast(STATUS_INFO[e.status].name + ' 걸린 적이 없다');
};
EFFECTS.drawPerSpirit = async (e, ctx) => {
  const n = aliveSpirits().length;
  if(n) await drawCards(n); else toast('내 요괴가 없다');
};
EFFECTS.spiritActAll = async (e, ctx) => {
  const b = ctx.battle; if(!b) return;
  for(const sp of b.spirits.slice()){ if(b.over) return; if(sp && sp.hp > 0 && !sp.dead) await spiritAct(sp); }
};
EFFECTS.healSpirits = async (e, ctx) => {
  for(const sp of aliveSpirits()){
    const before = sp.hp; sp.hp = Math.min(sp.maxHp, sp.hp + e.value);
    if(sp.hp > before) fxText(sp.uid, '+' + (sp.hp - before), 'heal');
  }
  renderBattle();
};
/* 되울림: 다음에 쓰는 카드가 한 번 더 발동 (cap이 있으면 그 이상 쌓이지 않음) */
EFFECTS.echo = async (e, ctx) => {
  const b = ctx.battle; if(!b) return;
  const cur = st(b.player, 'echo');
  if(e.cap && cur >= e.cap) return;
  applyStatus(b.player, 'echo', e.value || 1);
};
/* 제물: 가장 약한 내 요괴를 쓰러뜨리고 남은 체력만큼 원한 */
EFFECTS.sacrifice = async (e, ctx) => {
  const b = ctx.battle; if(!b) return;
  const sp = aliveSpirits().sort((x, y) => x.hp - y.hp)[0];
  if(!sp){ toast('제물로 바칠 요괴가 없다'); return; }
  const g = sp.hp;
  fxText(sp.uid, '제물', 'grudge');
  await killSpirit(sp);
  await EFFECTS.gainGrudge({value:g}, ctx);
};
EFFECTS.gainGrudgePerSpirit = async (e, ctx) => {
  const n = aliveSpirits().length;
  if(n) await EFFECTS.gainGrudge({value:n * e.value}, ctx); else toast('내 요괴가 없다');
};
/* 백귀행렬: 무작위 일반 요괴 소환 */
EFFECTS.summonRandom = async (e, ctx) => {
  const b = ctx.battle; if(!b) return;
  const pool = Object.keys(SPIRITS).filter(k => !SPIRITS[k].great);
  await summonSpirit(pick(b.rng, pool));
};
EFFECTS.gainMaxHp = async (e, ctx) => {
  G.run.maxHp += e.value; G.run.hp += e.value;
  if(ctx.battle){ ctx.battle.player.maxHp += e.value; ctx.battle.player.hp += e.value; renderBattle(); }
  Sound.play('heal');
};
/* 저주 카드를 덱에 추가 (런 덱에 영구로 들어가고, 전투 중이면 버린 더미에도 섞인다) */
EFFECTS.addCurse = async (e, ctx) => {
  const n = e.value || 1;
  for(let i = 0; i < n; i++){
    const inst = newCardInst(G.run, e.id, false);
    G.run.deck.push(inst);
    if(ctx.battle) ctx.battle.discard.push({uid:inst.uid, id:inst.id, up:false});
  }
  (ctx.gained = ctx.gained || []).push({kind:'curse', id:e.id, value:n});
  if(ctx.battle){
    if(ctx.source) fxText(ctx.source.uid, '「' + CARDS[e.id].name + '」 ×' + n, 'st');
    toast(`덱에 저주 「${CARDS[e.id].name}」 ${n}장이 섞였다`);
    Sound.play('seal');
    renderBattle();
    await sleep(350);
  }
};
EFFECTS.upgradeCard = async (e, ctx) => {
  const c = await upgradeFlow();
  if(c) (ctx.gained = ctx.gained || []).push({kind:'upgrade', id:c.id}); else ctx.cancelled = true;
};
EFFECTS.upgradeRandom = async (e, ctx) => {
  const rng = ctx.rng || Math.random;
  const list = shuffle(rng, G.run.deck.filter(canUpgrade)).slice(0, e.value || 1);
  list.forEach(c => { c.up = true; (ctx.gained = ctx.gained || []).push({kind:'upgrade', id:c.id}); });
};
EFFECTS.chance = async (e, ctx) => {
  const rng = ctx.rng || Math.random;
  const ok = rng() < e.p;
  ctx.resultText = ok ? e.successText : e.failText;
  await executeEffects(ok ? e.success : e.fail, ctx);
};
/* 무당의 굿판: 카드 1장을 다른 계열의 무작위 카드로 */
EFFECTS.transformCard = async (e, ctx) => {
  const uid = await pickFromDeck('바꿀 카드를 고르세요', c => CARDS[c.id].type !== 'curse');
  if(!uid){ ctx.cancelled = true; return; }
  const c = G.run.deck.find(x => x.uid === uid);
  const from = CARDS[c.id];
  const pool = rewardPool().filter(id => CARDS[id].family !== from.family);
  const to = pick(ctx.rng || Math.random, pool);
  (ctx.gained = ctx.gained || []).push({kind:'transform', from:c.id, to});
  c.id = to; c.up = false;
  codexSee('cards', to);
};
/* 해태 2페이즈: 요괴 칸 1칸 봉쇄 (그 칸의 요괴는 튕겨 나간다) */
EFFECTS.lockSlot = async (e, ctx) => {
  const b = ctx.battle; if(!b) return;
  let i = b.spirits.length - 1;
  while(i >= 0 && b.lockedSlots.includes(i)) i--;
  if(i < 0) return;
  b.lockedSlots.push(i);
  const sp = b.spirits[i];
  showBanner('요괴 칸 봉쇄');
  Sound.play('seal');
  if(sp){ fxText(sp.uid, '봉쇄되어 튕겨 나갔다', 'st'); await killSpirit(sp); }
  renderBattle();
  await sleep(400);
};
/* 천명 2페이즈: 내 요괴 하나를 빼앗아 적 편으로 (이미 빼앗긴 요괴가 살아 있으면 생략) */
EFFECTS.stealSpirit = async (e, ctx) => {
  const b = ctx.battle; if(!b) return;
  if(b.enemies.some(x => x.id === 'thrall' && x.hp > 0)) return;
  const pool = aliveSpirits();
  if(!pool.length) return;
  const sp = pool.sort((x, y) => y.hp - x.hp)[0];
  const i = b.spirits.indexOf(sp);
  b.spirits[i] = null;
  refreshSynergies();
  const t = newEnemyUnit('thrall', b.enemies.length + 10);
  t.uid = 'T' + (++b.thrallN);
  t.name = '빼앗긴 ' + sp.name; t.hp = sp.hp; t.maxHp = sp.maxHp; t.spiritId = sp.id;
  const bi = b.enemies.indexOf(ctx.source);
  b.enemies.splice(bi >= 0 ? bi + 1 : b.enemies.length, 0, t);
  chooseIntent(t);
  showBanner(sp.name + '을(를) 빼앗겼다');
  Sound.play('seal');
  renderBattle();
  await sleep(600);
};
/* 천명 3페이즈: 대봉인진 카운트다운 */
EFFECTS.startSealArray = async (e, ctx) => {
  const b = ctx.battle; if(!b) return;
  b.sealArray = e.value;
  b.sealArrayFresh = true;
  showBanner('대봉인진 · ' + e.value);
  Sound.play('seal');
  renderBattle();
  await sleep(500);
};
/* 요괴 전용 */
EFFECTS.growHp = async (e, ctx) => {
  const s = ctx.source;
  if(!s || s.kind !== 'spirit' || s.hp <= 0) return;
  s.maxHp += e.value; s.hp += e.value;
  renderBattle();
  fxText(s.uid, '체력 +' + e.value, 'heal');
  await sleep(150);
};
EFFECTS.damageFromHp = async (e, ctx) => {
  const s = ctx.source;
  if(!s || s.hp <= 0) return;
  await EFFECTS.damage({type:'damage', value:Math.floor(s.hp / (e.div || 3))}, ctx);
};
EFFECTS.summon = async (e, ctx) => { if(ctx.battle) await summonSpirit(e.spirit); };
/* 시너지 전용 */
EFFECTS.halveWetBlock = async (e, ctx) => {
  for(const t of aliveEnemies()){
    if(st(t, 'wet') > 0 && t.block > 0){
      t.block = Math.floor(t.block / 2);
      renderBattle();
      fxText(t.uid, '방어 절반', 'wet');
    }
  }
};
EFFECTS.mimicCharm = async (e, ctx) => {
  const b = ctx.battle; if(!b) return;
  if(b.mimicTurn === b.turn) return;
  const sp = aliveSpirits().find(s => s.family === 'charm' || s.family === 'sound');
  if(!sp) return;
  const cands = aliveEnemies().filter(x => mirrorEffects(x).length);
  if(!cands.length) return;
  cands.sort((x, y) => { const a = intentInfo(x), c = intentInfo(y); return ((c.value || 0) * (c.hits || 1)) - ((a.value || 0) * (a.hits || 1)); });
  const t = cands[0];
  b.mimicTurn = b.turn;
  fxClass(sp.uid, 'act');
  fxText(sp.uid, '흉내 홀림!', 'charm');
  fxText(t.uid, '「' + ENEMIES[t.id].moves[t.intent].name + '」', 'st');
  Sound.play('charm');
  await sleep(400);
  await executeEffects(mirrorEffects(t), {battle:b, source:sp, target:t});
};

/* 효과 설명문 자동 생성 */
function describeSpiritAction(x){
  switch(x.type){
    case 'damage': return (x.target === 'allEnemies' ? '모든 적에게 ' : '') + '피해 <em>' + x.value + '</em>' + (x.bonusIf ? ` (<b class="kw">${STATUS_INFO[x.bonusIf].name}</b> 적에게 <em>${x.value + x.bonus}</em>)` : '');
    case 'stripBlock': return '대상 방어도 제거';
    case 'block': return '주인에게 방어 <em>' + x.value + '</em>';
    case 'strength': return '내 요괴 모두 <b class="kw">요기</b> <em>+' + x.value + '</em>';
    case 'draw': return '카드 <em>' + x.value + '</em>장 뽑기';
    case 'echo': return '다음 카드 <b class="kw">되울림</b>';
    case 'burn': return (x.target === 'allEnemies' ? '모든 적 ' : x.target === 'randomEnemy' ? '무작위 적에게 ' : '') + '<b class="kw">불씨</b> <em>' + x.value + '</em>';
    case 'charm': return (x.target === 'randomEnemy' ? '무작위 적에게 ' : x.target === 'allEnemies' ? '모든 적 ' : '') + '<b class="kw">홀림</b> <em>' + x.value + '</em>';
    case 'dread': return '가장 강한 적의 공격 피해 <em>-' + x.value + '</em>';
    case 'gainGrudge': return '<b class="kw">원한</b> <em>+' + x.value + '</em>';
    case 'wet': return (x.target === 'allEnemies' ? '모든 적 ' : '') + '<b class="kw">젖음</b> <em>' + x.value + '</em>';
    case 'growHp': return '자기 체력 <em>+' + x.value + '</em>';
    case 'damageFromHp': return '피해 = 현재 체력의 1/' + x.div;
    default: return '';
  }
}
function describeEffect(e){
  const v = e.value;
  const pre = e.target === 'allEnemies' ? '모든 적에게 ' : e.target === 'randomEnemy' ? '무작위 적에게 ' : '';
  switch(e.type){
    case 'damage':{
      let s = pre + '피해 <em>' + v + '</em>' + (e.hits > 1 ? ' ×' + e.hits : '') + (e.scale ? ` (+<b class="kw">${STATUS_INFO[e.scale.status].name}</b>만큼)` : '');
      if(e.bonusIf) s += `. 대상에게 <b class="kw">${STATUS_INFO[e.bonusIf].name}</b>가 있으면 피해 <em>+${e.bonus}</em>`;
      return s;
    }
    case 'block': return (e.target === 'allSpirits' ? '내 요괴 모두 ' : '') + '방어 <em>' + v + '</em>' + (e.scale ? ` (+<b class="kw">${STATUS_INFO[e.scale.status].name}</b>만큼)` : '');
    case 'burn': return pre + '<b class="kw">불씨</b> <em>' + v + '</em>';
    case 'charm': return pre + '<b class="kw">홀림</b> <em>' + v + '</em>';
    case 'wet': return pre + '<b class="kw">젖음</b> <em>' + v + '</em>';
    case 'ward': return '<b class="kw">결계</b> <em>' + v + '</em>';
    case 'multiplyStatus': return `대상의 <b class="kw">${STATUS_INFO[e.status].name}</b> 스택 <em>${e.mult}배</em>`;
    case 'draw': return '카드 <em>' + v + '</em>장 뽑기';
    case 'energy': return '<b class="kw">혼력</b> <em>' + v + '</em> 획득';
    case 'gold': return '<b class="kw">엽전</b> <em>' + v + '</em> 획득';
    case 'sealCard': return '손패 카드 ' + v + '장 <b class="kw">봉인</b>';
    case 'gainGrudge': return '<b class="kw">원한</b> <em>' + v + '</em>';
    case 'selfDamage': return '자신에게 피해 <em>' + v + '</em>';
    case 'grudgeBurst': return '<b class="kw">원한</b> 스택 <em>×' + e.mult + '</em> 피해. 원한을 0으로';
    case 'pullFront': return '대상을 맨 앞으로 끌어옴';
    case 'copyLastCard': return '이번 턴 마지막에 쓴 카드 1장을 <b class="kw">복제</b>해 손에 추가';
    case 'mimicIntent': return '적 하나의 다음 행동을 그대로 따라 함';
    case 'unseal': return '<b class="kw">봉인</b>된 카드 1장의 봉인 해제';
    case 'heal': return '생명력 <em>' + v + '</em> 회복';
    case 'dread': return pre + '<b class="kw">위축</b> <em>' + v + '</em>';
    case 'stripBlock': return '대상의 방어도 제거';
    case 'burnBurst': return '대상의 <b class="kw">불씨</b> <em>×' + e.mult + '</em> 피해';
    case 'drawPerStatus': return `<b class="kw">${STATUS_INFO[e.status].name}</b> 걸린 적 수만큼 카드 뽑기`;
    case 'drawPerSpirit': return '내 요괴 수만큼 카드 뽑기';
    case 'spiritActAll': return '내 요괴가 모두 즉시 행동';
    case 'healSpirits': return '내 요괴 체력 <em>' + v + '</em> 회복';
    case 'echo': return '다음 카드 <b class="kw">되울림</b>(한 번 더 발동)';
    case 'sacrifice': return '<b class="kw">제물</b>: 가장 약한 내 요괴를 바쳐 그 체력만큼 원한';
    case 'gainGrudgePerSpirit': return '내 요괴 하나당 <b class="kw">원한</b> <em>' + v + '</em>';
    case 'summonRandom': return '무작위 요괴 <b class="kw">소환</b>';
    case 'strength': return (e.target === 'allSpirits' ? '내 요괴 모두 ' : '') + '<b class="kw">요기</b> <em>+' + v + '</em>';
    case 'summon':{
      const s = SPIRITS[e.spirit];
      return `<b class="kw">소환</b> · 체력 <em>${s.hp}</em><br>매 턴: ${s.action.map(describeSpiritAction).join(', ')}`;
    }
    default: return '';
  }
}
function describeCard(def){
  if(def.text) return def.text;
  let parts = def.effects.map(describeEffect).filter(Boolean);
  // 화톳불 둔갑처럼 대상이 있는 둔갑 카드: 불씨 앞에 '적 하나에' 표시
  if(def.type === 'guard' && def.target === 'enemy') parts = parts.map(p => p.startsWith('<b class="kw">') ? '적 하나에 ' + p : p);
  if(def.exhaust) parts.push('<b class="kw">소멸</b>');
  return parts.join('. ');
}

/* ---------------------------------------------------------------
   11. 전투 엔진
   턴 단계: turnStart → draw → playerPhase → spiritPhase(요괴 행동) → enemyPhase → turnEnd
   훅 이름: battleStart, turnStart, draw, cardPlay, playerPhaseEnd, spiritPhase, spiritAct,
            enemyPhase, turnEnd, summon, spiritDamaged, spiritDeath, enemyDeath, battleWin
   보물·시너지는 registerTriggers()로 훅에 효과를 등록한다.
---------------------------------------------------------------- */
function newEnemyUnit(id, idx){
  const d = ENEMIES[id];
  codexSee('enemies', id);
  const hp = d.minion ? d.hp : Math.round(d.hp * (d.boss ? actScale().bossHp : actScale().hp));
  return {uid:'E' + idx, kind:'enemy', id, name:d.name, hp, maxHp:hp, block:0, status:Object.assign({}, d.startStatus || {}),
    intent:null, intentTarget:'player', spiritRolled:false, aiIdx:0, history:[], seq:null, phaseDone:[], pendingPhases:[]};
}
/* 보스 페이즈: 체력이 기준 이하가 되면 다음 자기 차례에 전환 */
function checkPhase(e){
  const d = ENEMIES[e.id];
  if(!d.phases) return;
  d.phases.forEach((p, i) => {
    if(!e.phaseDone.includes(i) && e.hp <= p.below){ e.phaseDone.push(i); e.pendingPhases.push(p); }
  });
}
/* kind: 'battle' | 'elite' | 'boss' / nodeId: 지도 노드 (같은 시드·같은 노드 = 같은 전투) */
function startBattle(enemyIds, kind, nodeId){
  const run = G.run;
  const rng = makeRng(run.seed, 'battle', nodeId || 'test', run.floor);
  const L = LEADERS[run.leader];
  const b = {
    rng, kind:kind || 'battle', nodeId, turn:0, phase:'start', busy:true, over:null, finished:false,
    player:{uid:'P', kind:'player', name:L.name, hp:run.hp, maxHp:run.maxHp, block:0, status:{}},
    enemies:enemyIds.map((id, i) => newEnemyUnit(id, i)),
    spirits:new Array(spiritSlots()).fill(null), spiritN:0, lockedSlots:[], thrallN:0, sealArray:0,
    drawPile:shuffle(rng, run.deck.map(c => ({uid:c.uid, id:c.id, up:c.up}))),
    hand:[], discard:[], exhaust:[], sealed:new Set(), sealedBy:{}, pendingSeals:[],
    energy:0, maxEnergy:ENERGY_PER_TURN + relicMod('maxEnergy'), selected:null, hooks:{}, newCards:new Set(), newSeal:null,
    syn:{}, steamUsed:false, mimicTurn:0, turnPlayed:[], copyN:0,
    stats:{dealt:0, taken:0, cards:0, gold:0, summons:0},
  };
  G.battle = b;
  G.ui.renderedDead = new Set();
  G.ui.seenSpirits = new Set();
  for(const rid of run.relics){ const d = RELICS[rid]; if(d && d.triggers) registerTriggers('relic:' + rid, d.triggers, rid); }
  refreshSynergies();
  b.enemies.forEach(e => chooseIntent(e));
  G.meta.stats.battles++;
  saveMeta(); saveRun();
  setScreen('battle');
  Sound.bgm('battle');
  (async () => {
    await sleep(300);
    showBanner(b.kind === 'boss' ? '우두머리 출현' : b.kind === 'elite' ? '정예 출현' : '전투 개시');
    await sleep(650);
    await emit('battleStart');
    if(b.over){ await finishBattle(); return; }
    await beginTurn();
  })();
}
function registerTriggers(source, triggers, relicId){
  const b = G.battle;
  for(const t of triggers){
    if(!b.hooks[t.on]) b.hooks[t.on] = [];
    b.hooks[t.on].push(Object.assign({}, t, {source, relicId}));
  }
}
function checkCond(h, ctx){
  const b = G.battle;
  if(h.firstTurn && b.turn !== 1) return false;
  if(h.everyN && b.turn % h.everyN !== 0) return false;
  if(h.targetStatus && !(ctx && ctx.target && st(ctx.target, h.targetStatus) > 0)) return false;
  if(h.minGrudge && st(b.player, 'grudge') < h.minGrudge) return false;
  return true;
}
async function emit(name, ctx, force){
  const b = G.battle;
  if(!b || (b.over && !force)) return;
  ctx = ctx || {};
  for(const h of (b.hooks[name] || []).slice()){
    if(b.over && !force) return;
    if(!checkCond(h, ctx)) continue;
    if(h.relicId) flashRelic(h.relicId);
    await executeEffects(h.effects, {battle:b, source:ctx.source || b.player, target:ctx.target, spirit:ctx.spirit, force});
  }
}
/* 시너지 갱신: 필드 요괴 구성이 바뀔 때마다 호출. 발동 중인 시너지의 triggers를 훅에 등록한다. */
function refreshSynergies(){
  const b = G.battle;
  for(const k in b.hooks) b.hooks[k] = b.hooks[k].filter(h => !h.source.startsWith('syn:'));
  const cnt = {};
  aliveSpirits().forEach(s => cnt[s.family] = (cnt[s.family] || 0) + 1);
  const prev = b.syn || {};
  const newly = [];
  b.syn = {};
  for(const key in SYNERGIES){
    const sy = SYNERGIES[key];
    const on = sy.kind === 'family' ? (cnt[sy.families[0]] || 0) >= 2 : sy.families.every(f => (cnt[f] || 0) > 0);
    if(!on) continue;
    b.syn[key] = true;
    if(sy.triggers) registerTriggers('syn:' + key, sy.triggers);
    if(!prev[key]) newly.push(sy.name);
  }
  if(newly.length){ toast('시너지 발동 — ' + newly.map(n => '「' + n + '」').join(' ')); Sound.play('synergy'); }
}
function checkBattleEnd(){
  const b = G.battle;
  if(!b || b.over) return;
  if(b.player.hp <= 0) b.over = 'lose';
  else if(aliveEnemies().length === 0) b.over = 'win';
}
async function onUnitDeath(u){
  if(u.kind === 'enemy'){
    if(u.dead) return;
    u.dead = true;
    Sound.play('death');
    if(G.run) G.run.stats.kills++;
    const b = G.battle;
    const freed = Object.keys(b.sealedBy).filter(cu => b.sealedBy[cu] === u.uid);
    if(freed.length){
      freed.forEach(cu => { b.sealed.delete(cu); delete b.sealedBy[cu]; });
      toast(`${u.name}이(가) 쓰러져 봉인 ${freed.length}장이 풀렸다`);
    }
    const d = ENEMIES[u.id];
    if(d.final){
      b.enemies.filter(x => x.id === 'thrall' && x.hp > 0).forEach(x => { x.hp = 0; x.dead = true; fxText(x.uid, '풀려났다', 'st'); });
    }
    if(d.pair){
      const partner = b.enemies.find(x => x.id === d.pair && x.hp > 0);
      if(partner){
        partner.status.revive = REVIVE_TURNS;
        partner.reviveTarget = u.uid;
        showBanner('부활 카운트다운');
        fxText(partner.uid, `${REVIVE_TURNS}턴 뒤 ${u.name} 부활!`, 'st');
      }
    }
    renderBattle();
    await sleep(300);
    await emit('enemyDeath', {target:u});
  }else if(u.kind === 'spirit'){
    await killSpirit(u);
  }
  checkBattleEnd();
}
async function drawCards(n){
  const b = G.battle;
  let drew = 0;
  for(let i = 0; i < n; i++){
    if(b.hand.length >= MAX_HAND){ toast('손패가 가득 찼다'); break; }
    if(!b.drawPile.length){
      if(!b.discard.length) break;
      b.drawPile = shuffle(b.rng, b.discard);   // 버린 더미를 섞어 뽑을 더미로
      b.discard = [];
      toast('버린 더미를 섞었다');
    }
    const c = b.drawPile.pop();
    b.hand.push(c);
    b.newCards.add(c.uid);
    drew++;
  }
  if(drew){ Sound.play('draw'); renderBattle(); await sleep(260); }
}

/* --- 요괴 --- */
function freeSlot(){ const b = G.battle; return b.spirits.findIndex((s, i) => !s && !b.lockedSlots.includes(i)); }
async function summonSpirit(id){
  const b = G.battle;
  const slot = freeSlot();
  if(slot < 0){ toast('요괴 자리가 가득 찼다'); return; }
  const d = SPIRITS[id];
  let hp = d.hp, purified = false;
  if(st(b.player, 'purify') > 0){
    hp = Math.ceil(hp / 2);
    b.player.status.purify--;
    if(b.player.status.purify <= 0) delete b.player.status.purify;
    purified = true;
  }
  const sp = {uid:'S' + (++b.spiritN), kind:'spirit', id, name:d.name, family:d.family, hp, maxHp:hp, block:0, status:{}, slot};
  b.spirits[slot] = sp;
  b.stats.summons++;
  refreshSynergies();
  rollSpiritTargets();
  Sound.play('summon');
  renderBattle();
  if(purified) fxText(sp.uid, '정화: 체력 절반', 'st');
  await sleep(420);
  await emit('summon', {spirit:sp});
}
async function killSpirit(sp){
  const b = G.battle;
  if(sp.dead) return;
  sp.dead = true;
  sp.hp = 0;
  Sound.play('death');
  const el = unitEl(sp.uid);
  if(el) el.classList.add('dying');
  await sleep(420);
  const i = b.spirits.indexOf(sp);
  if(i >= 0) b.spirits[i] = null;
  toast(`${sp.name}이(가) 사라졌다`);
  const dd = SPIRITS[sp.id];
  if(dd.death && aliveEnemies().length){ fxText('P', sp.name + '의 마지막 원한', 'grudge'); await executeEffects(dd.death, {battle:b, source:sp}); }
  await emit('spiritDeath', {spirit:sp});
  refreshSynergies();
  renderBattle();
}
async function spiritAct(sp){
  const b = G.battle;
  const d = SPIRITS[sp.id];
  const alive = aliveEnemies();
  if(!alive.length) return;
  let pool = alive;
  if(d.targetRule === 'wetFirst'){ const w = alive.filter(e => st(e, 'wet') > 0); if(w.length) pool = w; }
  const target = pick(b.rng, pool);
  fxClass(sp.uid, 'act');
  Sound.play('spirit');
  await sleep(220);
  await executeEffects(d.action, {battle:b, source:sp, target});
  await sleep(220);
  if(!b.over) await emit('spiritAct', {spirit:sp, source:sp, target});
}
/* 요괴 머리 위에 표시할 다음 행동 */
function spiritIntent(sp){
  const d = SPIRITS[sp.id];
  const parts = [];
  let icon = null, grow = 0;
  for(const x of d.action){
    switch(x.type){
      case 'damage': parts.push((x.bonusIf ? `${x.value + st(sp, 'str')}/${x.value + x.bonus + st(sp, 'str')}` : `${x.value + st(sp, 'str')}`) + (x.target === 'allEnemies' ? '전체' : '')); icon = icon || 'attack'; break;
      case 'damageFromHp': parts.push(`${Math.floor((sp.hp + grow) / x.div)}`); icon = icon || 'attack'; break;
      case 'growHp': grow += x.value; parts.push('체력+' + x.value); break;
      case 'burn': parts.push('불씨' + x.value); icon = icon || 'flame'; break;
      case 'charm': parts.push('홀림' + x.value); icon = icon || 'swirl'; break;
      case 'dread': parts.push('위축' + x.value); icon = icon || 'down'; break;
      case 'gainGrudge': parts.push('원한+' + x.value); icon = icon || 'tear'; break;
      case 'wet': parts.push('젖음' + x.value + (x.target === 'allEnemies' ? '전체' : '')); icon = icon || 'drop'; break;
      case 'stripBlock': parts.push('방어해제'); break;
      case 'block': parts.push('방어' + x.value); icon = icon || 'shield'; break;
      case 'strength': parts.push('요기+' + x.value); icon = icon || 'fang'; break;
      case 'draw': parts.push('카드+' + x.value); icon = icon || 'wave'; break;
      case 'echo': parts.push('되울림'); icon = icon || 'wave'; break;
    }
  }
  return {icon:icon || 'attack', text:parts.join(' ')};
}

/* --- 적 의도 --- */
function chooseIntent(e){
  const b = G.battle, d = ENEMIES[e.id];
  let key;
  const seq = e.seq || (d.ai.type === 'cycle' ? d.ai.seq : null);
  if(seq){ key = seq[e.aiIdx % seq.length]; e.aiIdx++; }
  else key = weighted(b.rng, Object.entries(d.ai.weights));
  if(Array.isArray(key)) key = pick(b.rng, key);
  e.intent = key;
  e.history.push(key);
  e.intentTarget = 'player';
  const sp = aliveSpirits();
  e.spiritRolled = sp.length > 0;
  if(sp.length && wantsSpirit(d, d.moves[key])) e.intentTarget = pick(b.rng, sp).uid;
}
function wantsSpirit(d, mv){
  const b = G.battle;
  if(mv.targetSpirit) return true;
  return mv.intent === 'attack' && b.rng() < spiritChance(d);
}
/* 요괴가 없을 때 정한 의도는, 요괴가 처음 소환되면 한 번 더 요괴를 노릴지 굴린다 */
function rollSpiritTargets(){
  const b = G.battle;
  const sp = aliveSpirits();
  if(!sp.length) return;
  for(const e of aliveEnemies()){
    if(e.spiritRolled) continue;
    e.spiritRolled = true;
    const d = ENEMIES[e.id];
    if(wantsSpirit(d, d.moves[e.intent])) e.intentTarget = pick(b.rng, sp).uid;
  }
}
function intentInfo(e){
  const b = G.battle;
  const mv = ENEMIES[e.id].moves[e.intent];
  if(!mv) return null;
  const info = {kind:mv.intent || 'special', name:mv.name, value:null, hits:1, target:null};
  if(info.kind === 'attack'){
    const dmgE = mv.effects.find(x => x.type === 'damage');
    if(e.intentTarget !== 'player'){
      const sp = findSpirit(e.intentTarget);
      if(sp && sp.hp > 0 && !sp.dead){ info.kind = 'attackSpirit'; info.target = sp; }
      else if(aliveSpirits().length){ info.kind = 'attackSpirit'; }
    }
    if(dmgE){ info.value = calcDamage(e, null, dmgE.value); info.hits = dmgE.hits || 1; }
  }else if(info.kind === 'seal' && mv.targetSpirit && e.intentTarget !== 'player'){
    const sp = findSpirit(e.intentTarget);
    if(sp && sp.hp > 0 && !sp.dead) info.target = sp;
  }else if(info.kind === 'defend'){
    const x = mv.effects.find(x => x.type === 'block' || x.type === 'ward');
    if(x) info.value = x.value;
  }
  info.steam = hasSyn('steam') && !b.steamUsed && st(e, 'wet') > 0 && st(e, 'burn') > 0;
  info.desc = mv.effects.map(x => enemyEffectText(e, x, info)).join(', ');
  return info;
}
function enemyEffectText(e, x, info){
  switch(x.type){
    case 'damage':{
      const who = info.kind === 'attackSpirit' ? (info.target ? `요괴 「${info.target.name}」에게` : '내 요괴에게') : '대장에게';
      return who + ' 피해 ' + calcDamage(e, null, x.value) + (x.hits > 1 ? ' × ' + x.hits + '회' : '');
    }
    case 'block': return '방어도 ' + x.value + ' 획득';
    case 'ward': return '결계 ' + x.value + ' — 다음 공격 ' + x.value + '번을 무효로 한다';
    case 'sealCard': return '다음 턴 손패 카드 1장을 봉인한다';
    case 'purify': return '정화 — 다음에 소환되는 요괴의 체력 절반';
    case 'purifySpirit': return (info.target ? `요괴 「${info.target.name}」` : '내 요괴 하나') + ' 정화 — 체력 절반 (요괴가 없으면 다음 소환 요괴 체력 절반)';
    case 'cleanse': return '불씨 정화';
    case 'addCurse': return `덱에 저주 「${CARDS[x.id].name}」 ${x.value}장 추가`;
    case 'stealSpirit': return '내 요괴 하나를 빼앗아 자기 편으로 (이미 빼앗은 요괴가 살아 있으면 생략)';
    case 'startSealArray': return '대봉인진 카운트다운 시작';
    default: return '알 수 없는 행동';
  }
}

/* --- 턴 진행 --- */
/* 불씨 처리: 자기 차례 시작 시 스택만큼 피해(젖음이면 2배), 1 감소(불 시너지면 유지) */
async function tickBurn(u){
  if(st(u, 'burn') <= 0) return;
  const b = G.battle;
  let v = u.status.burn;
  if(st(u, 'wet') > 0) v *= 2;
  const charmed = st(u, 'charm') > 0;
  fxEmbers(u.uid, 14);
  if(st(u, 'wet') > 0) fxText(u.uid, '젖은 몸에 불씨 ×2', 'burn');
  await dealDamage(null, u, v, {raw:true, pierce:true, cls:'burn', sound:'burn', fire:true});
  // 조합 시너지 「화염 연쇄」: 홀림 걸린 적의 불씨 피해 절반이 옆 적에게
  if(u.kind === 'enemy' && charmed && hasSyn('fireChain') && !b.over){
    const half = Math.floor(v / 2);
    const nb = neighborEnemy(u);
    if(half > 0 && nb){
      fxText(nb.uid, '화염 연쇄', 'burn');
      fxEmbers(nb.uid, 10);
      await sleep(150);
      await dealDamage(null, nb, half, {raw:true, pierce:true, cls:'burn', sound:'burn', fire:true});
    }
  }
  if(u.status.burn && !(u.kind === 'enemy' && hasSyn('fire'))){
    u.status.burn--;
    if(u.status.burn <= 0) delete u.status.burn;
  }
  renderBattle();
  await sleep(250);
}
/* 봉인 적용: 손패에서 봉인되지 않은 카드 1장에 부적이 날아와 붙는다 */
async function applyPendingSeals(){
  const b = G.battle;
  while(b.pendingSeals.length){
    const fromUid = b.pendingSeals.shift();
    const cands = b.hand.map((c, i) => i).filter(i => !b.sealed.has(b.hand[i].uid) && CARDS[b.hand[i].id].type !== 'curse');
    if(!cands.length){ toast('봉인 부적이 허공에 흩어졌다'); continue; }
    const idx = pick(b.rng, cands);
    const card = b.hand[idx];
    await fxSealFly(fromUid, idx);
    b.sealed.add(card.uid);
    if(fromUid) b.sealedBy[card.uid] = fromUid;
    b.newSeal = card.uid;
    Sound.play('seal');
    renderBattle();
    toast(`「${CARDS[card.id].name}」이(가) 봉인되었다`);
    await sleep(450);
  }
}
async function beginTurn(){
  const b = G.battle;
  if(b.over){ await finishBattle(); return; }
  b.turn++;
  b.phase = 'start';
  b.busy = true;
  b.turnPlayed = [];
  // turnStart: 혼력 충전, 대장의 불씨 처리
  b.energy = b.maxEnergy;
  await tickBurn(b.player);
  if(b.over){ await finishBattle(); return; }
  showBanner(b.turn + '번째 밤');
  Sound.play('turn');
  renderBattle();
  await sleep(350);
  await emit('turnStart');
  if(b.over){ await finishBattle(); return; }
  // draw
  await drawCards(DRAW_PER_TURN);
  await applyPendingSeals();
  await emit('draw');
  if(b.over){ await finishBattle(); return; }
  // playerPhase
  b.phase = 'player';
  b.busy = false;
  renderBattle();
}
async function endTurn(){
  const b = G.battle;
  if(!b || b.phase !== 'player' || b.busy || b.over) return;
  b.busy = true;
  b.selected = null;
  b.phase = 'spirit';
  Sound.play('tap');
  // 저주: 턴 종료 시 손에 남아 있으면 피해
  for(const c of b.hand){
    const d = CARDS[c.id];
    if(d.endTurnDamage && !b.over){ fxText('P', '「' + d.name + '」', 'st'); await dealDamage(null, b.player, d.endTurnDamage, {raw:true, pierce:true}); }
  }
  if(b.over){ await finishBattle(); return; }
  // 남은 손패는 버린 더미로 (복제 카드는 사라진다)
  b.discard.push(...b.hand.filter(c => !c.copy));
  b.hand = [];
  renderBattle();
  await emit('playerPhaseEnd');
  await sleep(200);
  // spiritPhase: 요괴가 왼쪽부터 자동 행동
  if(aliveSpirits().length){ showBanner('요괴 행동'); await sleep(450); }
  await emit('spiritPhase');
  for(const sp of b.spirits.slice()){
    if(b.over) break;
    if(sp && sp.hp > 0 && !sp.dead && b.spirits.includes(sp)) await spiritAct(sp);
  }
  if(b.over){ await finishBattle(); return; }
  // enemyPhase
  b.phase = 'enemy';
  renderBattle();
  Sound.play('enemyturn');
  await sleep(300);
  await emit('enemyPhase');
  for(const e of b.enemies.slice()){
    if(b.over) break;
    if(e.hp <= 0) continue;
    await enemyAct(e);
    await sleep(250);
  }
  if(b.over){ await finishBattle(); return; }
  // turnEnd: 대장의 방어도(둔갑)는 턴 종료 시 사라진다. 홀림·젖음은 1 감소.
  b.phase = 'end';
  if(b.player.block){ b.player.block = 0; fxText('P', '둔갑이 풀렸다', 'blk'); }
  aliveSpirits().forEach(sp => { sp.block = 0; });
  // 대봉인진 카운트다운 (0이 되면 패배)
  if(b.sealArray > 0){
    if(b.sealArrayFresh) b.sealArrayFresh = false;
    else{
      b.sealArray--;
      showBanner('대봉인진 · ' + b.sealArray);
      if(b.sealArray <= 0){ b.over = 'lose'; b.loseReason = 'sealArray'; Sound.play('seal'); await sleep(600); await finishBattle(); return; }
    }
  }
  for(const e of aliveEnemies()){
    for(const k of ['charm','wet']){
      if(e.status[k]){ e.status[k]--; if(e.status[k] <= 0) delete e.status[k]; }
    }
  }
  // 대장승: 부활 카운트다운
  for(const e of aliveEnemies()){
    if(!st(e, 'revive')) continue;
    e.status.revive--;
    if(e.status.revive > 0){ fxText(e.uid, '부활까지 ' + e.status.revive, 'st'); continue; }
    delete e.status.revive;
    const t = b.enemies.find(x => x.uid === e.reviveTarget);
    e.reviveTarget = null;
    if(t && t.hp <= 0){
      t.hp = Math.floor(t.maxHp / 2); t.dead = false; t.status = {}; t.block = 0;
      G.ui.renderedDead.delete(t.uid);
      showBanner(t.name + ' 부활');
      Sound.play('summon');
      renderBattle();
      fxText(t.uid, '되살아났다!', 'st');
      await sleep(600);
    }
  }
  await emit('turnEnd');
  if(b.over){ await finishBattle(); return; }
  b.enemies.forEach(e => { if(e.hp > 0) chooseIntent(e); });
  renderBattle();
  await sleep(200);
  await beginTurn();
}
async function enemyAct(e){
  const b = G.battle;
  // 적의 방어도는 자기 차례가 시작될 때 사라진다
  if(e.block){ e.block = 0; renderBattle(); }
  // 조합 시너지 「증기」: 젖음+불씨가 같이 걸린 적의 행동 취소 (전투당 1회) — 불씨가 터지기 전 상태로 판정
  const steam = hasSyn('steam') && !b.steamUsed && st(e, 'wet') > 0 && st(e, 'burn') > 0;
  await tickBurn(e);
  if(e.hp <= 0 || b.over) return;
  // 보스 페이즈 전환
  while(e.pendingPhases.length){
    const p = e.pendingPhases.shift();
    showBanner(p.name);
    fxFlash();
    Sound.play('enemyturn');
    await sleep(700);
    await executeEffects(p.effects, {battle:b, source:e});
    if(p.seq){ e.seq = p.seq; e.aiIdx = 0; chooseIntent(e); }
    renderBattle();
    await sleep(300);
    if(b.over) return;
  }
  if(steam){
    b.steamUsed = true;
    showBanner('증기');
    fxText(e.uid, '김이 서려 행동 취소!', 'ward');
    Sound.play('burn');
    delete e.status.dread;
    renderBattle();
    await sleep(600);
    return;
  }
  const mv = ENEMIES[e.id].moves[e.intent];
  if(!mv) return;
  let attackTarget = null;
  if(mv.targetSpirit && e.intentTarget !== 'player') attackTarget = findSpirit(e.intentTarget);
  if(mv.effects.some(x => x.type === 'damage')){
    if(e.intentTarget !== 'player') attackTarget = findSpirit(e.intentTarget) || {kind:'spirit', hp:0, dead:true};
    // 홀림: 50% 확률(「갈팡질팡」이면 무조건)로 같은 편 포함 무작위 대상
    if(st(e, 'charm') > 0 && (hasSyn('charm') || b.rng() < 0.5)){
      const pool = [b.player, ...aliveSpirits(), ...aliveEnemies().filter(x => x !== e)];
      attackTarget = pick(b.rng, pool);
      fxText(e.uid, '홀렸다! → ' + attackTarget.name, 'charm');
      Sound.play('charm');
      await sleep(450);
    }
  }
  fxText(e.uid, mv.name, 'st');
  await sleep(300);
  await executeEffects(mv.effects, {battle:b, source:e, attackTarget});
  if(e.status.dread){ delete e.status.dread; renderBattle(); }
}
function cardBlockReason(inst){
  const b = G.battle;
  const def = getCardDef(inst);
  if(b.sealed.has(inst.uid) && !relicMod('sealedPlayable')) return '봉인된 카드다. 이번 전투에서는 쓸 수 없다';
  if(def.unplayable) return '저주 카드는 사용할 수 없다';
  if(def.type === 'spirit' && freeSlot() < 0) return '요괴 자리가 가득 찼다';
  if(cardCost(inst) > b.energy) return '혼력이 부족하다';
  return null;
}
async function playCard(idx, target, at){
  const b = G.battle;
  if(!b || b.phase !== 'player' || b.busy || b.over) return false;
  const inst = b.hand[idx];
  if(!inst) return false;
  const def = getCardDef(inst);
  const why = cardBlockReason(inst);
  if(why){ toast(why); Sound.play('error'); b.selected = null; renderBattle(); return false; }
  if(def.target === 'enemy' && (!target || target.hp <= 0)) target = aliveEnemies()[0];
  b.busy = true;
  b.selected = null;
  b.energy -= cardCost(inst);
  b.hand.splice(idx, 1);
  Sound.play('card');
  fxCardPlay(def, at, inst.copy);
  renderBattle();
  await sleep(180);
  await executeEffects(def.effects, {battle:b, source:b.player, target, card:def});
  // 되울림: 한 번 더 발동
  if(st(b.player, 'echo') > 0 && !b.over){
    b.player.status.echo--; if(b.player.status.echo <= 0) delete b.player.status.echo;
    fxText('P', '되울림!', 'st'); Sound.play('charm');
    await sleep(250);
    if(def.target === 'enemy' && (!target || target.hp <= 0)) target = aliveEnemies()[0];
    await executeEffects(def.effects, {battle:b, source:b.player, target, card:def});
  }
  if(def.exhaust) b.exhaust.push(inst);      // 소멸
  else if(!inst.copy) b.discard.push(inst);  // 복제 카드는 사용 후 사라진다
  b.turnPlayed.push({id:inst.id, up:inst.up});
  b.stats.cards++;
  if(!b.over) await emit('cardPlay', {card:def});
  b.busy = false;
  renderBattle();
  if(b.over) await finishBattle();
  return true;
}
async function finishBattle(){
  const b = G.battle;
  if(!b || b.finished) return;
  b.finished = true;
  b.busy = true;
  const run = G.run;
  const win = b.over === 'win';
  if(win) await emit('battleWin', {}, true);
  run.hp = Math.max(0, Math.min(b.player.hp, run.maxHp));
  if(win) G.meta.stats.wins++; else G.meta.stats.losses++;
  saveMeta();
  Sound.play(win ? 'victory' : 'defeat');
  showBanner(win ? (b.kind === 'boss' ? '대장승 격파!' : '승리') : '패배');
  await sleep(1300);
  if(run.mode === 'run'){
    G.battle = null;
    Sound.bgm('map');
    if(!win){ G.ui.loseReason = b.loseReason || null; endRun(false); return; }
    if(b.kind === 'battle'){ run.stats.battles++; run.actBattles++; }
    if(b.kind === 'elite') run.stats.elites++;
    if(b.kind === 'boss' && run.act >= ACT_COUNT){ G.ui.endingStep = 0; setScreen('ending'); return; }
    run.rewardState = makeReward(b.kind, b.nodeId);
    saveRun();
    setScreen('reward');
    return;
  }
  G.ui.result = {mode:'test', win, turns:b.turn, dealt:b.stats.dealt, taken:b.stats.taken, cards:b.stats.cards, gold:b.stats.gold,
    summons:b.stats.summons, hp:run.hp, maxHp:run.maxHp, enemies:b.enemies.map(e => e.name), seed:run.seed};
  G.battle = null;
  Sound.bgm('map');
  setScreen('result');
}
/* 테스트용: 무작위 조합(1~3명)과 전투 */
function startTestBattle(mode){
  G.ui.mode = mode;
  const seed = randomSeedString();
  const deck = mode === 'test' ? TEST_DECK : mode === 'family' ? FAMILY_TEST_DECK : STARTER_DECK;
  G.run = newRun(deck, seed, 'test');

}

    body += `<p style="font-size:11px;color:var(--muted);margin-top:8px">진행 상황은 노드에 들어가고 나올 때마다 자동 저장된다. 전투 도중에 끄면 그 전투를 처음부터 다시 한다.</p>`;
    body += `<div style="margin-top:14px;text-align:center"><button class="btn small" data-action="abandonRun">이번 행렬 포기</button></div>`;
  }else if(G.screen === 'battle' && G.battle){
    body += `<div class="toggle-row"><span>전투 시드</span><b style="color:var(--lamp2)">${esc(G.run.seed)}</b></div>`;
    body += `<div style="margin-top:14px;text-align:center"><button class="btn small" data-action="giveUp">전투 포기</button></div>`;
  }else{
    body += `<div style="margin-top:14px;text-align:center"><button class="btn small" data-action="resetAll">기록 초기화</button></div>`;
  }
  showModal(modalFrame('설정', body));
}
function showRules(){

    <div class="info-row"><div><b>카드 사용</b><p>카드를 위로 끌어 적 위에 놓으면 사용한다. 대상이 없는 카드는 위로 끌어올리기만 하면 된다. 탭해서 고른 뒤 적을 탭해도 된다. 길게 누르면 상세 설명.</p></div></div>
    <div class="info-row"><div><b>요괴</b><p>${CARD_TYPES.spirit.desc} 체력이 0이 되면 사라진다.</p></div></div>
    <div class="info-row"><div><b>적의 의도</b><p>칼+숫자 = 대장 공격 · 칼+요괴 = 내 요괴 공격 · 방패 = 방어/결계 · 부적 = 봉인/정화 · 물음표 = 특수 행동</p></div></div>
    <div class="info-row"><div><b>방어(둔갑)</b><p>${KEYWORDS['방어']}</p></div></div>

    <div class="info-row"><div><b style="color:#ffd9a0">시너지</b><p>필드 요괴 구성에 따라 발동한다. 발동 중인 칸은 계열 색으로 빛나고, 위쪽에 이름 배지가 뜬다.</p></div></div>
    ${synergyRowsHtml(false)}
    <div class="info-row"><div><b>승패</b><p>적을 모두 쓰러뜨리면 승리, 대장의 생명력이 0이 되면 패배. 런에서는 생명력이 전투 사이에 이어진다.</p></div></div>
    <div class="info-row"><div><b>지도와 막</b><p>막마다 15층. 아래에서 위로 올라간다. 15층의 우두머리를 쓰러뜨리면 생명력 최대치의 25%를 회복하고 보스 보물 3개 중 하나를 골라 다음 막으로 간다. 1막 산골 고갯길(대장승) → 2막 한양 도성(해태 석상) → 3막 봉요사 본진(천명).</p></div></div>
    <div class="info-row"><div><b style="color:#e2552b">해태 석상</b><p>불 계열 피해를 받을 때마다 「정의의 불」이 쌓이고 그만큼 반격한다. 체력 절반 이하에서 요괴 칸 1칸을 봉쇄하고 더 세게 친다.</p></div></div>
    <div class="info-row"><div><b style="color:#7fbfb2">천명</b><p>1페이즈: 매 턴 손패 2장 봉인 + 공격. 2페이즈(체력 200 이하): 내 요괴 하나를 빼앗아 자기 편으로. 3페이즈(100 이하): 대봉인진 카운트다운 5턴 — 0이 되면 패배.</p></div></div>
    <div class="info-row"><div><b style="color:#c8622a">대장승</b><p>천하대장군과 지하여장군 한 쌍. 하나가 쓰러지면 남은 쪽이 ${REVIVE_TURNS}턴 뒤 짝을 최대 체력 절반으로 되살린다. 같은 턴에 둘 다 쓰러뜨리거나, 카운트다운 안에 남은 쪽을 처치하면 승리.</p></div></div>`;
  showModal(modalFrame('전투 규칙', body));
}

/* ---------------------------------------------------------------
   14. 렌더링
---------------------------------------------------------------- */
function cardHtml(def, opts){
  opts = opts || {};
  const fam = FAMILIES[def.family];
  const costVal = opts.cost !== undefined ? opts.cost : def.cost;
  const cost = def.cost < 0 ? '' : `<div class="c-cost">${coinSvg()}<b ${costVal < def.cost ? 'style="color:#9fffb0"' : ''}>${costVal}</b></div>`;
  const seal = opts.sealed ? `<div class="seal-tag ${opts.sealNew ? 'stick' : ''}">${svgWrap(ART.talisman(), '0 0 40 60')}</div>` : '';
  const desc = describeCard(def).replace(/<b class="kw">([^<]+)<\/b>/g, (m, k) => KEYWORDS[k] ? `<b class="kw" data-kw="${k}">${k}</b>` : m);
  return `<div class="card fam-${def.family} type-${def.type} ${def.upgraded ? 'upg' : ''} ${opts.sealed ? 'sealed' : ''} ${opts.cls || ''}" ${opts.attrs || ''} ${opts.style ? `style="${opts.style}"` : ''}>
    ${cost}
    ${opts.copy ? '<div class="copy-tag">복제</div>' : ''}
    <div class="c-name">${esc(def.name)}</div>
    <div class="c-art">${art(def.art)}</div>
    <div class="c-type">${CARD_TYPES[def.type].name} · ${fam.name}</div>
    <div class="c-rar rar-${def.rarity}" title="${RARITY_NAME[def.rarity] || ''}"></div>
    <div class="c-desc ${descLenCls(desc)}"><span>${desc}</span></div>
    ${seal}
  </div>`;
}
/* 설명이 길면 글자를 줄인다 */
function descLenCls(html){
  const n = html.replace(/<[^>]+>/g, '').length;
  return n > 52 ? 'xlong' : n > 38 ? 'long' : '';
}
function statusesHtml(u){
  return `<div class="statuses">${Object.keys(u.status).filter(k => STATUS_INFO[k]).map(k => {
    const si = STATUS_INFO[k];
    return `<span class="st ${si.cls}">${STATUS_ICON[si.icon] || ''}${u.status[k]}</span>`;
  }).join('')}</div>`;
}
function hpbarHtml(u){
  return `<div class="hpbar"><div class="fill" style="width:${Math.max(0, u.hp / u.maxHp * 100)}%"></div>
    <div class="num">${u.hp}/${u.maxHp}</div>${u.block && u.kind !== 'player' ? `<div class="blk">${u.block}</div>` : ''}</div>`;
}
function topbarHtml(){
  const b = G.battle, run = G.run;
  const where = run.mode === 'run' ? `${run.act}막 ${run.floor}/${ACT1_FLOORS}층` : '시험';
  return `<div class="topbar">
    <div class="tb-stat tb-hp">${art('heart')}${b ? b.player.hp : run.hp}/${run.maxHp}</div>
    <div class="tb-stat tb-gold">${coinSvg()}${run.gold}</div>
    <div class="tb-relics">${run.relics.map(id => `<button class="relic ${id === 'jipsin' && run.flags.sandalUsed ? 'used' : ''}" data-action="relicInfo" data-id="${id}">${art(RELICS[id].art)}</button>`).join('')}</div>
    <div class="tb-floor">${where}${b ? '<br>' + b.turn + '번째 밤' : ''}</div>
    <button class="tb-btn" data-action="deck" title="덱 보기">${art('deckicon')}<span class="cnt">${run.deck.length}</span></button>
    <button class="tb-btn ${G.meta.settings.fast ? 'on' : ''}" data-action="toggleFast" title="애니메이션 2배속"><b style="font-size:12px">2×</b></button>
    <button class="tb-btn" data-action="settings" title="설정">${art('menu')}</button>
  </div>`;
}
/* 요괴 칸 테두리 색: 같은 계열 시너지면 계열 색으로 강하게, 조합 시너지에만 참여하면 점선 */
function slotGlow(sp){
  if(!sp) return {cls:'', color:''};
  const color = FAMILIES[sp.family].color;
  if(hasSyn(sp.family)) return {cls:'syn', color};
  for(const k in SYNERGIES){
    const sy = SYNERGIES[k];
    if(sy.kind === 'combo' && hasSyn(k) && sy.families.includes(sp.family)) return {cls:'combo', color};
  }
  return {cls:'', color:''};
}
function spiritIntentIcon(icon){
  return icon === 'attack' ? svgWrap(INTENT_ICON.attack, '0 0 24 24') : (STATUS_ICON[icon] || '');
}

const SCREENS = {};
SCREENS.title = () => {
  const has = !!loadRun();

      <div class="hanja">百鬼夜行</div>
      <h1>백귀야행</h1>
      <p>백 년에 한 번, 요괴들의 마지막 행렬</p>
      <div class="stage-tag">4단계 · 1~3막 완주판</div>
    </div>

        ${has ? `<button class="btn primary" data-action="continue">이어하기</button>` : ''}
        <button class="btn ${has ? '' : 'primary'}" data-action="newRun">새 행렬</button>
        <button class="btn ghost" data-action="settings">설정</button>
        <div style="display:flex;gap:10px"><button class="btn ghost small" style="flex:1" data-action="testMenu">시험 전투</button><button class="btn ghost small" style="flex:1" data-action="rules">전투 규칙</button></div>
      </div>

    </div>
  </div>`;
};

SCREENS.battle = () => {
  const b = G.battle, run = G.run;
  if(!b) return '';
  const selInst = b.selected !== null && b.selected !== undefined ? b.hand[b.selected] : null;
  const sel = selInst ? getCardDef(selInst) : null;
  const targeting = sel && sel.target === 'enemy' && !cardBlockReason(selInst);
  const single = b.enemies.length === 1 ? 'single' : '';
  const showIntent = b.phase !== 'enemy' && b.phase !== 'end';
  /* 2. 적 영역 */
  const enemies = b.enemies.map(e => {
    let deadCls = '', reviveHtml = '';
    const reviver = e.hp <= 0 ? b.enemies.find(x => x.hp > 0 && x.reviveTarget === e.uid && st(x, 'revive') > 0) : null;
    if(reviver){ deadCls = 'reviving'; reviveHtml = `<div class="revive-count">${st(reviver, 'revive')}</div>`; }
    else if(e.hp <= 0){ deadCls = G.ui.renderedDead.has(e.uid) ? 'gone' : 'dead'; G.ui.renderedDead.add(e.uid); }
    const ed = ENEMIES[e.id];
    const ii = e.hp > 0 && showIntent ? intentInfo(e) : null;
    let intent = '';
    if(ii){
      const num = (ii.kind === 'attack' || ii.kind === 'attackSpirit') && ii.value !== null ? `<span>${ii.value}${ii.hits > 1 ? '×' + ii.hits : ''}</span>` : '';
      const tgt = ii.target ? `<span class="itgt">→${esc(ii.target.name)}</span>` : '';
      intent = `${svgWrap(INTENT_ICON[ii.kind], '0 0 24 24')}${num}${tgt}${ii.steam ? '<span class="steam-tag">증기</span>' : ''}`;
    }
    return `<div class="unit enemy ${single} ${ed.minion ? 'minion' : ''} ${ed.boss ? 'boss' : ''} ${ed.elite ? 'elite' : ''} ${deadCls} ${targeting && e.hp > 0 ? 'targetable' : ''}" data-action="unit" data-uid="${e.uid}">
      <div class="intent">${intent}</div>
      <div class="u-art">${enemyArtSvg(e.id, e)}${reviveHtml}</div>
      ${hpbarHtml(e)}
      ${statusesHtml(e)}
      <div class="u-name">${esc(e.name)}</div>
    </div>`;
  }).join('');
  /* 시너지 배지 */
  const badges = Object.keys(SYNERGIES).filter(k => hasSyn(k)).map(k => {
    const sy = SYNERGIES[k];
    const bg = sy.families.length > 1 ? `linear-gradient(90deg,${sy.families.map(f => FAMILIES[f].color).join(',')})` : FAMILIES[sy.families[0]].color;
    return `<button class="syn-badge" style="background:${bg}" data-action="synInfo">${sy.name}</button>`;
  }).join('');
  /* 3. 요괴 필드 (최대 3칸) */
  const slots = b.spirits.map((sp, i) => {
    if(!sp && b.lockedSlots.includes(i)) return `<div class="slot locked">봉쇄</div>`;
    if(!sp) return `<div class="slot empty" data-action="bg">빈 칸</div>`;
    const g = slotGlow(sp);
    const isNew = !G.ui.seenSpirits.has(sp.uid);
    G.ui.seenSpirits.add(sp.uid);
    const si = spiritIntent(sp);
    const showSi = !sp.dead && b.phase !== 'enemy';
    return `<div class="slot filled ${g.cls}" ${g.color ? `style="--sc:${g.color}"` : ''}>
      <div class="unit spirit ${isNew ? 'summoned' : ''} ${sp.dead ? 'dying' : ''}" data-action="unit" data-uid="${sp.uid}">
        <div class="sp-intent">${showSi ? spiritIntentIcon(si.icon) + esc(si.text) : ''}</div>
        <div class="u-art">${art(SPIRITS[sp.id].art)}</div>
        <div class="fam-dot" style="background:${FAMILIES[sp.family].color}"></div>
        ${hpbarHtml(sp)}
        ${statusesHtml(sp)}
        <div class="u-name">${esc(sp.name)}</div>
      </div>
    </div>`;
  }).join('');
  /* 4. 대장 영역 */
  let orbs = '';
  const orbCount = Math.max(b.maxEnergy, b.energy);
  for(let i = 0; i < orbCount; i++) orbs += `<div class="orb ${i < b.energy ? 'on' : ''} ${i >= b.maxEnergy ? 'extra' : ''}"></div>`;
  /* 5. 손패 — 부채꼴 */
  const W = Math.min($('#app').clientWidth || 400, 480);
  const n = b.hand.length, cw = 88;
  const spacing = n > 1 ? Math.min(cw - 4, (W - 48 - cw) / (n - 1)) : 0;
  const total = spacing * (n - 1) + cw;
  const start = (W - total) / 2;
  const hand = b.hand.map((c, i) => {
    const def = getCardDef(c);
    const off = i - (n - 1) / 2;
    const isSel = b.selected === i;
    const rot = isSel ? 0 : off * 3;
    const y = isSel ? -46 : Math.abs(off) * Math.abs(off) * 3;
    const scale = isSel ? 1.3 : 1;
    const left = isSel ? clamp(start + i * spacing, 22, W - cw - 22) : start + i * spacing;
    const sealed = b.sealed.has(c.uid);
    const dim = (cardBlockReason(c) || b.phase !== 'player') ? 'dim' : '';
    const isNew = b.newCards.has(c.uid);
    const baseT = `translateY(${y}px) rotate(${rot}deg) scale(${scale})`;
    return cardHtml(def, {cls:`${dim} ${isSel ? 'sel' : ''} ${isNew ? 'drawin' : ''}`, sealed, sealNew:b.newSeal === c.uid,
      cost:cardCost(c), copy:c.copy,
      attrs:`data-idx="${i}"`,
      style:`left:${left}px;transform:${baseT};z-index:${isSel ? 60 : i + 1};${isNew ? `animation-delay:${(i % 5) * 60}ms` : ''}`});
  }).join('');
  b.newCards.clear();
  b.newSeal = null;
  const phaseText = b.phase === 'enemy' ? '적의 차례…' : b.phase === 'spirit' ? '요괴 행동…' : '';
  const hint = sel ? (targeting ? '대상 적을 탭하거나 카드를 적 위로 끌어 놓으세요' : (cardBlockReason(selInst) || '한 번 더 탭하거나 위로 끌어올리면 사용')) : (phaseText || (b.phase === 'player' ? '카드를 위로 끌어 사용 · 길게 누르면 설명' : ''));
  return `<div class="screen battle">
    <div class="bgart">${actBackground()}</div>
    ${topbarHtml()}
    <div class="b-enemies" data-action="bg">${b.sealArray > 0 ? `<div class="seal-array">대봉인진 완성까지<b>${b.sealArray}</b></div>` : ''}${enemies}</div>
    <div class="syn-badges">${badges || '<span class="syn-empty">같은 계열 2마리 · 다른 계열 조합으로 시너지 발동</span>'}</div>
    <div class="b-spirits">${slots}</div>
    <div class="b-leader">
      <div class="leader-portrait" data-action="unit" data-uid="P">
        <div class="u-art">${art(LEADERS[run.leader].art)}</div>
        ${b.player.block ? `<div class="blkbadge">${b.player.block}</div>` : ''}
      </div>
      <div class="leader-info">
        <div class="nm">${esc(LEADERS[run.leader].name)}<small>${LEADERS[run.leader].title}</small></div>
        ${hpbarHtml(b.player)}
        ${statusesHtml(b.player)}
      </div>
      <div class="orbs-wrap"><div class="orbs">${orbs}</div><span>혼력 ${b.energy}/${b.maxEnergy}</span></div>
    </div>
    <div class="b-hand" id="hand">${hand}</div>
    <div class="b-bottom">
      <button class="pile" data-action="pile" data-pile="drawPile"><svg viewBox="0 0 14 18"><rect x="1" y="1" width="12" height="16" rx="2" fill="#f2e8d0" stroke="#1b1512" stroke-width="1.5"/></svg>뽑기 ${b.drawPile.length}</button>
      <button class="pile" data-action="pile" data-pile="discard"><svg viewBox="0 0 14 18"><rect x="1" y="1" width="12" height="16" rx="2" fill="#8a7a68" stroke="#1b1512" stroke-width="1.5"/></svg>버림 ${b.discard.length}</button>
      <div class="hint">${hint}</div>
      <button class="btn primary small endturn" data-action="endTurn" ${b.phase !== 'player' || b.busy ? 'disabled' : ''}>턴 종료</button>
    </div>
  </div>`;
};

SCREENS.result = () => {

        <div class="result-stats">

          <div><span>정예 처치</span><b>${r.elites}</b></div>

          <div><span>남은 엽전</span><b>${r.gold}</b></div>
          <div><span>걸린 시간</span><b>${fmtTime(r.time)}</b></div>
          <div><span>시드</span><b>${esc(r.seed)}</b></div>
        </div>
      </div>
      <div class="panel-foot">
        <button class="btn ghost" data-action="toTitle">처음으로</button>
        <button class="btn primary" data-action="newRun">새 행렬</button>
      </div>
    </div>`;
  }

let drag = null;
const LONG_PRESS_MS = 480;
function onCardTap(idx){
  const b = G.battle;
  if(!b || b.phase !== 'player' || b.busy) return;
  const inst = b.hand[idx];
  if(!inst) return;
  const def = getCardDef(inst);
  const why = cardBlockReason(inst);
  if(b.selected === idx){
    if(why){ toast(why); Sound.play('error'); return; }
    if(def.target === 'enemy'){
      const alive = aliveEnemies();
      if(alive.length === 1) playCard(idx, alive[0]);
      else toast('대상 적을 탭하세요');
    }else playCard(idx, null);
    return;
  }
  if(why){ toast(why); Sound.play('error'); }
  b.selected = idx;
  Sound.play('tap');
  renderBattle();
}
document.addEventListener('pointerdown', e => {
  Sound.init(); Sound.resume();
  const el = e.target.closest('.b-hand .card');
  if(!el || !G.battle || overlayOpen() || drag) return;
  e.preventDefault();
  const idx = +el.dataset.idx;
  drag = {el, idx, pid:e.pointerId, x0:e.clientX, y0:e.clientY, moved:false, long:false, blocked:false, enemyUid:null, inPlay:false};
  try{ el.setPointerCapture(e.pointerId); }catch(_){}
  drag.timer = setTimeout(() => {
    if(drag && !drag.moved){
      drag.long = true;
      const inst = G.battle && G.battle.hand[drag.idx];
      if(inst) showCardDetail(inst);
    }
  }, LONG_PRESS_MS);
});
document.addEventListener('pointermove', e => {
  if(!drag || e.pointerId !== drag.pid) return;
  const dx = e.clientX - drag.x0, dy = e.clientY - drag.y0;
  if(!drag.moved){
    if(Math.hypot(dx, dy) < 10 || drag.long) return;
    clearTimeout(drag.timer);
    drag.moved = true;
    const b = G.battle;
    if(!b || b.phase !== 'player' || b.busy){ drag.blocked = true; return; }
    drag.el.classList.add('dragging');
    document.querySelectorAll('.b-hand .card.sel').forEach(c => { if(c !== drag.el) c.classList.remove('sel'); });
    b.selected = null;
  }
  if(drag.blocked) return;
  drag.el.style.transform = `translate(${dx}px, ${dy}px) rotate(0deg) scale(1.08)`;
  const b = G.battle;
  const inst = b.hand[drag.idx];
  const def = getCardDef(inst);
  const under = document.elementFromPoint(e.clientX, e.clientY);
  const en = under && under.closest('.unit.enemy:not(.dead):not(.gone)');
  document.querySelectorAll('.unit.enemy.drop-hover').forEach(x => { if(x !== en) x.classList.remove('drop-hover'); });
  const handTop = $('#hand').getBoundingClientRect().top;
  const inPlay = e.clientY < handTop - 10;
  const usable = !cardBlockReason(inst);
  let ready = false;
  if(def.target === 'enemy'){
    if(en && usable) en.classList.add('drop-hover');
    ready = usable && (!!en || (inPlay && aliveEnemies().length === 1));
  }else ready = usable && inPlay;
  drag.el.classList.toggle('ready', ready);
  drag.enemyUid = en ? en.dataset.uid : null;
  drag.inPlay = inPlay;
});
function endDrag(e, cancelled){
  if(!drag || e.pointerId !== drag.pid) return;
  clearTimeout(drag.timer);
  const d = drag;
  drag = null;
  document.querySelectorAll('.unit.enemy.drop-hover').forEach(x => x.classList.remove('drop-hover'));
  if(d.long || cancelled){ renderBattle(); return; }
  const b = G.battle;
  if(!b) return;
  if(!d.moved){ onCardTap(d.idx); return; }
  if(d.blocked){ renderBattle(); return; }
  const def = getCardDef(b.hand[d.idx]);
  const at = {x:e.clientX, y:e.clientY};
  if(def.target === 'enemy'){
    let t = d.enemyUid ? b.enemies.find(x => x.uid === d.enemyUid) : null;
    if(!t && d.inPlay && aliveEnemies().length === 1) t = aliveEnemies()[0];
    if(t){ playCard(d.idx, t, at); return; }
    if(d.inPlay) toast('적 위에 놓아야 한다');
  }else if(d.inPlay){ playCard(d.idx, null, at); return; }
  renderBattle();   // 제자리로
}
document.addEventListener('pointerup', e => endDrag(e, false));
document.addEventListener('pointercancel', e => endDrag(e, true));
document.addEventListener('contextmenu', e => { if(e.target.closest('.card')) e.preventDefault(); });
