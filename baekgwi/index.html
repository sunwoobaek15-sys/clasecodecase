      <div class="serif" style="font-size:32px;font-weight:900;color:#c9c0d8;letter-spacing:.15em;text-shadow:2px 2px 0 #000">행렬이 흩어졌다</div>
      <div class="story serif">등불이 하나둘 꺼지고, 봉인 부적이 바람에 나부낀다.\n하지만 요괴는 사라지지 않는다.\n백 년 뒤, 다시 밤길에서 만나자.</div>
      ${resultStatsHtml(r)}
      ${G.ui.newUnlock ? `<div class="seal-stamp">새 우두머리 해금: 처녀귀신 월하</div>` : ''}
    </div>
    <div class="panel-foot"><button class="btn primary" data-action="toTitle">처음으로</button></div>
  </div>`;
};
SCREENS.victory = () => {
  const r = G.ui.result;
  return `<div class="screen">
    <div class="bgart">${titleBackground()}</div>
    <div class="panel-body" style="justify-content:center;gap:16px">
      <div class="serif" style="font-size:32px;font-weight:900;color:#ffe2b0;letter-spacing:.12em;text-shadow:2px 2px 0 #1b1512,0 0 20px rgba(232,87,42,.8)">대봉인진 파괴</div>
      <div class="story serif">현무진인의 지팡이가 부러지고\n하늘을 덮던 봉인진이 산산이 흩어졌다.\n\n동이 터 오는 하늘 아래\n백귀의 행렬은 웃으며 산으로 돌아간다.\n"다음 백 년에 또 보세!"</div>
      ${resultStatsHtml(r)}
      ${r.unlocked ? `<div class="seal-stamp">야행 단계 ${G.meta.ascension.max} 해금</div>` : ''}
      ${G.ui.newUnlock ? `<div class="seal-stamp">새 우두머리 해금: 처녀귀신 월하</div>` : ''}
    </div>
    <div class="panel-foot"><button class="btn primary" data-action="toTitle">처음으로</button></div>
  </div>`;
};

SCREENS.codex = () => {
  const tab = G.ui.codexTab || 'cards';
  const cx = G.meta.codex;
  let body = '';
  if(tab === 'cards'){
    const ids = Object.keys(CARDS).filter(id => CARDS[id].rarity !== 'special');
    body = `<div class="card-grid">${ids.map(id => cx.cards[id] ? cardHtml(getCardDef({id, up:false})) : cardHtml(getCardDef({id, up:false}), {cls:'locked'})).join('')}</div>`;
  }else if(tab === 'enemies'){
    body = `<div class="codex-grid">${Object.keys(ENEMIES).map(id => {
      const d = ENEMIES[id], seen = cx.enemies[id];
      return `<div class="codex-ent ${seen ? '' : 'unseen'}"><div class="ce-art">${enemyArtSvg(id)}</div><b>${seen ? d.name : '???'}</b><p>${seen ? (d.boss ? '우두머리' : d.elite ? '정예' : '봉요사') + ' · 생명 ' + d.hp[0] : ''}</p></div>`;
    }).join('')}</div>`;
  }else{
    body = `<div class="codex-grid">${Object.keys(RELICS).map(id => {
      const d = RELICS[id], seen = cx.relics[id];
      return `<div class="codex-ent ${seen ? '' : 'unseen'}"><div class="ce-art">${art(d.art)}</div><b>${seen ? d.name : '???'}</b><p>${seen ? d.desc : ''}</p></div>`;
    }).join('')}</div>`;
  }
  const count = k => Object.keys(cx[k]).length;
  const total = {cards:Object.keys(CARDS).filter(id => CARDS[id].rarity !== 'special').length, enemies:Object.keys(ENEMIES).length, relics:Object.keys(RELICS).length};
  return `<div class="screen">
    <div class="ls-head serif"><h2>요괴 도감</h2><p>행렬이 만난 것들의 기록</p></div>
    <div class="tabs">
      <button class="tab ${tab === 'cards' ? 'on' : ''}" data-action="codexTab" data-tab="cards">카드 ${Math.min(count('cards'), total.cards)}/${total.cards}</button>
      <button class="tab ${tab === 'enemies' ? 'on' : ''}" data-action="codexTab" data-tab="enemies">봉요사 ${count('enemies')}/${total.enemies}</button>
      <button class="tab ${tab === 'relics' ? 'on' : ''}" data-action="codexTab" data-tab="relics">보물 ${count('relics')}/${total.relics}</button>
    </div>
    <div class="panel-body" style="background:rgba(0,0,0,.25)">${body}</div>
    <div class="panel-foot"><button class="btn" data-action="toTitle">돌아가기</button></div>
  </div>`;
};

/* ---------------------------------------------------------------
   22. 화면 전환 (상태 머신)
---------------------------------------------------------------- */
function render(){
  const f = SCREENS[G.screen];
  $('#screen').innerHTML = f ? f() : '';
  if(G.screen === 'map') afterMapRender();
}
function renderBattle(){ if(G.screen === 'battle' && G.battle) render(); }
function setScreen(name){
  G.screen = name;
  if(name !== 'battle'){ G.ui.renderedSpirits = new Set(); G.ui.renderedDead = new Set(); }
  render();
  if(Sound.ctx && name !== 'battle') Sound.bgm(name === 'title' || name === 'leaderSelect' || name === 'codex' ? 'map' : 'map');
}

/* ---------------------------------------------------------------
   23. 입력 처리 (이벤트 위임)
---------------------------------------------------------------- */
const ACTIONS = {};
let _busyAction = false;

ACTIONS.continue = () => {
  const r = loadRun();
  if(!r){ toast('이어갈 행렬이 없다'); render(); return; }
  G.run = r;
  G.run.stats.lastTick = Date.now();
  if(r.rewardState) setScreen('reward');
  else if(r.pendingNode) openNode(r.map.nodes[r.pendingNode]);
  else setScreen('map');
};
ACTIONS.newRun = async () => {
  if(loadRun()){
    const ok = await confirmModal('진행 중인 행렬이 있습니다. 버리고 새로 꾸릴까요?');
    if(!ok) return;
    clearRun();
  }
  G.ui.leader = G.ui.leader || 'yeonhwa';
  setScreen('leaderSelect');
};
ACTIONS.codex = () => setScreen('codex');
ACTIONS.codexTab = el => { G.ui.codexTab = el.dataset.tab; render(); };
ACTIONS.settings = () => showSettings();
ACTIONS.toggleSetting = el => {
  const k = el.dataset.key;
  G.meta.settings[k] = !G.meta.settings[k];
  saveMeta();
  showSettings();
};
ACTIONS.abandonRun = async () => {
  const ok = await confirmModal('이번 야행을 포기할까요? 기록은 패배로 남습니다.');
  if(!ok) return;
  if(G.battle){ G.battle.over = 'abandon'; G.battle.finished = true; G.battle = null; }
  Sound.bgm('map');
  endRun(false);
};
ACTIONS.resetAll = async () => {
  const ok = await confirmModal('도감·해금·야행 단계를 포함한 모든 기록을 지울까요? 되돌릴 수 없습니다.');
  if(!ok) return;
  storeDel(SAVE_META); storeDel(SAVE_RUN);
  G.meta = defaultMeta(); G.run = null;
  setScreen('title');
};
ACTIONS.toTitle = () => { G.ui.newUnlock = false; setScreen('title'); };
ACTIONS.pickLeader = el => { G.ui.leader = el.dataset.id; G.ui.seedInput = ($('#seedInput') || {}).value || ''; Sound.play('tap'); render(); };
ACTIONS.lockedLeader = el => { toast(LEADERS[el.dataset.id].unlock.text); };
ACTIONS.ascDown = () => { G.ui.seedInput = ($('#seedInput') || {}).value || ''; G.meta.ascension.selected = Math.max(0, (G.meta.ascension.selected || 0) - 1); saveMeta(); render(); };
ACTIONS.ascUp = () => { G.ui.seedInput = ($('#seedInput') || {}).value || ''; G.meta.ascension.selected = Math.min(G.meta.ascension.max, (G.meta.ascension.selected || 0) + 1); saveMeta(); render(); };
ACTIONS.embark = () => {
  const seed = ($('#seedInput') || {}).value || '';
  const asc = clamp(G.meta.ascension.selected || 0, 0, G.meta.ascension.max);
  G.ui.seedInput = '';
  startRun(G.ui.leader || 'yeonhwa', seed, asc);
};
ACTIONS.storyGo = () => { G.run.stats.lastTick = Date.now(); setScreen('map'); };
ACTIONS.deck = () => showDeck(G.run.deck, '행렬의 카드');
ACTIONS.relicInfo = el => showRelicInfo(el.dataset.id);
ACTIONS.closeModal = () => closeModal();
ACTIONS.confirmYes = () => resolveModal(true);
ACTIONS.confirmNo = () => resolveModal(false);
ACTIONS.pickCard = el => resolveModal(el.dataset.uid);
ACTIONS.node = el => {
  const id = el.dataset.id;
  if(!availableNodes().includes(id)) return;
  enterNode(id);
};

/* 전투 입력 */
ACTIONS.card = el => {
  const b = G.battle;
  if(!b || b.phase !== 'player' || b.busy) return;
  const idx = +el.dataset.idx;
  const def = getCardDef(b.hand[idx]);
  if(b.selected === idx){
    if(def.target === 'enemy'){
      const alive = aliveEnemies();
      playCard(idx, alive[0]);
    }else playCard(idx, null);
    return;
  }
  if(def.unplayable){ toast('사용할 수 없는 카드다'); Sound.play('error'); return; }
  if(def.cost > b.energy){ toast('요력이 부족하다'); Sound.play('error'); }
  b.selected = idx;
  Sound.play('tap');
  renderBattle();
};
ACTIONS.unit = el => {
  const b = G.battle;
  if(!b) return;
  const uid = el.dataset.uid;
  if(b.selected !== null && b.selected !== undefined && b.phase === 'player' && !b.busy){
    const def = getCardDef(b.hand[b.selected]);
    const e = b.enemies.find(x => x.uid === uid);
    if(def && def.target === 'enemy' && e && e.hp > 0){ playCard(b.selected, e); return; }
    if(def && def.target !== 'enemy' && (e || uid === 'P')){ playCard(b.selected, null); return; }
  }
  showUnitInfo(uid);
};
ACTIONS.bg = () => {
  const b = G.battle;
  if(b && b.selected !== null && b.selected !== undefined){ b.selected = null; renderBattle(); }
};
ACTIONS.endTurn = () => endTurn();
ACTIONS.pile = el => {
  const b = G.battle;
  if(!b) return;
  const k = el.dataset.pile;
  const title = {drawPile:'뽑을 더미 (순서 무작위)', discard:'버린 더미', exhaust:'소멸한 카드'}[k];
  showDeck(b[k], title);
};

/* 보상 */
ACTIONS.takeGold = () => {
  const r = G.run.rewardState;
  if(r.goldTaken) return;
  r.goldTaken = true; G.run.gold += r.gold; Sound.play('coin'); saveRun(); render();
};
ACTIONS.takeRelic = () => {
  const r = G.run.rewardState;
  if(r.relicTaken || !r.relic) return;
  r.relicTaken = true; gainRelic(r.relic); toast(RELICS[r.relic].name + ' 획득'); saveRun(); render();
};
ACTIONS.bossRelic = el => {
  const r = G.run.rewardState;
  if(r.relicTaken) return;
  r.relicTaken = true; gainRelic(el.dataset.id); toast(RELICS[el.dataset.id].name + ' 획득'); saveRun(); render();
};
ACTIONS.takeCard = el => {
  const r = G.run.rewardState;
  if(r.cardTaken) return;
  r.cardTaken = true; addCardToDeck(el.dataset.id, false); Sound.play('card'); toast(CARDS[el.dataset.id].name + ' — 행렬에 합류'); saveRun(); render();
};
ACTIONS.skipCards = () => { const r = G.run.rewardState; r.cardTaken = true; saveRun(); render(); };
ACTIONS.rewardDone = async () => {
  const r = G.run.rewardState;
  if(!r.goldTaken){ G.run.gold += r.gold; r.goldTaken = true; Sound.play('coin'); }
  if(r.relic && !r.relicTaken){ gainRelic(r.relic); r.relicTaken = true; }
  if(r.kind === 'boss'){
    if(r.bossRelics && r.bossRelics.length && !r.relicTaken){
      const ok = await confirmModal('우두머리의 보물을 고르지 않았습니다. 그냥 갈까요?');
      if(!ok) return;
    }
    G.run.rewardState = null; G.run.pendingNode = null; G.run.nodeState = null;
    nextAct();
    return;
  }
  completeNode();
};

/* 상점 */
ACTIONS.buyCard = el => {
  const run = G.run, s = run.nodeState, c = s.cards[+el.dataset.i];
  if(!c || c.sold) return;
  if(run.gold < c.price){ toast('엽전이 모자라오'); Sound.play('error'); return; }
  run.gold -= c.price; c.sold = true; addCardToDeck(c.id, false); Sound.play('coin');
  toast(CARDS[c.id].name + ' 구입'); saveRun(); render();
};
ACTIONS.buyRelic = el => {
  const run = G.run, s = run.nodeState, r = s.relics[+el.dataset.i];
  if(!r || r.sold) return;
  if(run.gold < r.price){ toast('엽전이 모자라오'); Sound.play('error'); return; }
  run.gold -= r.price; r.sold = true; gainRelic(r.id);
  toast(RELICS[r.id].name + ' 구입'); saveRun(); render();
};
ACTIONS.removeService = async () => {
  const run = G.run, s = run.nodeState;
  if(s.removed) return;
  if(run.gold < run.removeCost){ toast('엽전이 모자라오'); Sound.play('error'); return; }
  const uid = await pickFromDeck('씻어낼 카드를 고르세요', () => true);
  if(!uid) return;
  run.gold -= run.removeCost; run.removeCost += 25; s.removed = true;
  run.deck = run.deck.filter(c => c.uid !== uid);
  Sound.play('coin'); saveRun(); render();
};
ACTIONS.leaveNode = () => completeNode();

/* 주막 */
ACTIONS.innRest = () => {
  const run = G.run;
  const amt = Math.ceil(run.maxHp * (run.ascension >= 5 ? 0.2 : 0.3));
  const got = healRun(amt);
  Sound.play('heal');
  run.nodeState = {done:true, msg:`막걸리 한 사발에 곤히 잤다.\n생명 ${got} 회복.`};
  saveRun(); render();
};
ACTIONS.innTrain = async () => {
  const run = G.run;
  if(!run.deck.some(canUpgrade)){ toast('강화할 카드가 없다'); return; }
  const uid = await pickFromDeck('강화할 카드를 고르세요', canUpgrade);
  if(!uid) return;
  const c = run.deck.find(x => x.uid === uid);
  c.up = true;
  Sound.play('relic');
  run.nodeState = {done:true, msg:`밤새 수련했다.\n「${CARDS[c.id].name}」이(가) 「${CARDS[c.id].name}+」(으)로 강화되었다.`};
  saveRun(); render();
};

/* 보물 상자 */
ACTIONS.openChest = () => {
  const s = G.run.nodeState;
  if(s.opened) return;
  s.opened = true;
  if(s.relic){ gainRelic(s.relic); } else { G.run.gold += 50; Sound.play('coin'); }
  saveRun(); render();
};

/* 사건 */
ACTIONS.eventChoice = async el => {
  const run = G.run, s = run.nodeState;
  if(s.done) return;
  const ev = EVENTS[s.event];
  const i = +el.dataset.i;
  const c = ev.choices[i];
  if(c.req && c.req.gold && run.gold < c.req.gold) return;
  const ctx = {run, rng:makeRng(run.seed, 'event', run.act, run.pendingNode, i)};
  await executeEffects(c.effects, ctx);
  s.done = true;
  s.resultText = ctx.resultText || c.result || '';
  const g = (ctx.gained || []).map(x => x.kind === 'card' ? `카드 「${CARDS[x.id].name}」 획득` : x.kind === 'relic' ? `보물 「${RELICS[x.id].name}」 획득` : `「${CARDS[x.id].name}」 강화`);
  s.gainedText = g.join(' · ');
  saveRun(); render();
};

/* 클릭 위임 */
document.addEventListener('click', async ev => {
  Sound.init(); Sound.resume();
  if(Sound.ctx && !Sound.bgmMode) Sound.bgm(G.screen === 'battle' ? 'battle' : 'map');
  const el = ev.target.closest('[data-action]');
  if(!el) return;
  const a = el.dataset.action;
  // 오버레이가 떠 있을 때는 오버레이 안의 버튼만
  const ov = $('#overlay');
  if(ov.classList.contains('show') && !ov.contains(el)) return;
  if(el.disabled) return;
  const fn = ACTIONS[a];
  if(!fn) return;
  if(a === 'card' || a === 'unit'){ ev.stopPropagation(); }
  if(_busyAction && !['closeModal','confirmYes','confirmNo','pickCard','toggleSetting'].includes(a)) return;
  // 오버레이 바깥 영역 클릭 시 닫기는 별도 처리
  _busyAction = true;
  try{ await fn(el, ev); }
  catch(e){ console.error(e); }
  finally{ _busyAction = false; }
});
/* 모달 바깥(어두운 영역) 누르면 닫기 */
document.addEventListener('click', ev => {
  const ov = $('#overlay');
  if(ov.classList.contains('show') && ev.target === ov) closeModal();
});
/* 전투 필드 빈 곳: 카드 선택 해제 (unit/card 클릭은 위임에서 걸러짐) */

document.addEventListener('visibilitychange', () => {
  if(document.hidden){ updatePlayTime(); if(G.run && !G.battle) saveRun(); }
  else if(G.run) G.run.stats.lastTick = Date.now();
});
window.addEventListener('resize', () => { if(G.screen === 'battle') renderBattle(); });

/* ---------------------------------------------------------------
   24. 시작
---------------------------------------------------------------- */
function boot(){
  G.meta = loadMeta();
  setScreen('title');
}
boot();
/* 디버그용 노출 */
window.BAEKGWI = {G, CARDS, ENEMIES, RELICS, EVENTS, LEADERS, SPIRITS, executeEffects, startBattle, playCard, endTurn, setScreen};

</script>
</body>
</html>
