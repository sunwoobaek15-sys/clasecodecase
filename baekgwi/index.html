<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#121829">
<title>백귀야행</title>
<style>
:root{
  --night:#141a2e; --night2:#0b0f1c; --ink:#1b1512;
  --lamp:#e8572a; --lamp2:#ffb24a; --hanji:#f2e8d0;
  --fire:#e2552b; --charm:#b45fa8; --grudge:#7fbfb2; --water:#2f5d9e; --sound:#b8893a; --neutral:#8a7a68;
  --gold:#d9a93f; --hp:#c8323a; --block:#5d8fc9; --ward:#5fb8c8; --text:#efe6d2; --muted:#a59c8a;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;background:#06080f;color:var(--text);
  font-family:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","Nanum Gothic",sans-serif;
  overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation;}
button{font-family:inherit;color:inherit;border:none;background:none;cursor:pointer;}
.serif{font-family:"Nanum Myeongjo","AppleMyungjo","Batang","Noto Serif KR","Noto Serif CJK KR",serif;}
#app{position:relative;max-width:480px;height:100%;margin:0 auto;overflow:hidden;
  background:linear-gradient(180deg,#0e1426 0%,#18203a 55%,#1c1a2a 100%);box-shadow:0 0 40px rgba(0,0,0,.8);}
#app::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.55;
  background-image:
   radial-gradient(1px 1px at 12% 8%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 33% 15%,#fff 50%,transparent 51%),
   radial-gradient(1.5px 1.5px at 72% 6%,#ffe9c4 50%,transparent 51%),radial-gradient(1px 1px at 88% 19%,#fff 50%,transparent 51%),
   radial-gradient(1px 1px at 55% 24%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 8% 31%,#fff 50%,transparent 51%),
   radial-gradient(1.2px 1.2px at 92% 36%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 22% 44%,#fff 50%,transparent 51%);}
#screen{position:absolute;inset:0;}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;animation:fadeIn .35s ease;}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.bgart{position:absolute;inset:0;pointer-events:none;z-index:0;}
.bgart svg{width:100%;height:100%;display:block;}
.screen > *:not(.bgart){position:relative;z-index:1;}

/* ---------- 버튼 ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 20px;min-height:46px;border-radius:6px;
  font-size:16px;font-weight:700;letter-spacing:.05em;background:linear-gradient(180deg,#3a2a22,#241913);color:var(--hanji);
  border:2px solid var(--ink);box-shadow:0 0 0 2px #6a4a32 inset,0 4px 0 #0a0705,0 6px 12px rgba(0,0,0,.5);transition:transform .08s,filter .15s;}
.btn:active{transform:translateY(3px);box-shadow:0 0 0 2px #6a4a32 inset,0 1px 0 #0a0705;}
.btn.primary{background:linear-gradient(180deg,#e8572a,#a83218);color:#fff6e4;box-shadow:0 0 0 2px #ffb24a inset,0 4px 0 #4a1206,0 6px 16px rgba(232,87,42,.4);}
.btn.ghost{background:rgba(20,16,14,.55);box-shadow:0 0 0 1.5px #6a5a4a inset;}
.btn.small{padding:6px 12px;min-height:36px;font-size:13px;}
.btn[disabled]{filter:grayscale(1) brightness(.6);pointer-events:none;}
.btn-col{display:flex;flex-direction:column;gap:12px;align-items:stretch;width:min(300px,80%);}

/* ---------- 상단 바 ---------- */
.topbar{display:flex;align-items:center;gap:12px;padding:calc(6px + var(--safe-t)) 10px 6px;min-height:46px;
  background:linear-gradient(180deg,rgba(8,6,5,.92),rgba(20,15,12,.85));border-bottom:2px solid var(--ink);box-shadow:0 2px 0 #5a4030;font-size:15px;font-weight:800;}
.tb-stat{display:flex;align-items:center;gap:5px;white-space:nowrap;}
.tb-stat svg{width:19px;height:19px;}
.tb-hp{color:#ff8a7a;} .tb-gold{color:var(--gold);}
.tb-turn{margin-left:auto;font-size:12px;color:var(--muted);}
.tb-btn{width:38px;height:34px;border-radius:5px;background:#2a1f18;border:1.5px solid #6a4a32;display:flex;align-items:center;justify-content:center;flex:none;}
.tb-btn svg{width:20px;height:20px;}

/* ---------- 카드 ---------- */
.card{--fc:var(--neutral);position:relative;width:8.8em;height:12.6em;font-size:10px;border-radius:.7em;flex:none;
  background:radial-gradient(circle at 22% 12%,rgba(255,255,255,.4),transparent 45%),
   repeating-linear-gradient(17deg,rgba(120,90,50,.06) 0 2px,transparent 2px 5px),
   repeating-linear-gradient(-63deg,rgba(120,90,50,.05) 0 1px,transparent 1px 4px),
   radial-gradient(circle at 70% 85%,rgba(160,120,60,.18),transparent 55%),var(--hanji);
  border:.3em solid var(--fc);box-shadow:0 0 0 .15em var(--ink) inset,0 0 0 .12em var(--ink),0 .3em .6em rgba(0,0,0,.55);
  color:var(--ink);display:flex;flex-direction:column;align-items:center;transition:transform .15s ease,filter .2s,box-shadow .15s;}
.card.fam-fire{--fc:var(--fire);} .card.fam-neutral{--fc:var(--neutral);} .card.fam-charm{--fc:var(--charm);}
.card.fam-grudge{--fc:var(--grudge);} .card.fam-water{--fc:var(--water);} .card.fam-sound{--fc:var(--sound);}
.card.type-curse{--fc:#3a3036;background:repeating-linear-gradient(45deg,rgba(0,0,0,.08) 0 3px,transparent 3px 7px),#cfc4b0;}
.card .c-cost{position:absolute;left:-.9em;top:-.9em;width:3em;height:3em;z-index:2;}
.card .c-cost svg{width:100%;height:100%;}
.card .c-cost b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:1.55em;font-weight:900;color:#fff8e6;
  text-shadow:-1px -1px 0 #1b1512,1px -1px 0 #1b1512,-1px 1px 0 #1b1512,1px 1px 0 #1b1512,0 0 4px #1b1512;}
.card .c-name{font-weight:900;font-size:1.12em;margin-top:.45em;padding:0 .3em 0 1.6em;white-space:nowrap;letter-spacing:-.02em;max-width:100%;overflow:hidden;text-overflow:ellipsis;}
.card .c-art{width:6.8em;height:5em;margin-top:.3em;border:.15em solid var(--ink);border-radius:.35em;overflow:hidden;
  background:radial-gradient(circle at 50% 40%,rgba(255,255,255,.55),transparent 70%),color-mix(in srgb,var(--fc) 22%,#efe3c6);}
.card .c-art svg{width:100%;height:100%;display:block;}
.card .c-type{font-size:.75em;color:#6b5a48;margin-top:.2em;font-weight:700;letter-spacing:.05em;}
.card .c-desc{font-size:.88em;line-height:1.25;text-align:center;padding:.1em .45em 0;font-weight:600;word-break:keep-all;overflow:hidden;flex:1;display:flex;align-items:center;}
.card .c-desc span{display:block;width:100%;}
.card .c-desc em{font-style:normal;color:#a3281a;font-weight:900;}
.card .c-desc b.kw{color:#7a3a10;}
.card.lg{font-size:17px;}
.card.md{font-size:12px;}
.card.dim{filter:brightness(.62) saturate(.6);}
.card .seal-tag{position:absolute;left:50%;top:44%;width:3.4em;height:5.4em;transform:translate(-50%,-50%) rotate(-8deg);z-index:3;pointer-events:none;filter:drop-shadow(0 2px 2px rgba(0,0,0,.5));}
.card .seal-tag svg{width:100%;height:100%;}
.card .seal-tag.stick{animation:sealStick .45s ease-out;}
@keyframes sealStick{0%{transform:translate(-50%,-50%) rotate(-30deg) scale(2.2);opacity:0}60%{transform:translate(-50%,-50%) rotate(-4deg) scale(.9);opacity:1}100%{transform:translate(-50%,-50%) rotate(-8deg) scale(1)}}
.card.sealed{filter:saturate(.4) brightness(.8);}

/* ---------- 타이틀 ---------- */
.title-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:0 16px calc(28px + var(--safe-b));gap:14px;}
.title-logo{position:absolute;top:12%;left:0;right:0;text-align:center;}
.title-logo .hanja{font-size:20px;letter-spacing:.6em;color:#ffcf8a;opacity:.9;padding-left:.6em;text-shadow:0 0 12px rgba(255,140,60,.6);}
.title-logo h1{font-size:56px;font-weight:900;letter-spacing:.12em;color:#fff2da;text-shadow:0 0 2px #000,3px 3px 0 #1b1512,0 0 24px rgba(232,87,42,.7);}
.title-logo p{margin-top:8px;font-size:13px;color:#d8c9a8;letter-spacing:.1em;}
.title-foot{font-size:11px;color:var(--muted);text-align:center;}
.stage-tag{display:inline-block;margin-top:10px;border:2px solid #c8323a;color:#ff6a4a;padding:2px 8px;font-size:12px;font-weight:900;transform:rotate(-4deg);}

/* ---------- 전투 ---------- */
.b-enemies{flex:1;display:flex;justify-content:center;align-items:flex-end;gap:4px;padding:6px 6px 4px;min-height:0;}
.unit{position:relative;display:flex;flex-direction:column;align-items:center;min-width:0;transition:transform .15s;}
.unit .u-art{position:relative;}
.unit .u-art svg{width:100%;height:100%;display:block;filter:drop-shadow(0 4px 3px rgba(0,0,0,.6));}
.unit.enemy{flex:1;max-width:140px;cursor:pointer;}
.unit.enemy .u-art{width:min(100px,25vw);height:min(100px,25vw);}
.unit.enemy.single .u-art{width:min(132px,33vw);height:min(132px,33vw);}
.unit.enemy.targetable .u-art::after{content:"";position:absolute;inset:-6px;border:3px dashed var(--lamp2);border-radius:50%;animation:spin 6s linear infinite;pointer-events:none;}
.unit.enemy.drop-hover .u-art{transform:scale(1.1);}
.unit.enemy.drop-hover .u-art::after{content:"";position:absolute;inset:-8px;border:4px solid #ff6a3a;border-radius:50%;box-shadow:0 0 18px #ff6a3a;pointer-events:none;}
@keyframes spin{to{transform:rotate(360deg)}}
.unit.dead{animation:dieOut .5s forwards;pointer-events:none;}
.unit.gone{opacity:0;pointer-events:none;}
@keyframes dieOut{to{opacity:0;transform:translateY(10px) scale(.8);filter:grayscale(1) blur(2px)}}
.u-name{font-size:11px;font-weight:700;color:#e9dcc0;white-space:nowrap;text-shadow:0 1px 2px #000;max-width:100%;overflow:hidden;text-overflow:ellipsis;}
.hpbar{position:relative;width:100%;max-width:100px;height:14px;background:#2a0e0e;border:1.5px solid var(--ink);border-radius:7px;margin-top:3px;}
.hpbar .fill{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:linear-gradient(180deg,#e85a4a,#a8222a);transition:width .3s;}
.hpbar .num{position:absolute;inset:0;font-size:10.5px;line-height:12px;text-align:center;font-weight:800;color:#fff;text-shadow:0 0 2px #000,0 0 2px #000;}
.hpbar .blk{position:absolute;left:-11px;top:-5px;width:23px;height:23px;display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:900;color:#fff;
  background:var(--block);border:1.5px solid var(--ink);border-radius:5px 5px 11px 11px;text-shadow:0 0 2px #000;}
.statuses{display:flex;flex-wrap:wrap;justify-content:center;gap:3px;min-height:18px;margin-top:3px;max-width:120px;}
.st{display:inline-flex;align-items:center;gap:1px;font-size:11px;font-weight:900;color:#fff;padding:0 4px 0 2px;border-radius:9px;line-height:16px;border:1.5px solid var(--ink);text-shadow:0 0 2px #000;white-space:nowrap;}
.st svg{width:13px;height:13px;}
.st.burn{background:#c8441e;} .st.ward{background:#2f7f8f;}
.intent{display:flex;align-items:center;gap:2px;height:28px;font-size:16px;font-weight:900;color:#fff;text-shadow:0 0 3px #000,0 0 3px #000;animation:intentBob 1.6s infinite ease-in-out;}
.intent svg{width:26px;height:26px;}
@keyframes intentBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.u-art.warded{animation:wardPulse .5s;}
@keyframes wardPulse{0%{filter:drop-shadow(0 0 0 #5fb8c8)}50%{filter:drop-shadow(0 0 16px #8ff0ff) brightness(1.4)}100%{filter:none}}

.b-spirits{display:flex;align-items:center;justify-content:center;gap:10px;padding:4px 12px;height:66px;flex:none;}
.slot{width:54px;height:54px;border-radius:50%;border:2px dashed rgba(255,214,150,.25);display:flex;align-items:center;justify-content:center;font-size:9.5px;color:rgba(255,214,150,.35);text-align:center;line-height:1.2;}
.b-spirits .lbl{font-size:10px;color:rgba(255,214,150,.4);writing-mode:vertical-rl;letter-spacing:.2em;}

.b-leader{display:flex;align-items:center;gap:10px;padding:4px 12px;height:88px;flex:none;
  background:linear-gradient(90deg,rgba(10,8,6,.0),rgba(10,8,6,.55) 20%,rgba(10,8,6,.55) 80%,rgba(10,8,6,0));}
.leader-portrait{position:relative;width:76px;height:76px;flex:none;cursor:pointer;}
.leader-portrait .u-art{width:76px;height:76px;border-radius:50%;background:radial-gradient(circle at 50% 40%,#3a3456,#16142a);border:2.5px solid var(--lamp2);overflow:hidden;}
.leader-portrait .u-art svg{filter:none;}
.leader-portrait .blkbadge{position:absolute;right:-6px;bottom:-4px;width:32px;height:34px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:900;color:#fff;
  background:var(--block);border:2px solid var(--ink);border-radius:6px 6px 16px 16px;text-shadow:0 0 2px #000;animation:pop .3s;}
@keyframes pop{from{transform:scale(1.6)}to{transform:scale(1)}}
.leader-info{flex:1;min-width:0;}
.leader-info .nm{font-size:13px;font-weight:800;color:#ffd9a0;}
.leader-info .nm small{color:var(--muted);font-weight:600;margin-left:4px;}
.leader-info .hpbar{max-width:none;height:16px;}
.leader-info .hpbar .num{font-size:11.5px;line-height:13px;}
.orbs{display:flex;gap:5px;flex:none;align-items:center;}
.orb{width:24px;height:24px;border-radius:50%;border:2px solid var(--ink);background:radial-gradient(circle at 35% 30%,#3a2e3e,#1a1420);transition:all .25s;}
.orb.on{background:radial-gradient(circle at 35% 30%,#fff2c8,#ffb24a 35%,#e2552b 70%,#8a2a10);box-shadow:0 0 10px rgba(255,150,60,.85);}
.orb.extra{width:18px;height:18px;}
.orbs-wrap{display:flex;flex-direction:column;align-items:center;gap:2px;}
.orbs-wrap span{font-size:10px;color:var(--muted);}

.b-hand{position:relative;height:150px;flex:none;}
.b-hand .card{position:absolute;bottom:8px;transform-origin:50% 100%;touch-action:none;cursor:grab;}
.b-hand .card.sel{filter:drop-shadow(0 0 10px rgba(255,190,90,.95));}
.b-hand .card.dragging{transition:none!important;z-index:200!important;pointer-events:none;cursor:grabbing;}
.b-hand .card.ready{box-shadow:0 0 0 .15em var(--ink) inset,0 0 0 .12em var(--ink),0 0 22px 6px rgba(255,140,50,.9);}
.b-hand .card.drawin{animation:drawIn .35s ease-out backwards;}
@keyframes drawIn{from{opacity:0;transform:translate(-160px,60px) rotate(-30deg) scale(.5)}}
.b-bottom{display:flex;align-items:center;gap:8px;padding:6px 10px calc(8px + var(--safe-b));background:linear-gradient(180deg,rgba(10,8,6,.5),rgba(10,8,6,.9));flex:none;}
.pile{display:flex;align-items:center;gap:4px;font-size:13px;color:#e6d8bc;padding:6px 9px;background:rgba(0,0,0,.4);border-radius:6px;border:1px solid #3a2a20;font-weight:700;}
.pile svg{width:15px;height:20px;}
.hint{flex:1;min-width:0;text-align:center;font-size:11px;line-height:1.25;color:#ffd9a0;text-shadow:0 0 3px #000;word-break:keep-all;}
.endturn{flex:none;}
.turn-banner{position:absolute;left:0;right:0;top:38%;text-align:center;font-size:26px;font-weight:900;letter-spacing:.3em;color:#ffe2b0;
  text-shadow:0 0 12px rgba(232,87,42,.9),2px 2px 0 #1b1512;pointer-events:none;animation:banner 1s forwards;z-index:30;}
@keyframes banner{0%{opacity:0;transform:scale(1.6)}20%{opacity:1;transform:scale(1)}80%{opacity:1}100%{opacity:0}}

/* ---------- FX ---------- */
#fx{position:absolute;inset:0;pointer-events:none;z-index:80;overflow:hidden;}
.ftext{position:absolute;font-size:24px;font-weight:900;color:#ff5a4a;text-shadow:-2px -2px 0 #1b1512,2px -2px 0 #1b1512,-2px 2px 0 #1b1512,2px 2px 0 #1b1512;
  animation:floatUp 1s ease-out forwards;transform:translate(-50%,-50%);white-space:nowrap;}
.ftext.blk{color:#9cc8ff;font-size:17px;} .ftext.heal{color:#7fe0a0;} .ftext.st{font-size:15px;color:#ffd9a0;}
.ftext.burn{color:#ff9a3a;} .ftext.ward{color:#9ff0ff;font-size:18px;} .ftext.gold{color:#ffd25e;font-size:17px;}
@keyframes floatUp{0%{opacity:0;margin-top:12px;transform:translate(-50%,-50%) scale(.6)}15%{opacity:1;margin-top:0;transform:translate(-50%,-50%) scale(1.25)}30%{transform:translate(-50%,-50%) scale(1)}100%{opacity:0;margin-top:-56px}}
.shake{animation:shake .35s;}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px) rotate(-3deg)}40%{transform:translateX(7px) rotate(2deg)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.lunge{animation:lunge .4s;}
@keyframes lunge{0%,100%{transform:translateY(0)}40%{transform:translateY(24px) scale(1.08)}}
.ember{position:absolute;width:9px;height:13px;border-radius:50% 50% 45% 45%/65% 65% 35% 35%;
  background:radial-gradient(circle at 50% 70%,#fff0b0 0,#ffb24a 30%,#e2552b 60%,rgba(226,85,43,0) 72%);
  animation:emberUp var(--t,.9s) ease-out forwards;mix-blend-mode:screen;}
@keyframes emberUp{0%{opacity:0;transform:translate(0,0) scale(.6)}15%{opacity:1}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.2)}}
.flycard{position:absolute;animation:flyPlay .5s ease-in forwards;z-index:90;}
@keyframes flyPlay{0%{transform:translate(-50%,-50%) scale(1.15);opacity:1}100%{transform:translate(-50%,-120%) scale(.5);opacity:0}}
.seal-fly{position:absolute;width:30px;height:48px;z-index:95;transition:left .6s cubic-bezier(.5,0,.6,1),top .6s cubic-bezier(.3,-.4,.6,1),transform .6s;transform:translate(-50%,-50%) rotate(0deg);}
.seal-fly svg{width:100%;height:100%;filter:drop-shadow(0 0 8px #ffe066);}
.flash-screen{position:absolute;inset:0;background:radial-gradient(circle,rgba(255,170,80,.35),transparent 70%);animation:flashS .4s forwards;}
@keyframes flashS{from{opacity:1}to{opacity:0}}

/* ---------- 모달 ---------- */
#overlay{position:absolute;inset:0;z-index:100;display:none;}
#overlay.show{display:flex;align-items:center;justify-content:center;background:rgba(4,4,10,.78);animation:fadeIn .2s;}
.modal{width:calc(100% - 28px);max-height:calc(100% - 40px);display:flex;flex-direction:column;border-radius:10px;overflow:hidden;
  background:linear-gradient(180deg,#2a211c,#17110e);border:2px solid var(--ink);box-shadow:0 0 0 2px #6a4a32 inset,0 10px 40px rgba(0,0,0,.8);}
.modal-head{padding:12px 14px;font-size:17px;font-weight:900;border-bottom:1px solid #4a3426;display:flex;align-items:center;justify-content:space-between;}
.modal-body{padding:12px 14px;overflow-y:auto;flex:1;font-size:14px;line-height:1.55;}
.modal-foot{padding:10px 14px;display:flex;gap:8px;justify-content:center;border-top:1px solid #4a3426;}
.card-grid{display:flex;flex-wrap:wrap;gap:16px 10px;justify-content:center;padding:10px 4px;}
.info-row{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px dashed #4a3426;}
.info-row:last-child{border-bottom:none;}
.info-row .ic{width:42px;height:42px;flex:none;}
.info-row .ic svg{width:100%;height:100%;}
.info-row b{display:block;font-size:14px;}
.info-row p{font-size:12.5px;color:#d8cbb0;word-break:keep-all;}
.toggle-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px dashed #4a3426;}
.detail-wrap{display:flex;flex-direction:column;align-items:center;gap:14px;}
#toast{position:absolute;left:50%;top:16%;transform:translateX(-50%);z-index:120;pointer-events:none;display:flex;flex-direction:column;gap:6px;align-items:center;width:90%;}
.toast{background:rgba(20,14,10,.92);border:1.5px solid var(--lamp2);color:#ffe6c0;padding:8px 14px;border-radius:6px;font-size:13.5px;font-weight:700;animation:toastIn 1.8s forwards;text-align:center;word-break:keep-all;}
@keyframes toastIn{0%{opacity:0;transform:translateY(-10px)}10%{opacity:1;transform:translateY(0)}80%{opacity:1}100%{opacity:0}}

/* ---------- 결과 ---------- */
.panel-body{flex:1;overflow-y:auto;padding:8px 16px;display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;}
.panel-foot{padding:10px 14px calc(16px + var(--safe-b));display:flex;justify-content:center;gap:10px;}
.result-title{font-size:40px;font-weight:900;letter-spacing:.2em;text-shadow:2px 2px 0 #1b1512,0 0 20px rgba(232,87,42,.7);}
.result-title.lose{color:#c9c0d8;text-shadow:2px 2px 0 #000;}

---------------------------------------------------------------- */
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hashStr(s){
  let h = 2166136261 >>> 0;
  for(let i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  h ^= h >>> 13; h = Math.imul(h, 0x5bd1e995); h ^= h >>> 15;
  return h >>> 0;
}
function makeRng(...parts){ return mulberry32(hashStr(parts.join('|'))); }
function rint(rng, a, b){ return a + Math.floor(rng() * (b - a + 1)); }
function pick(rng, arr){ return arr[Math.floor(rng() * arr.length)]; }
function shuffle(rng, arr){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){ const j = Math.floor(rng() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function weighted(rng, entries){
  const total = entries.reduce((s, e) => s + e[1], 0);
  let r = rng() * total;
  for(const e of entries){ r -= e[1]; if(r < 0) return e[0]; }
  return entries[entries.length - 1][0];
}
function clamp(v, a, b){ return Math.max(a, Math.min(b, v)); }
function randomSeedString(){
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let s = '';
  for(let i = 0; i < 8; i++) s += chars[Math.floor(Math.random() * chars.length)];
  return s;
}
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function sleep(ms){
  const sp = (G.meta && G.meta.settings && G.meta.settings.fast) ? 0.5 : 1;

}

   9. 사운드 (Web Audio 합성)
---------------------------------------------------------------- */
const Sound = {
  ctx:null, master:null, bgmGain:null, bgmTimer:null, bgmMode:null, step:0, noiseBuf:null,
  init(){
    if(this.ctx) return;
    try{
      const AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return;
      this.ctx = new AC();
      this.master = this.ctx.createGain(); this.master.gain.value = 0.55; this.master.connect(this.ctx.destination);
      this.bgmGain = this.ctx.createGain(); this.bgmGain.gain.value = 0.16; this.bgmGain.connect(this.master);
      const len = this.ctx.sampleRate * 0.6;
      this.noiseBuf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const data = this.noiseBuf.getChannelData(0);
      for(let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
    }catch(e){ this.ctx = null; }
  },
  resume(){ try{ if(this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); }catch(e){} },
  tone(freq, dur, type, vol, when, dest, slideTo){
    if(!this.ctx) return;
    const t = this.ctx.currentTime + (when || 0);
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type || 'sine'; o.frequency.setValueAtTime(freq, t);
    if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol || 0.2, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(dest || this.master);
    o.start(t); o.stop(t + dur + 0.05);
  },
  noise(dur, vol, freq, when, q, dest){
    if(!this.ctx || !this.noiseBuf) return;
    const t = this.ctx.currentTime + (when || 0);
    const s = this.ctx.createBufferSource(); s.buffer = this.noiseBuf;
    const f = this.ctx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq || 1000; f.Q.value = q || 1;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(vol || 0.2, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(dest || this.master);
    s.start(t); s.stop(t + dur + 0.05);
  },
  play(name){
    if(!this.ctx || !G.meta || !G.meta.settings.sfx) return;
    switch(name){
      case 'tap': this.tone(880, 0.06, 'triangle', 0.08); break;
      case 'card': this.noise(0.12, 0.18, 2400, 0, 0.8); this.tone(520, 0.1, 'triangle', 0.08, 0.02, null, 780); break;
      case 'draw': this.noise(0.06, 0.1, 3000, 0, 1.5); break;
      case 'hit': this.noise(0.16, 0.35, 700, 0, 0.7); this.tone(140, 0.16, 'square', 0.12, 0, null, 60); break;
      case 'block': this.tone(300, 0.12, 'triangle', 0.15); this.noise(0.08, 0.15, 3000, 0, 2); break;
      case 'burn': this.noise(0.35, 0.22, 500, 0, 0.5); this.tone(220, 0.25, 'sawtooth', 0.05, 0, null, 110); break;
      case 'ward': [988, 1319].forEach((f, i)=>this.tone(f, 0.3, 'sine', 0.09, i * 0.05)); this.noise(0.15, 0.1, 5000, 0, 3); break;
      case 'seal': this.noise(0.25, 0.2, 1800, 0, 1); this.tone(660, 0.2, 'square', 0.05, 0.25, null, 330); break;
      case 'coin': this.tone(1320, 0.08, 'square', 0.06); this.tone(1760, 0.14, 'square', 0.05, 0.06); break;
      case 'death': this.tone(300, 0.5, 'sawtooth', 0.08, 0, null, 60); this.noise(0.5, 0.15, 400, 0, 0.5); break;
      case 'turn': this.tone(294, 0.4, 'triangle', 0.1); this.tone(440, 0.5, 'triangle', 0.08, 0.1); break;
      case 'enemyturn': this.tone(196, 0.35, 'sawtooth', 0.06); this.noise(0.2, 0.15, 200, 0, 1); break;
      case 'error': this.tone(180, 0.15, 'square', 0.07); break;
      case 'victory': [392, 440, 523, 587, 784].forEach((f, i)=>this.tone(f, 0.45, 'triangle', 0.1, i * 0.12)); break;
      case 'defeat': [392, 349, 294, 262].forEach((f, i)=>this.tone(f, 0.6, 'sine', 0.1, i * 0.22)); break;
    }
  },
  /* 배경음: 계면조 5음계 뜯기 + 전투 시 장구 */
  bgm(mode){
    if(!this.ctx || this.bgmMode === mode) return;
    this.bgmMode = mode;
    if(this.bgmTimer){ clearInterval(this.bgmTimer); this.bgmTimer = null; }
    if(!mode) return;
    const scale = [146.8, 174.6, 196, 220, 261.6, 293.7, 349.2, 392, 440];
    let last = 4;
    const beat = mode === 'battle' ? 330 : 520;
    this.step = 0;
    this.bgmTimer = setInterval(()=>{
      if(!G.meta.settings.bgm || !this.ctx || this.ctx.state !== 'running') return;
      const s = this.step++;
      if(Math.random() < (mode === 'battle' ? 0.55 : 0.42)){
        last = clamp(last + pick(Math.random, [-2,-1,-1,1,1,2,0]), 0, scale.length - 1);
        this.tone(scale[last], 1.4, 'triangle', 0.22, 0, this.bgmGain);
        this.tone(scale[last] * 2, 0.5, 'sine', 0.06, 0, this.bgmGain);
      }
      if(s % 8 === 0) this.tone(73.4, 2.2, 'sine', 0.18, 0, this.bgmGain);
      if(mode === 'battle'){
        if([1,0,0,1,0,1,0,0][s % 8]) this.tone(90, 0.25, 'sine', 0.35, 0, this.bgmGain, 55);
        if(s % 4 === 2) this.noise(0.08, 0.18, 3200, 0, 3, this.bgmGain);
      }
    }, beat);
  },
};

   10. 공용 효과 실행기 executeEffects()
   ctx: {battle, source, target, card, force}
---------------------------------------------------------------- */
const EFFECTS = {};
async function executeEffects(effects, ctx){
  if(!effects) return;
  ctx = ctx || {};
  for(const e of effects){
    const b = ctx.battle;
    if(b && b.over && !ctx.force) return;
    const h = EFFECTS[e.type];
    if(!h){ console.warn('알 수 없는 효과', e.type); continue; }
    await h(e, ctx);
    if(b && !ctx.force) checkBattleEnd();
  }
}
function getCardDef(inst){ const d = CARDS[inst.id]; return d ? Object.assign({id:inst.id}, d) : null; }
function isAllySide(u){ return u && (u.kind === 'player' || u.kind === 'spirit'); }
function aliveEnemies(){ const b = G.battle; return b ? b.enemies.filter(e => e.hp > 0) : []; }
function st(u, k){ return (u && u.status && u.status[k]) || 0; }

/* 대상 해석 */
function resolveTargets(e, ctx, def){
  const b = ctx.battle;
  if(!b) return [];
  const src = ctx.source || b.player;
  const ally = isAllySide(src);
  const alive = aliveEnemies();
  switch(e.target || def){
    case 'enemy':
      if(!ally) return [b.player];
      if(ctx.target && ctx.target.hp > 0 && ctx.target.kind === 'enemy') return [ctx.target];
      return alive.length ? [pick(b.rng, alive)] : [];
    case 'randomEnemy': return ally ? (alive.length ? [pick(b.rng, alive)] : []) : [b.player];
    case 'allEnemies': return ally ? alive : [b.player];
    case 'player': return [b.player];
    case 'self': return [src];
    case 'allAllies': return ally ? [b.player] : alive;
    default: return [];
  }
}

/* 피해 계산 · 적용 */
function calcDamage(src, tgt, base){
  let dmg = base;
  if(src) dmg += st(src, 'str');
  return Math.max(0, Math.floor(dmg));
}
async function dealDamage(src, tgt, base, opts){
  opts = opts || {};
  if(!tgt || tgt.hp <= 0) return 0;
  const b = G.battle;
  let dmg = opts.raw ? base : calcDamage(src, tgt, base);
  // 결계: 공격 피해를 통째로 무효 (불씨 같은 raw 피해는 통과)
  if(!opts.raw && dmg > 0 && st(tgt, 'ward') > 0){
    tgt.status.ward--;
    if(tgt.status.ward <= 0) delete tgt.status.ward;
    renderBattle();
    fxText(tgt.uid, '결계!', 'ward');
    fxClass(tgt.uid, 'warded');
    Sound.play('ward');
    return 0;
  }
  let blocked = 0;
  if(!opts.pierce){ blocked = Math.min(tgt.block || 0, dmg); tgt.block -= blocked; dmg -= blocked; }
  tgt.hp = Math.max(0, tgt.hp - dmg);
  if(isAllySide(src) && tgt.kind === 'enemy') b.stats.dealt += dmg;
  if(tgt.kind === 'player') b.stats.taken += dmg;
  renderBattle();
  if(dmg > 0){
    fxShake(tgt.uid);
    fxText(tgt.uid, '-' + dmg, opts.cls || '');
    Sound.play(opts.sound || 'hit');
  }else if(blocked > 0){
    fxText(tgt.uid, '막음', 'blk');
    Sound.play('block');
  }
  if(tgt.hp <= 0) await onUnitDeath(tgt);
  return dmg;
}
function applyStatus(tgt, key, val){
  if(!tgt || tgt.hp <= 0 || !val) return;
  tgt.status[key] = (tgt.status[key] || 0) + val;
  if(tgt.status[key] <= 0) delete tgt.status[key];
  renderBattle();
  fxText(tgt.uid, STATUS_INFO[key].name + ' +' + val, key === 'burn' ? 'burn' : key === 'ward' ? 'ward' : 'st');
  if(key === 'burn'){ fxEmbers(tgt.uid, 6 + val * 2); Sound.play('burn'); }
  if(key === 'ward') Sound.play('ward');
}
function gainBlock(u, v){
  if(!u || u.hp <= 0 || v <= 0) return;
  u.block = (u.block || 0) + v;
  renderBattle();
  fxText(u.uid, '방어 +' + v, 'blk');
  Sound.play('block');
}

/* --- 효과 정의 --- */
EFFECTS.damage = async (e, ctx) => {
  const b = ctx.battle; if(!b) return;
  const src = ctx.source || b.player;
  const hits = e.hits || 1;
  for(let i = 0; i < hits; i++){
    if(b.over) return;
    const targets = resolveTargets(e, ctx, 'enemy');
    if(src.kind === 'enemy' && targets.length) fxClass(src.uid, 'lunge');
    for(const t of targets){
      let v = e.value || 0;
      if(e.bonusIf && st(t, e.bonusIf) > 0) v += e.bonus || 0;
      await dealDamage(src, t, v);
    }
    if(hits > 1) await sleep(200);
  }
};
EFFECTS.block = async (e, ctx) => {
  const b = ctx.battle; if(!b) return;
  const src = ctx.source || b.player;
  resolveTargets(e, ctx, src.kind === 'enemy' ? 'self' : 'player').forEach(t => gainBlock(t, e.value));
};
EFFECTS.burn = async (e, ctx) => {
  if(!ctx.battle) return;
  resolveTargets(e, ctx, 'enemy').forEach(t => applyStatus(t, 'burn', e.value));
  await sleep(120);
};
EFFECTS.ward = async (e, ctx) => {
  if(!ctx.battle) return;
  resolveTargets(e, ctx, 'self').forEach(t => applyStatus(t, 'ward', e.value));
};
EFFECTS.multiplyStatus = async (e, ctx) => {
  const b = ctx.battle; if(!b) return;
  for(const t of resolveTargets(e, ctx, 'enemy')){
    const cur = st(t, e.status);
    if(cur <= 0){ fxText(t.uid, STATUS_INFO[e.status].name + ' 없음', 'st'); continue; }
    t.status[e.status] = cur * e.mult;
    renderBattle();
    fxText(t.uid, STATUS_INFO[e.status].name + ' ×' + e.mult, e.status === 'burn' ? 'burn' : 'st');
    if(e.status === 'burn'){ fxEmbers(t.uid, 18); Sound.play('burn'); }
  }
  await sleep(150);
};
EFFECTS.draw = async (e, ctx) => { if(ctx.battle) await drawCards(e.value || 1); };
EFFECTS.energy = async (e, ctx) => {
  const b = ctx.battle; if(!b) return;
  b.energy += e.value || 1;
  renderBattle();
  fxText('P', '혼력 +' + (e.value || 1), 'st');
};
EFFECTS.gold = async (e, ctx) => {
  G.run.gold = Math.max(0, G.run.gold + e.value);
  if(ctx.battle){ ctx.battle.stats.gold += e.value; renderBattle(); fxText('P', '엽전 +' + e.value, 'gold'); }
  Sound.play('coin');
};
EFFECTS.strength = async (e, ctx) => {
  const b = ctx.battle; if(!b) return;
  resolveTargets(e, ctx, 'self').forEach(t => { t.status.str = (t.status.str || 0) + e.value; });
  renderBattle();
};
/* 봉인: 적 차례에는 손패가 비어 있으므로, 다음 턴 손패를 뽑은 직후 카드 1장에 부적이 붙는다 */
EFFECTS.sealCard = async (e, ctx) => {
  const b = ctx.battle; if(!b) return;
  for(let i = 0; i < (e.value || 1); i++) b.pendingSeals.push(ctx.source ? ctx.source.uid : null);
  if(ctx.source) fxText(ctx.source.uid, '부적을 날린다!', 'st');
  Sound.play('seal');
  await sleep(250);
};
EFFECTS.cleanse = async (e, ctx) => {
  const src = ctx.source; if(!src) return;
  ['burn'].forEach(k => delete src.status[k]);
  renderBattle();
  fxText(src.uid, '정화', 'st');
};

/* 효과 설명문 자동 생성 */
function describeEffect(e){
  const v = e.value;
  const pre = e.target === 'allEnemies' ? '모든 적에게 ' : e.target === 'randomEnemy' ? '무작위 적에게 ' : '';
  switch(e.type){
    case 'damage':{
      let s = pre + '피해 <em>' + v + '</em>' + (e.hits > 1 ? ' ×' + e.hits : '');
      if(e.bonusIf) s += `. 대상에게 <b class="kw">${STATUS_INFO[e.bonusIf].name}</b>가 있으면 피해 <em>+${e.bonus}</em>`;
      return s;
    }
    case 'block': return '방어 <em>' + v + '</em>';
    case 'burn': return pre + '<b class="kw">불씨</b> <em>' + v + '</em>';
    case 'ward': return '<b class="kw">결계</b> <em>' + v + '</em>';
    case 'multiplyStatus': return `대상의 <b class="kw">${STATUS_INFO[e.status].name}</b> 스택 <em>${e.mult}배</em>`;
    case 'draw': return '카드 <em>' + v + '</em>장 뽑기';
    case 'energy': return '<b class="kw">혼력</b> <em>' + v + '</em> 획득';
    case 'gold': return '<b class="kw">엽전</b> <em>' + v + '</em> 획득';
    case 'sealCard': return '손패 카드 ' + v + '장 <b class="kw">봉인</b>';
    default: return '';
  }
}
function describeCard(def){
  if(def.text) return def.text;
  let parts = def.effects.map(describeEffect).filter(Boolean);
  // 화톳불 둔갑처럼 대상이 있는 둔갑 카드: 불씨 앞에 '적 하나에' 표시
  if(def.type === 'guard' && def.target === 'enemy') parts = parts.map(p => p.startsWith('<b class="kw">불씨') ? '적 하나에 ' + p : p);
  return parts.join('. ');
}

/* ---------------------------------------------------------------
   11. 전투 엔진
   턴 단계: turnStart → draw → playerPhase → spiritPhase(요괴 행동) → enemyPhase → turnEnd
   훅 이름: battleStart, turnStart, draw, cardPlay, playerPhaseEnd, spiritPhase, enemyPhase,
            turnEnd, enemyDeath, battleWin
   보물·시너지는 registerTriggers()로 훅에 효과를 등록한다.
---------------------------------------------------------------- */
function newEnemyUnit(id, idx){
  const d = ENEMIES[id];
  codexSee('enemies', id);
  return {uid:'E' + idx, kind:'enemy', id, name:d.name, hp:d.hp, maxHp:d.hp, block:0, status:{}, intent:null, aiIdx:0, history:[]};
}
function startBattle(enemyIds){
  const run = G.run;
  const rng = makeRng(run.seed, 'battle', run.path.length);
  const L = LEADERS[run.leader];
  const b = {
    rng, turn:0, phase:'start', busy:true, over:null, finished:false,
    player:{uid:'P', kind:'player', name:L.name, hp:run.hp, maxHp:run.maxHp, block:0, status:{}},
    enemies:enemyIds.map((id, i) => newEnemyUnit(id, i)),
    spirits:[],
    drawPile:shuffle(rng, run.deck.map(c => ({uid:c.uid, id:c.id}))),
    hand:[], discard:[], exhaust:[], sealed:new Set(), pendingSeals:[],
    energy:0, maxEnergy:ENERGY_PER_TURN, selected:null, hooks:{}, newCards:new Set(), newSeal:null,
    stats:{dealt:0, taken:0, cards:0, gold:0},
  };
  G.battle = b;
  G.ui.renderedDead = new Set();
  for(const rid of run.relics){ const d = RELICS[rid]; if(d && d.triggers) registerTriggers('relic:' + rid, d.triggers); }
  b.enemies.forEach(e => chooseIntent(e));
  G.meta.stats.battles++;
  saveMeta(); saveRun();
  setScreen('battle');
  Sound.bgm('battle');
  (async () => {
    await sleep(300);
    showBanner('전투 개시');
    await sleep(650);
    await emit('battleStart');
    if(b.over){ await finishBattle(); return; }
    await beginTurn();
  })();
}
function registerTriggers(source, triggers){
  const b = G.battle;
  for(const t of triggers){
    if(!b.hooks[t.on]) b.hooks[t.on] = [];
    b.hooks[t.on].push(Object.assign({}, t, {source}));
  }
}
function checkCond(h){
  const b = G.battle;
  if(h.firstTurn && b.turn !== 1) return false;
  if(h.everyN && b.turn % h.everyN !== 0) return false;
  return true;
}
async function emit(name, ctx, force){
  const b = G.battle;
  if(!b || (b.over && !force)) return;
  ctx = ctx || {};
  for(const h of (b.hooks[name] || []).slice()){
    if(b.over && !force) return;
    if(!checkCond(h)) continue;
    await executeEffects(h.effects, {battle:b, source:ctx.source || b.player, target:ctx.target, force});
  }
}
function checkBattleEnd(){
  const b = G.battle;
  if(!b || b.over) return;
  if(b.player.hp <= 0) b.over = 'lose';
  else if(aliveEnemies().length === 0) b.over = 'win';
}
async function onUnitDeath(u){
  if(u.kind === 'enemy'){
    if(u.dead) return;
    u.dead = true;
    Sound.play('death');
    renderBattle();
    await sleep(300);
    await emit('enemyDeath', {target:u});
  }
  checkBattleEnd();
}
async function drawCards(n){
  const b = G.battle;
  let drew = 0;
  for(let i = 0; i < n; i++){
    if(b.hand.length >= MAX_HAND){ toast('손패가 가득 찼다'); break; }
    if(!b.drawPile.length){
      if(!b.discard.length) break;
      b.drawPile = shuffle(b.rng, b.discard);   // 버린 더미를 섞어 뽑을 더미로
      b.discard = [];
      toast('버린 더미를 섞었다');
    }
    const c = b.drawPile.pop();
    b.hand.push(c);
    b.newCards.add(c.uid);
    drew++;
  }
  if(drew){ Sound.play('draw'); renderBattle(); await sleep(260); }
}
function chooseIntent(e){
  const b = G.battle, d = ENEMIES[e.id];
  let key;
  if(d.ai.type === 'cycle'){ key = d.ai.seq[e.aiIdx % d.ai.seq.length]; e.aiIdx++; }
  else key = weighted(b.rng, Object.entries(d.ai.weights));
  e.intent = key;
  e.history.push(key);
}
function intentInfo(e){
  const b = G.battle;
  const mv = ENEMIES[e.id].moves[e.intent];
  if(!mv) return null;
  const info = {kind:mv.intent || 'special', name:mv.name, value:null, hits:1};
  if(info.kind === 'attack'){
    const dmgE = mv.effects.find(x => x.type === 'damage');
    if(dmgE){ info.value = calcDamage(e, b.player, dmgE.value); info.hits = dmgE.hits || 1; }
  }else if(info.kind === 'defend'){
    const x = mv.effects.find(x => x.type === 'block' || x.type === 'ward');
    if(x) info.value = x.value;
  }
  info.desc = mv.effects.map(x => enemyEffectText(e, x)).join(', ');
  return info;
}
function enemyEffectText(e, x){
  const b = G.battle;
  switch(x.type){
    case 'damage': return '대장에게 피해 ' + calcDamage(e, b.player, x.value) + (x.hits > 1 ? ' × ' + x.hits + '회' : '');
    case 'block': return '방어도 ' + x.value + ' 획득';
    case 'ward': return '결계 ' + x.value + ' — 다음 공격 ' + x.value + '번을 무효로 한다';
    case 'sealCard': return '다음 턴 손패 카드 1장을 봉인한다';
    case 'cleanse': return '불씨 정화';
    default: return '알 수 없는 행동';
  }
}
/* 불씨 처리: 자기 차례 시작 시 스택만큼 피해, 1 감소 */
async function tickBurn(u){
  if(st(u, 'burn') <= 0) return;
  const v = u.status.burn;
  fxEmbers(u.uid, 14);
  await dealDamage(null, u, v, {raw:true, pierce:true, cls:'burn', sound:'burn'});
  if(u.status.burn){ u.status.burn--; if(u.status.burn <= 0) delete u.status.burn; }
  renderBattle();
  await sleep(250);
}
/* 봉인 적용: 손패에서 봉인되지 않은 카드 1장에 부적이 날아와 붙는다 */
async function applyPendingSeals(){
  const b = G.battle;
  while(b.pendingSeals.length){
    const fromUid = b.pendingSeals.shift();
    const cands = b.hand.map((c, i) => i).filter(i => !b.sealed.has(b.hand[i].uid) && CARDS[b.hand[i].id].type !== 'curse');
    if(!cands.length){ toast('봉인 부적이 허공에 흩어졌다'); continue; }
    const idx = pick(b.rng, cands);
    const card = b.hand[idx];
    await fxSealFly(fromUid, idx);
    b.sealed.add(card.uid);
    b.newSeal = card.uid;
    Sound.play('seal');
    renderBattle();
    toast(`「${CARDS[card.id].name}」이(가) 봉인되었다`);
    await sleep(450);
  }
}
async function beginTurn(){
  const b = G.battle;
  if(b.over){ await finishBattle(); return; }
  b.turn++;
  b.phase = 'start';
  b.busy = true;
  // turnStart: 혼력 충전, 대장의 불씨 처리
  b.energy = b.maxEnergy;
  await tickBurn(b.player);
  if(b.over){ await finishBattle(); return; }
  showBanner(b.turn + '번째 밤');
  Sound.play('turn');
  renderBattle();
  await sleep(350);
  await emit('turnStart');
  if(b.over){ await finishBattle(); return; }
  // draw
  await drawCards(DRAW_PER_TURN);
  await applyPendingSeals();
  await emit('draw');
  if(b.over){ await finishBattle(); return; }
  // playerPhase
  b.phase = 'player';
  b.busy = false;
  renderBattle();
}
async function endTurn(){
  const b = G.battle;
  if(!b || b.phase !== 'player' || b.busy || b.over) return;
  b.busy = true;
  b.selected = null;
  b.phase = 'spirit';
  Sound.play('tap');
  // 남은 손패는 버린 더미로
  b.discard.push(...b.hand);
  b.hand = [];
  renderBattle();
  await emit('playerPhaseEnd');
  await sleep(200);
  // spiritPhase: 요괴 행동 (2단계에서 구현 — 지금은 훅만 열어 둔다)
  await emit('spiritPhase');
  for(const sp of b.spirits.slice()){ if(b.over) break; /* 2단계: spiritAct(sp) */ }
  if(b.over){ await finishBattle(); return; }
  // enemyPhase
  b.phase = 'enemy';
  renderBattle();
  Sound.play('enemyturn');
  await sleep(300);
  await emit('enemyPhase');
  for(const e of b.enemies.slice()){
    if(b.over) break;
    if(e.hp <= 0) continue;
    await enemyAct(e);
    await sleep(250);
  }
  if(b.over){ await finishBattle(); return; }
  // turnEnd: 대장의 방어도(둔갑)는 턴 종료 시 사라진다
  b.phase = 'end';
  if(b.player.block){ b.player.block = 0; fxText('P', '둔갑이 풀렸다', 'blk'); }
  await emit('turnEnd');
  if(b.over){ await finishBattle(); return; }
  b.enemies.forEach(e => { if(e.hp > 0) chooseIntent(e); });
  renderBattle();
  await sleep(200);
  await beginTurn();
}
async function enemyAct(e){
  const b = G.battle;
  // 적의 방어도는 자기 차례가 시작될 때 사라진다
  if(e.block){ e.block = 0; renderBattle(); }
  await tickBurn(e);
  if(e.hp <= 0 || b.over) return;
  const mv = ENEMIES[e.id].moves[e.intent];
  if(!mv) return;
  fxText(e.uid, mv.name, 'st');
  await sleep(300);
  await executeEffects(mv.effects, {battle:b, source:e});
}
function cardBlockReason(inst){
  const b = G.battle;
  const def = getCardDef(inst);
  if(b.sealed.has(inst.uid)) return '봉인된 카드다. 이번 전투에서는 쓸 수 없다';
  if(def.unplayable) return '저주 카드는 사용할 수 없다';
  if(def.cost > b.energy) return '혼력이 부족하다';
  return null;
}
async function playCard(idx, target, at){
  const b = G.battle;
  if(!b || b.phase !== 'player' || b.busy || b.over) return false;
  const inst = b.hand[idx];
  if(!inst) return false;
  const def = getCardDef(inst);
  const why = cardBlockReason(inst);
  if(why){ toast(why); Sound.play('error'); b.selected = null; renderBattle(); return false; }
  if(def.target === 'enemy' && (!target || target.hp <= 0)) target = aliveEnemies()[0];
  b.busy = true;
  b.selected = null;
  b.energy -= def.cost;
  b.hand.splice(idx, 1);
  Sound.play('card');
  fxCardPlay(def, at);
  renderBattle();
  await sleep(180);
  await executeEffects(def.effects, {battle:b, source:b.player, target, card:def});
  b.discard.push(inst);
  b.stats.cards++;
  if(!b.over) await emit('cardPlay', {card:def});
  b.busy = false;
  renderBattle();
  if(b.over) await finishBattle();
  return true;
}
async function finishBattle(){
  const b = G.battle;
  if(!b || b.finished) return;
  b.finished = true;
  b.busy = true;
  const run = G.run;
  const win = b.over === 'win';
  if(win) await emit('battleWin', {}, true);
  run.hp = Math.max(0, Math.min(b.player.hp, run.maxHp));
  if(win) G.meta.stats.wins++; else G.meta.stats.losses++;
  saveMeta(); saveRun();
  Sound.play(win ? 'victory' : 'defeat');
  showBanner(win ? '승리' : '패배');
  await sleep(1300);
  G.ui.result = {win, turns:b.turn, dealt:b.stats.dealt, taken:b.stats.taken, cards:b.stats.cards, gold:b.stats.gold,
    hp:run.hp, maxHp:run.maxHp, enemies:b.enemies.map(e => e.name), seed:run.seed};
  G.battle = null;
  Sound.bgm('map');
  setScreen('result');
}
/* 테스트용: 무작위 조합(1~3명)과 전투 */
function startTestBattle(mode){
  G.ui.mode = mode;
  const seed = randomSeedString();
  G.run = newRun(mode === 'test' ? TEST_DECK : STARTER_DECK, seed);
  const rng = makeRng(seed, 'encounter');
  const n = rint(rng, 1, 3);
  const ids = [];
  for(let i = 0; i < n; i++) ids.push(pick(rng, TEST_ENEMY_POOL));
  startBattle(ids);
}

/* ---------------------------------------------------------------
   12. 연출 (FX)
---------------------------------------------------------------- */
function appRect(){ return $('#app').getBoundingClientRect(); }
function unitEl(uid){ return document.querySelector(`[data-uid="${uid}"]`); }
function unitCenter(uid){
  const el = unitEl(uid);
  if(!el) return null;
  const t = el.querySelector('.u-art') || el;
  const r = t.getBoundingClientRect(), a = appRect();
  return {x:r.left - a.left + r.width / 2, y:r.top - a.top + r.height / 2, w:r.width, h:r.height};
}
const _fxStack = {};
function fxText(uid, text, cls){
  const c = unitCenter(uid);
  if(!c) return;
  const now = Date.now();
  const s = _fxStack[uid] && now - _fxStack[uid].t < 450 ? _fxStack[uid].n + 1 : 0;
  _fxStack[uid] = {t:now, n:s};
  const d = document.createElement('div');
  d.className = 'ftext ' + (cls || '');
  d.textContent = text;
  d.style.left = (c.x + (s % 2 ? 16 : -10)) + 'px';
  d.style.top = (c.y - c.h * 0.15 - s * 20) + 'px';
  $('#fx').appendChild(d);
  setTimeout(() => d.remove(), 1050);
}
function fxClass(uid, cls){
  const el = unitEl(uid);
  if(!el) return;
  const t = el.querySelector('.u-art') || el;
  t.classList.remove(cls); void t.offsetWidth; t.classList.add(cls);
  setTimeout(() => t.classList.remove(cls), 500);
}
function fxShake(uid){ fxClass(uid, 'shake'); }
/* 불씨: 주홍 불꽃 파티클 */
function fxEmbers(uid, n){
  const c = unitCenter(uid);
  if(!c) return;
  const box = $('#fx');
  for(let i = 0; i < n; i++){
    const d = document.createElement('div');
    d.className = 'ember';
    const sz = 6 + Math.random() * 8;
    d.style.width = sz + 'px'; d.style.height = sz * 1.4 + 'px';
    d.style.left = (c.x + (Math.random() - 0.5) * c.w * 0.8) + 'px';
    d.style.top = (c.y + (Math.random() - 0.1) * c.h * 0.5) + 'px';
    d.style.setProperty('--dx', ((Math.random() - 0.5) * 40) + 'px');
    d.style.setProperty('--dy', (-40 - Math.random() * 60) + 'px');
    d.style.setProperty('--t', (0.6 + Math.random() * 0.6) + 's');
    d.style.animationDelay = (Math.random() * 0.25) + 's';
    box.appendChild(d);
    setTimeout(() => d.remove(), 1400);
  }
}
function fxFlash(){ const d = document.createElement('div'); d.className = 'flash-screen'; $('#fx').appendChild(d); setTimeout(() => d.remove(), 450); }
function fxCardPlay(def, at){
  const a = appRect();
  const d = document.createElement('div');
  d.className = 'flycard';
  d.innerHTML = cardHtml(def, {cls:'md'});
  d.style.left = (at ? at.x - a.left : a.width / 2) + 'px';
  d.style.top = (at ? at.y - a.top : a.height * 0.5) + 'px';
  $('#fx').appendChild(d);
  setTimeout(() => d.remove(), 550);
}
/* 봉인: 부적이 적에게서 날아와 카드에 붙는다 */
function fxSealFly(fromUid, handIdx){
  return new Promise(resolve => {
    const a = appRect();
    const from = fromUid ? unitCenter(fromUid) : null;
    const cardEl = document.querySelector(`.b-hand .card[data-idx="${handIdx}"]`);
    if(!cardEl){ resolve(); return; }
    const r = cardEl.getBoundingClientRect();
    const d = document.createElement('div');
    d.className = 'seal-fly';
    d.innerHTML = svgWrap(ART.talisman(), '0 0 40 60');
    d.style.left = (from ? from.x : a.width / 2) + 'px';
    d.style.top = (from ? from.y : 80) + 'px';
    $('#fx').appendChild(d);
    Sound.play('seal');
    requestAnimationFrame(() => requestAnimationFrame(() => {
      d.style.left = (r.left - a.left + r.width / 2) + 'px';
      d.style.top = (r.top - a.top + r.height * 0.44) + 'px';
      d.style.transform = 'translate(-50%,-50%) rotate(712deg) scale(1.2)';
    }));
    setTimeout(() => { d.remove(); resolve(); }, 650);
  });
}
function showBanner(text){
  const d = document.createElement('div');
  d.className = 'turn-banner serif';
  d.textContent = text;
  $('#fx').appendChild(d);
  setTimeout(() => d.remove(), 1050);
}
function toast(msg){
  const d = document.createElement('div');
  d.className = 'toast';
  d.innerHTML = msg;
  const box = $('#toast');
  while(box.children.length > 2) box.firstChild.remove();

---------------------------------------------------------------- */
function overlayOpen(){ return $('#overlay').classList.contains('show'); }
function showModal(html){ const o = $('#overlay'); o.innerHTML = html; o.classList.add('show'); }
function closeModal(){
  const o = $('#overlay'); o.classList.remove('show'); o.innerHTML = '';
  if(G.ui.modalResolve){ const r = G.ui.modalResolve; G.ui.modalResolve = null; r(null); }
}
function resolveModal(v){
  const r = G.ui.modalResolve; G.ui.modalResolve = null;
  const o = $('#overlay'); o.classList.remove('show'); o.innerHTML = '';
  if(r) r(v);
}
function modalFrame(title, body, foot){
  return `<div class="modal"><div class="modal-head"><span>${title}</span><button class="btn small ghost" data-action="closeModal">닫기</button></div>
    <div class="modal-body">${body}</div>${foot ? `<div class="modal-foot">${foot}</div>` : ''}</div>`;
}
function confirmModal(text){
  return new Promise(resolve => {
    showModal(`<div class="modal"><div class="modal-head">확인</div><div class="modal-body">${text}</div>
      <div class="modal-foot"><button class="btn small" data-action="confirmNo">아니오</button><button class="btn small primary" data-action="confirmYes">예</button></div></div>`);
    G.ui.modalResolve = resolve;
  });
}
function keywordRows(text){
  return Object.keys(KEYWORDS).filter(k => text.includes(k)).map(k => `<div class="info-row"><div><b>${k}</b><p>${KEYWORDS[k]}</p></div></div>`).join('');
}
/* 길게 누르면 카드 상세 */
function showCardDetail(inst){
  const def = getCardDef(inst);

  const sealed = b && b.sealed.has(inst.uid);

  body += `<div class="info-row"><div><b>${CARD_TYPES[def.type].name} 카드</b><p>${CARD_TYPES[def.type].desc}${def.target === 'enemy' ? ' 대상 적을 골라 사용한다.' : ' 위로 끌어올리면 사용한다.'}</p></div></div>`;
  if(sealed) body += `<div class="info-row"><div><b style="color:#e8c94a">봉인됨</b><p>${STATUS_INFO.seal.desc}</p></div></div>`;

function showUnitInfo(uid){
  const b = G.battle;

  let body = `<div class="info-row"><div class="ic">${artHtml}</div><div><b>${esc(u.name)}</b><p>생명 ${u.hp}/${u.maxHp}${u.block ? ` · 방어도 ${u.block}` : ''}</p></div></div>`;

  return `<div class="card fam-${def.family} type-${def.type} ${opts.sealed ? 'sealed' : ''} ${opts.cls || ''}" ${opts.attrs || ''} ${opts.style ? `style="${opts.style}"` : ''}>

SCREENS.battle = () => {
  const b = G.battle, run = G.run;
  if(!b) return '';
  const selInst = b.selected !== null && b.selected !== undefined ? b.hand[b.selected] : null;
  const sel = selInst ? getCardDef(selInst) : null;
  const targeting = sel && sel.target === 'enemy' && !cardBlockReason(selInst);
  const single = b.enemies.length === 1 ? 'single' : '';
  const showIntent = b.phase !== 'enemy' && b.phase !== 'end';
  /* 2. 적 영역 */
  const enemies = b.enemies.map(e => {
    let deadCls = '';
    if(e.hp <= 0){ deadCls = G.ui.renderedDead.has(e.uid) ? 'gone' : 'dead'; G.ui.renderedDead.add(e.uid); }
    const ii = e.hp > 0 && showIntent ? intentInfo(e) : null;
    const intent = ii ? `${svgWrap(INTENT_ICON[ii.kind], '0 0 24 24')}${ii.kind === 'attack' && ii.value !== null ? `<span>${ii.value}${ii.hits > 1 ? '×' + ii.hits : ''}</span>` : ''}` : '';
    return `<div class="unit enemy ${single} ${deadCls} ${targeting && e.hp > 0 ? 'targetable' : ''}" data-action="unit" data-uid="${e.uid}">
      <div class="intent">${intent}</div>

      ${statusesHtml(e)}
      <div class="u-name">${esc(e.name)}</div>
    </div>`;
  }).join('');
  /* 3. 요괴 필드 — 빈 슬롯 */
  let slots = '';
  for(let i = 0; i < SPIRIT_SLOTS; i++) slots += `<div class="slot">요괴<br>자리</div>`;
  /* 4. 대장 영역 */
  let orbs = '';
  const orbCount = Math.max(b.maxEnergy, b.energy);
  for(let i = 0; i < orbCount; i++) orbs += `<div class="orb ${i < b.energy ? 'on' : ''} ${i >= b.maxEnergy ? 'extra' : ''}"></div>`;
  /* 5. 손패 — 부채꼴 */
  const W = Math.min($('#app').clientWidth || 400, 480);
  const n = b.hand.length, cw = 88;
  const spacing = n > 1 ? Math.min(cw - 4, (W - 48 - cw) / (n - 1)) : 0;
  const total = spacing * (n - 1) + cw;
  const start = (W - total) / 2;
  const hand = b.hand.map((c, i) => {
    const def = getCardDef(c);
    const off = i - (n - 1) / 2;
    const isSel = b.selected === i;
    const rot = isSel ? 0 : off * 3;
    const y = isSel ? -46 : Math.abs(off) * Math.abs(off) * 3;
    const scale = isSel ? 1.3 : 1;
    const left = isSel ? clamp(start + i * spacing, 22, W - cw - 22) : start + i * spacing;
    const sealed = b.sealed.has(c.uid);
    const dim = (cardBlockReason(c) || b.phase !== 'player') ? 'dim' : '';
    const isNew = b.newCards.has(c.uid);
    const baseT = `translateY(${y}px) rotate(${rot}deg) scale(${scale})`;
    return cardHtml(def, {cls:`${dim} ${isSel ? 'sel' : ''} ${isNew ? 'drawin' : ''}`, sealed, sealNew:b.newSeal === c.uid,
      attrs:`data-idx="${i}"`,
      style:`left:${left}px;transform:${baseT};z-index:${isSel ? 60 : i + 1};${isNew ? `animation-delay:${(i % 5) * 60}ms` : ''}`});
  }).join('');
  b.newCards.clear();
  b.newSeal = null;
  const phaseText = b.phase === 'enemy' ? '적의 차례…' : b.phase === 'spirit' ? '요괴 행동…' : b.phase === 'start' ? '' : '';
  const hint = sel ? (targeting ? '대상 적을 탭하거나 카드를 적 위로 끌어 놓으세요' : (cardBlockReason(selInst) || '한 번 더 탭하거나 위로 끌어올리면 사용')) : (phaseText || (b.phase === 'player' ? '카드를 위로 끌어 사용 · 길게 누르면 설명' : ''));
  return `<div class="screen battle">
    <div class="bgart">${actBackground()}</div>
    ${topbarHtml()}
    <div class="b-enemies" data-action="bg">${enemies}</div>
    <div class="b-spirits" data-action="bg"><span class="lbl">요괴</span>${slots}</div>
    <div class="b-leader">
      <div class="leader-portrait" data-action="unit" data-uid="P">
        <div class="u-art">${art(LEADERS[run.leader].art)}</div>
        ${b.player.block ? `<div class="blkbadge">${b.player.block}</div>` : ''}
      </div>
      <div class="leader-info">
        <div class="nm">${esc(LEADERS[run.leader].name)}<small>${LEADERS[run.leader].title}</small></div>
        ${hpbarHtml(b.player)}
        ${statusesHtml(b.player)}
      </div>
      <div class="orbs-wrap"><div class="orbs">${orbs}</div><span>혼력 ${b.energy}/${b.maxEnergy}</span></div>
    </div>
    <div class="b-hand" id="hand">${hand}</div>
    <div class="b-bottom">
      <button class="pile" data-action="pile" data-pile="drawPile"><svg viewBox="0 0 14 18"><rect x="1" y="1" width="12" height="16" rx="2" fill="#f2e8d0" stroke="#1b1512" stroke-width="1.5"/></svg>뽑기 ${b.drawPile.length}</button>
      <button class="pile" data-action="pile" data-pile="discard"><svg viewBox="0 0 14 18"><rect x="1" y="1" width="12" height="16" rx="2" fill="#8a7a68" stroke="#1b1512" stroke-width="1.5"/></svg>버림 ${b.discard.length}</button>
      <div class="hint">${hint}</div>
      <button class="btn primary small endturn" data-action="endTurn" ${b.phase !== 'player' || b.busy ? 'disabled' : ''}>턴 종료</button>
    </div>
  </div>`;
};

/* ---------------------------------------------------------------
   15. 입력 — 클릭 위임 (버튼·적·더미)
---------------------------------------------------------------- */
const ACTIONS = {};
let _busyAction = false;
ACTIONS.startBattle = () => startTestBattle('starter');
ACTIONS.startTestDeck = () => startTestBattle('test');
ACTIONS.again = () => startTestBattle(G.ui.mode || 'starter');
ACTIONS.toTitle = () => setScreen('title');
ACTIONS.rules = () => showRules();
ACTIONS.settings = () => showSettings();
ACTIONS.toggleSetting = el => { const k = el.dataset.key; G.meta.settings[k] = !G.meta.settings[k]; saveMeta(); showSettings(); };
ACTIONS.closeModal = () => closeModal();
ACTIONS.confirmYes = () => resolveModal(true);
ACTIONS.confirmNo = () => resolveModal(false);
ACTIONS.giveUp = async () => {
  const ok = await confirmModal('전투를 포기할까요? 패배로 기록됩니다.');
  if(!ok) return;
  const b = G.battle;
  if(!b || b.finished) return;
  b.over = 'lose';
  b.player.hp = 0;
  if(!b.busy) await finishBattle();
};
ACTIONS.resetAll = async () => {
  const ok = await confirmModal('전투 기록과 설정을 모두 지울까요?');
  if(!ok) return;
  storeDel(SAVE_META); storeDel(SAVE_RUN);
  G.meta = defaultMeta();
  setScreen('title');
};
ACTIONS.endTurn = () => endTurn();
ACTIONS.pile = el => showPile(el.dataset.pile);
ACTIONS.unit = el => {
  const b = G.battle;
  if(!b) return;
  const uid = el.dataset.uid;
  if(b.selected !== null && b.selected !== undefined && b.phase === 'player' && !b.busy){
    const inst = b.hand[b.selected];
    const def = getCardDef(inst);
    const e = b.enemies.find(x => x.uid === uid);
    if(def.target === 'enemy' && e && e.hp > 0){ playCard(b.selected, e); return; }
    if(def.target !== 'enemy'){ playCard(b.selected, null); return; }
  }
  showUnitInfo(uid);
};
ACTIONS.bg = () => { const b = G.battle; if(b && b.selected !== null){ b.selected = null; renderBattle(); } };

document.addEventListener('click', async ev => {
  Sound.init(); Sound.resume();
  if(Sound.ctx && !Sound.bgmMode) Sound.bgm(G.screen === 'battle' ? 'battle' : 'map');
  const ov = $('#overlay');
  if(ov.classList.contains('show') && ev.target === ov){ closeModal(); return; }
  const el = ev.target.closest('[data-action]');
  if(!el) return;
  if(ov.classList.contains('show') && !ov.contains(el)) return;
  if(el.disabled) return;
  const a = el.dataset.action;
  const fn = ACTIONS[a];
  if(!fn) return;
  if(_busyAction && !['closeModal','confirmYes','confirmNo','toggleSetting','giveUp'].includes(a)) return;
  _busyAction = true;
  try{ await fn(el, ev); }catch(e){ console.error(e); }
  finally{ _busyAction = false; }
});

   16. 입력 — 손패 카드: 드래그 / 탭 / 길게 누르기 (포인터 이벤트)
---------------------------------------------------------------- */
let drag = null;
const LONG_PRESS_MS = 480;
function onCardTap(idx){
  const b = G.battle;
  if(!b || b.phase !== 'player' || b.busy) return;
  const inst = b.hand[idx];
  if(!inst) return;
  const def = getCardDef(inst);
  const why = cardBlockReason(inst);
  if(b.selected === idx){
    if(why){ toast(why); Sound.play('error'); return; }
    if(def.target === 'enemy'){
      const alive = aliveEnemies();
      if(alive.length === 1) playCard(idx, alive[0]);
      else toast('대상 적을 탭하세요');
    }else playCard(idx, null);
    return;
  }
  if(why){ toast(why); Sound.play('error'); }
  b.selected = idx;
  Sound.play('tap');
  renderBattle();
}
document.addEventListener('pointerdown', e => {
  Sound.init(); Sound.resume();
  const el = e.target.closest('.b-hand .card');
  if(!el || !G.battle || overlayOpen() || drag) return;
  e.preventDefault();
  const idx = +el.dataset.idx;
  drag = {el, idx, pid:e.pointerId, x0:e.clientX, y0:e.clientY, moved:false, long:false, blocked:false, enemyUid:null, inPlay:false};
  try{ el.setPointerCapture(e.pointerId); }catch(_){}
  drag.timer = setTimeout(() => {
    if(drag && !drag.moved){
      drag.long = true;
      const inst = G.battle && G.battle.hand[drag.idx];
      if(inst) showCardDetail(inst);
    }
  }, LONG_PRESS_MS);
});
document.addEventListener('pointermove', e => {
  if(!drag || e.pointerId !== drag.pid) return;
  const dx = e.clientX - drag.x0, dy = e.clientY - drag.y0;
  if(!drag.moved){
    if(Math.hypot(dx, dy) < 10 || drag.long) return;
    clearTimeout(drag.timer);
    drag.moved = true;
    const b = G.battle;
    if(!b || b.phase !== 'player' || b.busy){ drag.blocked = true; return; }
    drag.el.classList.add('dragging');
    document.querySelectorAll('.b-hand .card.sel').forEach(c => { if(c !== drag.el) c.classList.remove('sel'); });
    b.selected = null;
  }
  if(drag.blocked) return;
  drag.el.style.transform = `translate(${dx}px, ${dy}px) rotate(0deg) scale(1.08)`;
  const b = G.battle;
  const inst = b.hand[drag.idx];
  const def = getCardDef(inst);
  const under = document.elementFromPoint(e.clientX, e.clientY);
  const en = under && under.closest('.unit.enemy:not(.dead):not(.gone)');
  document.querySelectorAll('.unit.enemy.drop-hover').forEach(x => { if(x !== en) x.classList.remove('drop-hover'); });
  const handTop = $('#hand').getBoundingClientRect().top;
  const inPlay = e.clientY < handTop - 10;
  const usable = !cardBlockReason(inst);
  let ready = false;
  if(def.target === 'enemy'){
    if(en && usable) en.classList.add('drop-hover');
    ready = usable && (!!en || (inPlay && aliveEnemies().length === 1));
  }else ready = usable && inPlay;
  drag.el.classList.toggle('ready', ready);
  drag.enemyUid = en ? en.dataset.uid : null;
  drag.inPlay = inPlay;
});
function endDrag(e, cancelled){
  if(!drag || e.pointerId !== drag.pid) return;
  clearTimeout(drag.timer);
  const d = drag;
  drag = null;
  document.querySelectorAll('.unit.enemy.drop-hover').forEach(x => x.classList.remove('drop-hover'));
  if(d.long || cancelled){ renderBattle(); return; }
  const b = G.battle;
  if(!b) return;
  if(!d.moved){ onCardTap(d.idx); return; }
  if(d.blocked){ renderBattle(); return; }
  const def = getCardDef(b.hand[d.idx]);
  const at = {x:e.clientX, y:e.clientY};
  if(def.target === 'enemy'){
    let t = d.enemyUid ? b.enemies.find(x => x.uid === d.enemyUid) : null;
    if(!t && d.inPlay && aliveEnemies().length === 1) t = aliveEnemies()[0];
    if(t){ playCard(d.idx, t, at); return; }
    if(d.inPlay) toast('적 위에 놓아야 한다');
  }else if(d.inPlay){ playCard(d.idx, null, at); return; }
  renderBattle();   // 제자리로
}
document.addEventListener('pointerup', e => endDrag(e, false));
document.addEventListener('pointercancel', e => endDrag(e, true));
document.addEventListener('contextmenu', e => { if(e.target.closest('.card')) e.preventDefault(); });

window.addEventListener('resize', () => { if(G.screen === 'battle') renderBattle(); });

/* ---------------------------------------------------------------
   17. 시작
---------------------------------------------------------------- */
function boot(){
  G.meta = loadMeta();
  setScreen('title');
}
boot();
window.BAEKGWI = {G, CARDS, ENEMIES, RELICS, EVENTS, LEADERS, executeEffects, startBattle, startTestBattle, playCard, endTurn, setScreen};
</script>
