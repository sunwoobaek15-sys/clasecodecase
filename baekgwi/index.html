<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#121829">
<title>백귀야행</title>
<style>
:root{
  --night:#141a2e; --night2:#0b0f1c; --ink:#1b1512; --ink2:#2a221d;
  --lamp:#e8572a; --lamp2:#ffb24a; --hanji:#f2e8d0; --hanji2:#e3d4b2;
  --fire:#e2552b; --charm:#b45fa8; --grudge:#7fbfb2; --water:#2f5d9e; --sound:#b8893a; --neutral:#8a7a68;
  --gold:#d9a93f; --hp:#c8323a; --block:#5d8fc9; --text:#efe6d2; --muted:#a59c8a;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;background:#06080f;color:var(--text);
  font-family:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","Nanum Gothic",sans-serif;
  overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation;}
button{font-family:inherit;color:inherit;border:none;background:none;cursor:pointer;}
input{font-family:inherit;}
.serif{font-family:"Nanum Myeongjo","AppleMyungjo","Batang","Noto Serif KR","Noto Serif CJK KR",serif;}
#app{position:relative;max-width:480px;height:100%;margin:0 auto;overflow:hidden;
  background:linear-gradient(180deg,#0e1426 0%,#18203a 55%,#1c1a2a 100%);
  box-shadow:0 0 40px rgba(0,0,0,.8);}
#app::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.55;
  background-image:
   radial-gradient(1px 1px at 12% 8%,#fff 50%,transparent 51%),
   radial-gradient(1px 1px at 33% 15%,#fff 50%,transparent 51%),
   radial-gradient(1.5px 1.5px at 72% 6%,#ffe9c4 50%,transparent 51%),
   radial-gradient(1px 1px at 88% 19%,#fff 50%,transparent 51%),
   radial-gradient(1px 1px at 55% 24%,#fff 50%,transparent 51%),
   radial-gradient(1px 1px at 8% 31%,#fff 50%,transparent 51%),
   radial-gradient(1.2px 1.2px at 92% 36%,#fff 50%,transparent 51%),
   radial-gradient(1px 1px at 22% 44%,#fff 50%,transparent 51%);}
#screen{position:absolute;inset:0;}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;animation:fadeIn .35s ease;}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.bgart{position:absolute;inset:0;pointer-events:none;z-index:0;}
.bgart svg{width:100%;height:100%;display:block;}
.screen > *:not(.bgart){position:relative;z-index:1;}

/* ---------- 공용 버튼 ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:12px 20px;min-height:46px;border-radius:6px;font-size:16px;font-weight:700;letter-spacing:.05em;
  background:linear-gradient(180deg,#3a2a22,#241913);color:var(--hanji);
  border:2px solid var(--ink);box-shadow:0 0 0 2px #6a4a32 inset,0 4px 0 #0a0705,0 6px 12px rgba(0,0,0,.5);
  transition:transform .08s, filter .15s;}
.btn:active{transform:translateY(3px);box-shadow:0 0 0 2px #6a4a32 inset,0 1px 0 #0a0705;}
.btn.primary{background:linear-gradient(180deg,#e8572a,#a83218);color:#fff6e4;box-shadow:0 0 0 2px #ffb24a inset,0 4px 0 #4a1206,0 6px 16px rgba(232,87,42,.4);}
.btn.ghost{background:rgba(20,16,14,.55);box-shadow:0 0 0 1.5px #6a5a4a inset;}
.btn.small{padding:6px 12px;min-height:34px;font-size:13px;}
.btn[disabled],.btn.disabled{filter:grayscale(1) brightness(.6);pointer-events:none;}
.btn-col{display:flex;flex-direction:column;gap:12px;align-items:stretch;width:min(300px,80%);}

/* ---------- 상단 바 ---------- */
.topbar{display:flex;align-items:center;gap:8px;padding:calc(6px + var(--safe-t)) 10px 6px;
  background:linear-gradient(180deg,rgba(8,6,5,.92),rgba(20,15,12,.85));border-bottom:2px solid var(--ink);
  box-shadow:0 2px 0 #5a4030;font-size:14px;font-weight:700;min-height:46px;}
.tb-leader{width:32px;height:32px;border-radius:50%;overflow:hidden;border:2px solid var(--lamp2);background:#2a2030;flex:none;}
.tb-leader svg{width:100%;height:100%;}
.tb-stat{display:flex;align-items:center;gap:4px;white-space:nowrap;}
.tb-stat svg{width:18px;height:18px;}
.tb-hp{color:#ff8a7a;}
.tb-gold{color:var(--gold);}
.tb-floor{color:var(--muted);font-size:12px;margin-left:auto;white-space:nowrap;}
.tb-btn{width:36px;height:34px;border-radius:5px;background:#2a1f18;border:1.5px solid #6a4a32;display:flex;align-items:center;justify-content:center;font-size:12px;flex:none;position:relative;}
.tb-btn svg{width:20px;height:20px;}
.tb-btn .cnt{position:absolute;right:-4px;bottom:-4px;background:var(--lamp);color:#fff;font-size:10px;border-radius:8px;padding:0 4px;min-width:16px;line-height:15px;border:1px solid var(--ink);}
.relicbar{display:flex;gap:4px;padding:4px 10px;min-height:34px;overflow-x:auto;background:rgba(10,8,6,.55);border-bottom:1px solid #3a2a20;scrollbar-width:none;}
.relicbar::-webkit-scrollbar{display:none;}
.relic{width:28px;height:28px;flex:none;border-radius:50%;background:radial-gradient(circle,#3a3040,#1b1520);border:1.5px solid var(--gold);display:flex;align-items:center;justify-content:center;position:relative;}
.relic svg{width:22px;height:22px;}
.relic.flash{animation:relicFlash .6s;}
@keyframes relicFlash{0%{transform:scale(1);box-shadow:0 0 0 0 rgba(255,178,74,.9)}50%{transform:scale(1.35);box-shadow:0 0 14px 6px rgba(255,178,74,.8)}100%{transform:scale(1)}}

/* ---------- 카드 ---------- */
.card{--fc:var(--neutral);position:relative;width:8.8em;height:12.6em;font-size:10px;border-radius:.7em;flex:none;
  background:
   radial-gradient(circle at 22% 12%,rgba(255,255,255,.4),transparent 45%),
   repeating-linear-gradient(17deg,rgba(120,90,50,.06) 0 2px,transparent 2px 5px),
   repeating-linear-gradient(-63deg,rgba(120,90,50,.05) 0 1px,transparent 1px 4px),
   radial-gradient(circle at 70% 85%,rgba(160,120,60,.18),transparent 55%),
   var(--hanji);
  border:.3em solid var(--fc);box-shadow:0 0 0 .15em var(--ink) inset,0 0 0 .12em var(--ink),0 .3em .6em rgba(0,0,0,.55);
  color:var(--ink);display:flex;flex-direction:column;align-items:center;cursor:pointer;transition:transform .15s ease, filter .2s;}
.card.fam-fire{--fc:var(--fire);} .card.fam-charm{--fc:var(--charm);} .card.fam-grudge{--fc:var(--grudge);}
.card.fam-water{--fc:var(--water);} .card.fam-sound{--fc:var(--sound);} .card.fam-neutral{--fc:var(--neutral);}
.card.type-curse{--fc:#3a3036;background:repeating-linear-gradient(45deg,rgba(0,0,0,.08) 0 3px,transparent 3px 7px),#cfc4b0;}
.card .c-cost{position:absolute;left:-.9em;top:-.9em;width:3em;height:3em;z-index:2;}
.card .c-cost svg{width:100%;height:100%;}
.card .c-cost b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:1.55em;font-weight:900;color:#fff8e6;
  text-shadow:-1px -1px 0 #1b1512,1px -1px 0 #1b1512,-1px 1px 0 #1b1512,1px 1px 0 #1b1512,0 0 4px #1b1512;}
.card .c-name{font-weight:900;font-size:1.12em;margin-top:.45em;padding:0 .3em 0 1.6em;white-space:nowrap;letter-spacing:-.02em;max-width:100%;overflow:hidden;text-overflow:ellipsis;}
.card.upg .c-name{color:#2f7a3a;}
.card .c-art{width:6.8em;height:5em;margin-top:.3em;border:.15em solid var(--ink);border-radius:.35em;overflow:hidden;
  background:radial-gradient(circle at 50% 40%,rgba(255,255,255,.55),transparent 70%),color-mix(in srgb,var(--fc) 22%,#efe3c6);}
.card .c-art svg{width:100%;height:100%;display:block;}
.card .c-type{font-size:.75em;color:#6b5a48;margin-top:.2em;font-weight:700;letter-spacing:.05em;}
.card .c-desc{font-size:.86em;line-height:1.25;text-align:center;padding:.1em .45em 0;font-weight:600;word-break:keep-all;overflow:hidden;flex:1;display:flex;align-items:center;}
.card .c-desc span{display:block;width:100%;}
.card .c-desc em{font-style:normal;color:#a3281a;font-weight:900;}
.card .c-rar{position:absolute;right:.4em;top:.5em;width:.6em;height:.6em;border-radius:50%;border:1px solid var(--ink);}
.card .rar-common{background:#bfb4a0;} .card .rar-uncommon{background:#5d8fc9;} .card .rar-rare{background:#e2a23a;} .card .rar-basic{background:#8a7a68;} .card .rar-special{background:#3a3036;}
.card.lg{font-size:13.5px;}
.card.md{font-size:11.5px;}
.card.dim{filter:brightness(.62) saturate(.6);}
.card.locked{filter:brightness(.15);}

/* ---------- 타이틀 ---------- */
.title-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:0 16px calc(28px + var(--safe-b));gap:14px;}
.title-logo{position:absolute;top:13%;left:0;right:0;text-align:center;}
.title-logo .hanja{font-size:20px;letter-spacing:.6em;color:#ffcf8a;opacity:.9;padding-left:.6em;text-shadow:0 0 12px rgba(255,140,60,.6);}
.title-logo h1{font-size:56px;font-weight:900;letter-spacing:.12em;color:#fff2da;
  text-shadow:0 0 2px #000,3px 3px 0 #1b1512,0 0 24px rgba(232,87,42,.7);}
.title-logo p{margin-top:8px;font-size:13px;color:#d8c9a8;letter-spacing:.1em;}
.title-foot{font-size:11px;color:var(--muted);text-align:center;}
.seal-stamp{display:inline-block;border:2px solid #c8323a;color:#e04a3a;padding:2px 6px;font-size:12px;font-weight:900;transform:rotate(-6deg);margin-top:10px;}

/* ---------- 지도자 선택 ---------- */
.ls-head{padding:calc(14px + var(--safe-t)) 16px 6px;text-align:center;}
.ls-head h2{font-size:22px;letter-spacing:.1em;}
.ls-head p{font-size:12px;color:var(--muted);margin-top:4px;}
.ls-list{flex:1;overflow-y:auto;padding:8px 14px;display:flex;flex-direction:column;gap:10px;}
.leader-card{display:flex;gap:12px;padding:10px;border-radius:8px;background:linear-gradient(135deg,rgba(242,232,208,.95),rgba(220,205,170,.95));color:var(--ink);
  border:3px solid var(--fc,#8a7a68);box-shadow:0 0 0 1.5px var(--ink) inset,0 4px 10px rgba(0,0,0,.5);cursor:pointer;transition:transform .12s;}
.leader-card.sel{transform:scale(1.02);box-shadow:0 0 0 1.5px var(--ink) inset,0 0 0 3px var(--lamp2),0 0 22px rgba(255,178,74,.6);}
.leader-card.locked{filter:grayscale(1) brightness(.55);cursor:default;}
.leader-card .lc-art{width:86px;height:86px;flex:none;border-radius:6px;border:2px solid var(--ink);background:radial-gradient(circle at 50% 35%,#3a3456,#1a1830);overflow:hidden;}
.leader-card .lc-art svg{width:100%;height:100%;}
.leader-card h3{font-size:17px;}
.leader-card h3 small{font-size:12px;color:#6b5a48;margin-left:4px;}
.leader-card .lc-meta{font-size:12px;margin-top:3px;font-weight:700;}
.leader-card .lc-desc{font-size:12px;margin-top:4px;line-height:1.35;word-break:keep-all;}
.leader-card .lc-relic{font-size:11.5px;margin-top:4px;padding:3px 6px;background:rgba(27,21,18,.08);border-radius:4px;border-left:3px solid var(--gold);word-break:keep-all;}
.ls-foot{padding:10px 14px calc(12px + var(--safe-b));display:flex;flex-direction:column;gap:8px;background:rgba(8,6,5,.6);border-top:2px solid var(--ink);}
.asc-row{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px;}
.asc-row .asc-ctrl{display:flex;align-items:center;gap:6px;}
.asc-row .asc-num{font-size:18px;font-weight:900;color:var(--lamp2);min-width:24px;text-align:center;}
.asc-desc{font-size:11px;color:var(--muted);min-height:15px;}
.seed-row{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted);}
.seed-row input{flex:1;background:#1b1512;border:1.5px solid #5a4030;color:var(--hanji);padding:6px 8px;border-radius:4px;font-size:13px;min-width:0;}

/* ---------- 지도 ---------- */
.map-head{display:flex;align-items:center;justify-content:space-between;padding:6px 12px;font-size:13px;background:rgba(10,8,6,.4);}
.map-head b{font-size:15px;letter-spacing:.08em;color:#ffd9a0;}
.map-scroll{flex:1;overflow-y:auto;overflow-x:hidden;position:relative;-webkit-overflow-scrolling:touch;}
.map-scroll svg{display:block;width:100%;}
.map-node{cursor:pointer;}
.map-node .ring{fill:none;stroke:var(--lamp2);stroke-width:3;opacity:0;}
.map-node.avail .ring{opacity:1;animation:ringPulse 1.4s infinite;}
.map-node.avail{animation:nodeBob 1.4s infinite ease-in-out;transform-box:fill-box;transform-origin:center;}
@keyframes ringPulse{0%{stroke-opacity:1;stroke-width:3}100%{stroke-opacity:.1;stroke-width:9}}
@keyframes nodeBob{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
.map-node.done{opacity:.55;}
.map-node.unreach{opacity:.4;}
.map-legend{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 10px;padding:6px 8px calc(6px + var(--safe-b));font-size:11px;color:var(--muted);background:rgba(8,6,5,.7);border-top:1px solid #3a2a20;}
.map-legend span{display:inline-flex;align-items:center;gap:3px;}
.map-legend svg{width:16px;height:16px;}

/* ---------- 전투 ---------- */
.battle .b-field{flex:1;display:flex;flex-direction:column;min-height:0;position:relative;}
.b-enemies{flex:1.15;display:flex;justify-content:center;align-items:flex-end;gap:4px;padding:4px 6px 0;min-height:0;}
.b-allies{flex:1;display:flex;align-items:flex-end;gap:4px;padding:0 6px 4px;min-height:0;}
.b-divider{height:2px;margin:2px 24px;background:linear-gradient(90deg,transparent,rgba(255,178,74,.45),transparent);}
.unit{position:relative;display:flex;flex-direction:column;align-items:center;cursor:pointer;transition:transform .15s;min-width:0;}
.unit .u-art{position:relative;}
.unit .u-art svg{width:100%;height:100%;display:block;filter:drop-shadow(0 4px 3px rgba(0,0,0,.6));}
.unit.enemy{flex:1;max-width:150px;}
.unit.enemy .u-art{width:min(96px,24vw);height:min(96px,24vw);}
.unit.enemy.boss .u-art{width:min(150px,36vw);height:min(150px,36vw);}
.unit.enemy.elite .u-art{width:min(118px,29vw);height:min(118px,29vw);}
.unit.enemy.single .u-art{width:min(124px,32vw);height:min(124px,32vw);}
.unit.enemy.boss.single .u-art{width:min(160px,40vw);height:min(160px,40vw);}
.unit.enemy.targetable .u-art::after{content:"";position:absolute;inset:-6px;border:3px dashed var(--lamp2);border-radius:50%;animation:spin 6s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.unit.dead{animation:dieOut .5s forwards;pointer-events:none;}
.unit.gone{opacity:0;pointer-events:none;}
@keyframes dieOut{to{opacity:0;transform:translateY(10px) scale(.8);filter:grayscale(1) blur(2px)}}
.u-name{font-size:11px;font-weight:700;color:#e9dcc0;white-space:nowrap;text-shadow:0 1px 2px #000;max-width:100%;overflow:hidden;text-overflow:ellipsis;}
.hpbar{position:relative;width:100%;max-width:96px;height:13px;background:#2a0e0e;border:1.5px solid var(--ink);border-radius:7px;margin-top:2px;overflow:visible;}
.hpbar .fill{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:linear-gradient(180deg,#e85a4a,#a8222a);transition:width .3s;}
.hpbar.spirit .fill{background:linear-gradient(180deg,#7fd0a0,#2f8a5a);}
.hpbar .num{position:absolute;inset:0;font-size:10px;line-height:11px;text-align:center;font-weight:800;color:#fff;text-shadow:0 0 2px #000,0 0 2px #000;}
.hpbar .blk{position:absolute;left:-10px;top:-5px;width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:900;color:#fff;
  background:var(--block);border:1.5px solid var(--ink);border-radius:5px 5px 11px 11px;text-shadow:0 0 2px #000;}
.statuses{display:flex;flex-wrap:wrap;justify-content:center;gap:2px;min-height:14px;margin-top:2px;max-width:110px;}
.st{font-size:9px;font-weight:900;color:#fff;padding:0 3px;border-radius:3px;line-height:13px;border:1px solid var(--ink);text-shadow:0 0 2px #000;white-space:nowrap;}
.intent{display:flex;align-items:center;gap:2px;height:24px;font-size:14px;font-weight:900;color:#fff;text-shadow:0 0 3px #000,0 0 3px #000;animation:intentBob 1.6s infinite ease-in-out;}
.intent svg{width:22px;height:22px;}
@keyframes intentBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.ally-leader{width:84px;flex:none;}
.ally-leader .u-art{width:70px;height:70px;border-radius:50%;background:radial-gradient(circle at 50% 40%,#3a3456,#16142a);border:2px solid var(--lamp2);overflow:hidden;}
.spirit-row{flex:1;display:flex;gap:3px;align-items:flex-end;justify-content:center;min-width:0;}
.unit.spirit{flex:1;max-width:82px;}
.unit.spirit .u-art{width:min(62px,15vw);height:min(62px,15vw);}
.unit.spirit .fam-dot{position:absolute;top:-2px;right:-2px;width:14px;height:14px;border-radius:50%;border:1.5px solid var(--ink);}
.unit.spirit .atk{position:absolute;left:-4px;bottom:-2px;font-size:10px;font-weight:900;background:#c8323a;color:#fff;border:1.5px solid var(--ink);border-radius:50%;width:18px;height:18px;display:flex;align-items:center;justify-content:center;}
.slot-empty{flex:1;max-width:70px;height:min(62px,15vw);border:2px dashed rgba(255,214,150,.18);border-radius:50%;margin-bottom:34px;}
.unit.summoned{animation:summonPop .5s ease-out;}
@keyframes summonPop{0%{transform:scale(.2) translateY(30px);opacity:0;filter:brightness(3)}70%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
.syn-bar{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;padding:0 6px;min-height:18px;}
.syn{font-size:10px;font-weight:800;padding:1px 6px;border-radius:9px;border:1.5px solid var(--ink);color:#fff;text-shadow:0 0 2px #000;opacity:.45;}
.syn.on{opacity:1;box-shadow:0 0 8px rgba(255,220,150,.6);}
.b-controls{display:flex;align-items:center;gap:8px;padding:4px 10px;height:52px;background:linear-gradient(180deg,rgba(10,8,6,.2),rgba(10,8,6,.8));}
.energy{position:relative;width:48px;height:48px;flex:none;}
.energy svg{width:100%;height:100%;}
.energy b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:900;color:#fff;text-shadow:-1px -1px 0 #1b1512,1px -1px 0 #1b1512,-1px 1px 0 #1b1512,1px 1px 0 #1b1512;}
.pile{display:flex;align-items:center;gap:3px;font-size:12px;color:var(--muted);padding:4px 7px;background:rgba(0,0,0,.35);border-radius:5px;border:1px solid #3a2a20;cursor:pointer;}
.pile svg{width:14px;height:18px;}
.endturn{margin-left:auto;flex:none;}
.b-hand{position:relative;height:150px;flex:none;padding-bottom:var(--safe-b);}
.b-hand .card{position:absolute;bottom:10px;transform-origin:50% 100%;}
.b-hand .card.sel{z-index:60!important;filter:drop-shadow(0 0 10px rgba(255,190,90,.9));}
.b-hand .card.drawin{animation:drawIn .35s ease-out backwards;}
@keyframes drawIn{from{opacity:0;transform:translate(-120px,40px) rotate(-30deg) scale(.5)}}
.turn-banner{position:absolute;left:0;right:0;top:40%;text-align:center;font-size:26px;font-weight:900;letter-spacing:.3em;color:#ffe2b0;
  text-shadow:0 0 12px rgba(232,87,42,.9),2px 2px 0 #1b1512;pointer-events:none;animation:banner 1s forwards;z-index:30;}
@keyframes banner{0%{opacity:0;transform:scale(1.6)}20%{opacity:1;transform:scale(1)}80%{opacity:1}100%{opacity:0}}
.hint{flex:1;min-width:0;text-align:center;font-size:11px;line-height:1.2;color:#ffd9a0;pointer-events:none;text-shadow:0 0 3px #000;word-break:keep-all;}

/* ---------- FX ---------- */
#fx{position:absolute;inset:0;pointer-events:none;z-index:80;overflow:hidden;}
.ftext{position:absolute;font-size:22px;font-weight:900;color:#ff5a4a;text-shadow:-2px -2px 0 #1b1512,2px -2px 0 #1b1512,-2px 2px 0 #1b1512,2px 2px 0 #1b1512;animation:floatUp 1s ease-out forwards;transform:translate(-50%,-50%);white-space:nowrap;}
.ftext.blk{color:#9cc8ff;font-size:16px;} .ftext.heal{color:#7fe0a0;} .ftext.st{font-size:14px;color:#ffd9a0;}
.ftext.burn{color:#ff9a3a;} .ftext.charm{color:#f0a0e8;} .ftext.grudge{color:#a8f0e0;}
@keyframes floatUp{0%{opacity:0;margin-top:10px}15%{opacity:1;margin-top:0}100%{opacity:0;margin-top:-50px}}
.shake{animation:shake .35s;}

/* ---------------------------------------------------------------
   0. 유틸리티 · 시드 난수
---------------------------------------------------------------- */
const VERSION = 1;
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hashStr(s){
  let h = 2166136261 >>> 0;
  for(let i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  h ^= h >>> 13; h = Math.imul(h, 0x5bd1e995); h ^= h >>> 15;
  return h >>> 0;
}
function makeRng(...parts){ return mulberry32(hashStr(parts.join('|'))); }
function rint(rng, a, b){ return a + Math.floor(rng() * (b - a + 1)); }
function pick(rng, arr){ return arr[Math.floor(rng() * arr.length)]; }
function shuffle(rng, arr){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){ const j = Math.floor(rng() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function weighted(rng, entries){
  const total = entries.reduce((s, e) => s + e[1], 0);
  let r = rng() * total;
  for(const e of entries){ r -= e[1]; if(r < 0) return e[0]; }
  return entries[entries.length - 1][0];
}
function clamp(v, a, b){ return Math.max(a, Math.min(b, v)); }
function randomSeedString(){
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let s = '';
  for(let i = 0; i < 8; i++) s += chars[Math.floor(Math.random() * chars.length)];
  return s;
}
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function sleep(ms){
  const sp = (G && G.meta && G.meta.settings && G.meta.settings.fast) ? 0.5 : 1;
  return new Promise(r => setTimeout(r, ms * sp));
}

const Sound = {
  ctx:null, master:null, bgmGain:null, bgmTimer:null, bgmMode:null, step:0, noiseBuf:null,
  init(){
    if(this.ctx) return;
    try{
      const AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return;
      this.ctx = new AC();
      this.master = this.ctx.createGain(); this.master.gain.value = 0.55; this.master.connect(this.ctx.destination);
      this.bgmGain = this.ctx.createGain(); this.bgmGain.gain.value = 0.16; this.bgmGain.connect(this.master);
      const len = this.ctx.sampleRate * 0.6;
      this.noiseBuf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const data = this.noiseBuf.getChannelData(0);
      for(let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
    }catch(e){ this.ctx = null; }
  },
  resume(){ try{ if(this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); }catch(e){} },
  tone(freq, dur, type, vol, when, dest, slideTo){
    if(!this.ctx) return;
    const t = this.ctx.currentTime + (when || 0);
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type || 'sine'; o.frequency.setValueAtTime(freq, t);
    if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol || 0.2, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(dest || this.master);
    o.start(t); o.stop(t + dur + 0.05);
  },
  noise(dur, vol, freq, when, q, dest){
    if(!this.ctx || !this.noiseBuf) return;
    const t = this.ctx.currentTime + (when || 0);
    const s = this.ctx.createBufferSource(); s.buffer = this.noiseBuf;
    const f = this.ctx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq || 1000; f.Q.value = q || 1;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(vol || 0.2, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(dest || this.master);
    s.start(t); s.stop(t + dur + 0.05);
  },
  play(name){
    if(!this.ctx || !G.meta || !G.meta.settings.sfx) return;
    switch(name){
      case 'tap': this.tone(880, 0.06, 'triangle', 0.08); break;
      case 'card': this.noise(0.12, 0.18, 2400, 0, 0.8); this.tone(520, 0.1, 'triangle', 0.08, 0.02, null, 780); break;
      case 'hit': this.noise(0.16, 0.35, 700, 0, 0.7); this.tone(140, 0.16, 'square', 0.12, 0, null, 60); break;
      case 'block': this.tone(300, 0.12, 'triangle', 0.15); this.noise(0.08, 0.15, 3000, 0, 2); break;
      case 'burn': this.noise(0.3, 0.2, 500, 0, 0.5); this.tone(220, 0.25, 'sawtooth', 0.05, 0, null, 110); break;
      case 'charm': [660, 880, 990].forEach((f, i)=>this.tone(f, 0.25, 'sine', 0.08, i * 0.05)); break;
      case 'grudge': this.tone(330, 0.5, 'sine', 0.1, 0, null, 250); this.tone(336, 0.5, 'sine', 0.08); break;
      case 'summon': [392, 523, 659, 784].forEach((f, i)=>this.tone(f, 0.22, 'triangle', 0.1, i * 0.06)); this.noise(0.4, 0.08, 1800, 0, 0.6); break;
      case 'spirit': this.tone(620, 0.1, 'triangle', 0.08, 0, null, 900); break;
      case 'coin': this.tone(1320, 0.08, 'square', 0.06); this.tone(1760, 0.14, 'square', 0.05, 0.06); break;
      case 'heal': [523, 659, 784].forEach((f, i)=>this.tone(f, 0.3, 'sine', 0.08, i * 0.07)); break;
      case 'death': this.tone(300, 0.5, 'sawtooth', 0.08, 0, null, 60); this.noise(0.5, 0.15, 400, 0, 0.5); break;
      case 'turn': this.tone(294, 0.4, 'triangle', 0.1); this.tone(440, 0.5, 'triangle', 0.08, 0.1); break;
      case 'enemyturn': this.tone(196, 0.35, 'sawtooth', 0.06); this.noise(0.2, 0.15, 200, 0, 1); break;
      case 'error': this.tone(180, 0.15, 'square', 0.07); break;
      case 'relic': [784, 988, 1175, 1568].forEach((f, i)=>this.tone(f, 0.3, 'sine', 0.07, i * 0.05)); break;
      case 'victory': [392, 440, 523, 587, 784].forEach((f, i)=>this.tone(f, 0.45, 'triangle', 0.1, i * 0.12)); break;
      case 'defeat': [392, 349, 294, 262].forEach((f, i)=>this.tone(f, 0.6, 'sine', 0.1, i * 0.22)); break;
    }
  },
  /* 배경음: 계면조 5음계 가야금풍 뜯기 + 전투 시 장구 */
  bgm(mode){
    if(!this.ctx) return;
    if(this.bgmMode === mode) return;
    this.bgmMode = mode;
    if(this.bgmTimer){ clearInterval(this.bgmTimer); this.bgmTimer = null; }
    if(!mode) return;
    const scale = [146.8, 174.6, 196, 220, 261.6, 293.7, 349.2, 392, 440];
    let last = 4;
    const beat = mode === 'battle' ? 330 : 520;
    this.step = 0;
    this.bgmTimer = setInterval(()=>{
      if(!G.meta.settings.bgm || !this.ctx || this.ctx.state !== 'running') return;
      const s = this.step++;
      if(Math.random() < (mode === 'battle' ? 0.55 : 0.42)){
        last = clamp(last + pick(Math.random, [-2,-1,-1,1,1,2,0]), 0, scale.length - 1);
        const f = scale[last];
        this.tone(f, 1.4, 'triangle', 0.22, 0, this.bgmGain);
        this.tone(f * 2, 0.5, 'sine', 0.06, 0, this.bgmGain);
      }
      if(s % 8 === 0) this.tone(73.4, 2.2, 'sine', 0.18, 0, this.bgmGain);
      if(mode === 'battle'){
        const pat = [1,0,0,1,0,1,0,0];
        if(pat[s % 8]) { this.tone(90, 0.25, 'sine', 0.35, 0, this.bgmGain, 55); }
        if(s % 4 === 2) this.noise(0.08, 0.18, 3200, 0, 3, this.bgmGain);
      }
    }, beat);
  },
};

const _cardCache = {};
function getCardDef(inst){
  const key = inst.id + (inst.up ? '+' : '');
  if(_cardCache[key]) return _cardCache[key];
  const base = CARDS[inst.id];
  if(!base) return null;
  let d;
  if(!inst.up) d = Object.assign({}, base, {upgraded:false});
  else{
    d = Object.assign({}, base, base.up || {}, {name:base.name + '+', upgraded:true});
    if(base.type === 'spirit') d.effects = base.effects.map(e => e.type === 'summon' ? Object.assign({}, e, {plus:true}) : e);
  }
  d.id = inst.id;
  _cardCache[key] = d;
  return d;
}
function canUpgrade(inst){ const b = CARDS[inst.id]; return !inst.up && b && b.type !== 'curse'; }
function newCardInst(id, up){ G.run.uid = (G.run.uid || 0) + 1; return {uid:'c' + G.run.uid, id, up:!!up}; }
function spiritSlots(){
  let n = 4;
  if(G.run) for(const r of G.run.relics){ const d = RELICS[r]; if(d && d.stat && d.stat.slots) n += d.stat.slots; }
  return n;
}
function spiritStats(id, plus){
  const d = SPIRITS[id];
  const p = plus && d.plus ? d.plus : {};
  return {hp:p.hp || d.hp, action:p.action || d.action, death:p.death || d.death || null};
}
function rewardPool(filter){
  return Object.keys(CARDS).filter(id => {
    const c = CARDS[id];
    if(c.rarity === 'basic' || c.rarity === 'special' || c.type === 'curse') return false;
    if(filter && filter.rarity && c.rarity !== filter.rarity) return false;
    if(filter && filter.cardType && c.type !== filter.cardType) return false;
    if(filter && filter.family && c.family !== filter.family) return false;
    return true;
  });
}
function rollCards(rng, n, kind){
  const fam = LEADERS[G.run.leader].family;
  const res = [];
  const odds = kind === 'boss' ? [['rare',1]] : kind === 'elite' ? [['common',45],['uncommon',40],['rare',15]] : kind === 'shop' ? [['common',50],['uncommon',37],['rare',13]] : [['common',62],['uncommon',32],['rare',6]];
  let guard = 0;
  while(res.length < n && guard++ < 200){
    const rar = weighted(rng, odds);
    const pool = rewardPool({rarity:rar}).filter(id => !res.includes(id));
    if(!pool.length) continue;
    const entries = pool.map(id => [id, CARDS[id].family === fam ? 2.5 : (CARDS[id].family === 'neutral' ? 1.2 : 1)]);
    res.push(weighted(rng, entries));
  }
  return res;
}
function relicPool(tier){
  return Object.keys(RELICS).filter(id => RELICS[id].tier === tier && !G.run.relics.includes(id));
}
function ascLv(){ return G.run ? (G.run.ascension || 0) : 0; }

---------------------------------------------------------------- */
const MAP_ROWS = 7, MAP_COLS = 5;
function generateMap(seed, act){
  const rng = makeRng(seed, 'map', act);
  const nodes = {}, edges = new Set();
  const key = (r, c) => r + '-' + c;
  const startCols = [1, 3, rint(rng, 0, MAP_COLS - 1), rint(rng, 0, MAP_COLS - 1)];
  for(let p = 0; p < 4; p++){
    let c = startCols[p];
    for(let r = 0; r < MAP_ROWS; r++){
      if(!nodes[key(r, c)]) nodes[key(r, c)] = {id:key(r, c), r, c};
      if(r < MAP_ROWS - 1){
        let nc = clamp(c + rint(rng, -1, 1), 0, MAP_COLS - 1);
        if(nc !== c && edges.has(key(r, nc) + '>' + key(r + 1, c))) nc = c;   // 교차 방지
        edges.add(key(r, c) + '>' + key(r + 1, nc));
        c = nc;
      }
    }
  }
  nodes.boss = {id:'boss', r:MAP_ROWS, c:2, type:'boss'};
  Object.values(nodes).forEach(n => { if(n.r === MAP_ROWS - 1) edges.add(n.id + '>boss'); });
  // 종류 배정
  const ids = Object.keys(nodes).filter(k => k !== 'boss').sort((a, b) => nodes[a].r - nodes[b].r || nodes[a].c - nodes[b].c);
  for(const id of ids){
    const n = nodes[id];
    if(n.r === 0) n.type = 'battle';
    else if(n.r === 3) n.type = 'treasure';
    else if(n.r === MAP_ROWS - 1) n.type = 'inn';
    else{
      const w = [['battle',45],['event',22],['shop',12]];
      if(n.r >= 2) w.push(['elite', 13]);
      if(n.r >= 2 && n.r <= 4) w.push(['inn', 7]);
      n.type = weighted(rng, w);
    }
    n.jx = (rng() - 0.5) * 0.45;
    n.jy = (rng() - 0.5) * 0.3;
  }
  // 엘리트가 하나도 없으면 하나 지정
  if(!ids.some(id => nodes[id].type === 'elite')){
    const cands = ids.filter(id => nodes[id].r === 4 || nodes[id].r === 5);
    if(cands.length) nodes[pick(rng, cands)].type = 'elite';
  }
  // 상점이 하나도 없으면 하나 지정
  if(!ids.some(id => nodes[id].type === 'shop')){
    const cands = ids.filter(id => nodes[id].r === 2 || nodes[id].r === 5);
    if(cands.length) nodes[pick(rng, cands)].type = 'shop';
  }
  return {nodes, edges:[...edges]};
}
function availableNodes(){
  const run = G.run;
  const m = run.map;
  if(!run.path.length) return Object.values(m.nodes).filter(n => n.r === 0).map(n => n.id);
  const last = run.path[run.path.length - 1];
  return m.edges.filter(e => e.split('>')[0] === last).map(e => e.split('>')[1]);
}

function startRun(leaderId, seedStr, asc){
  const L = LEADERS[leaderId];
  const seed = (seedStr && seedStr.trim()) ? seedStr.trim().toUpperCase().slice(0, 16) : randomSeedString();
  let hp = L.hp - (asc >= 3 ? 6 : 0);
  G.run = {
    version:VERSION, seed, leader:leaderId, ascension:asc,
    hp, maxHp:hp, gold:99, deck:[], relics:[], uid:0,
    act:1, map:null, path:[], pendingNode:null, nodeState:null, rewardState:null,
    removeCost:60, actBattles:0, floorTotal:0, seenEvents:[],
    stats:{kills:0, elites:0, bosses:0, cards:0, startTime:Date.now(), playTime:0},
  };
  G.run.deck = L.deck.map(id => newCardInst(id));
  G.run.relics = [L.relic];
  codexSee('relics', L.relic);
  L.deck.forEach(id => codexSee('cards', id));
  G.run.map = generateMap(seed, 1);
  G.meta.stats.runs++;
  saveMeta();
  saveRun();
  G.ui.storyAct = 1;
  setScreen('actTransition');
}
function gainRelic(id){
  if(!id || G.run.relics.includes(id)) return;
  G.run.relics.push(id);
  codexSee('relics', id);
  const d = RELICS[id];
  Sound.play('relic');
  if(d.onPickup) executeEffects(d.onPickup, {run:G.run, rng:makeRng(G.run.seed, 'pickup', id)});
}
function addCardToDeck(id, up){
  G.run.deck.push(newCardInst(id, up));
  codexSee('cards', id);
  G.run.stats.cards++;
}
function healRun(n){
  const before = G.run.hp;
  G.run.hp = Math.min(G.run.maxHp, G.run.hp + n);
  return G.run.hp - before;
}
function updatePlayTime(){
  if(!G.run) return;
  const now = Date.now();
  G.run.stats.playTime += Math.max(0, now - (G.run.stats.lastTick || now));
  G.run.stats.lastTick = now;
}

function enterNode(id){
  const run = G.run;
  const node = run.map.nodes[id];
  if(!node) return;
  Sound.play('tap');
  run.path.push(id);
  run.floorTotal++;
  run.pendingNode = id;
  run.nodeState = null;
  saveRun();
  openNode(node);
}
function openNode(node){
  const run = G.run;
  const rng = makeRng(run.seed, 'node', run.act, node.id);
  switch(node.type){
    case 'battle':{
      const pool = run.actBattles < 2 ? ENCOUNTERS[run.act].easy : ENCOUNTERS[run.act].normal;
      startBattle(pick(rng, pool).slice(), 'battle', node.id);
      break;
    }
    case 'elite': startBattle(pick(rng, ENCOUNTERS[run.act].elite).slice(), 'elite', node.id); break;
    case 'boss': startBattle(ENCOUNTERS[run.act].boss.slice(), 'boss', node.id); break;
    case 'shop':
      if(!run.nodeState) run.nodeState = makeShop(rng);
      saveRun(); setScreen('shop'); break;
    case 'inn': setScreen('inn'); break;
    case 'treasure':
      if(!run.nodeState){ const pool = relicPool('common'); run.nodeState = {relic: pool.length ? pick(rng, pool) : null, opened:false}; }
      saveRun(); setScreen('treasure'); break;
    case 'event':{
      if(!run.nodeState){
        let pool = Object.keys(EVENTS).filter(k => EVENTS[k].acts.includes(run.act) && !run.seenEvents.includes(k));
        if(!pool.length) pool = Object.keys(EVENTS).filter(k => EVENTS[k].acts.includes(run.act));
        const ev = pick(rng, pool);
        run.seenEvents.push(ev);
        run.nodeState = {event:ev, done:false, resultText:''};
      }
      saveRun(); setScreen('event'); break;
    }
  }
}
function completeNode(){
  const run = G.run;
  run.pendingNode = null;
  run.nodeState = null;
  run.rewardState = null;
  updatePlayTime();
  saveRun();
  setScreen('map');
}
function makeShop(rng){
  const cards = rollCards(rng, 5, 'shop').map(id => {
    const r = CARDS[id].rarity;
    const base = r === 'rare' ? 140 : r === 'uncommon' ? 75 : 48;
    return {id, price:Math.round(base * (0.9 + rng() * 0.2)), sold:false};
  });
  const rp = shuffle(rng, relicPool('common')).slice(0, 2).map(id => ({id, price:rint(rng, 135, 170), sold:false}));
  return {cards, relics:rp, removed:false};
}

/* ---------------------------------------------------------------
   16. 공용 효과 실행기 executeEffects()
   - 전투 효과(피해·방어·상태이상·소환…)와 런 효과(엽전·카드·보물…)를 모두 처리
   - ctx: {battle, source, target, card, run, rng, force}
---------------------------------------------------------------- */
const EFFECTS = {};

async function executeEffects(effects, ctx){
  if(!effects) return;
  ctx = ctx || {};
  for(const e of effects){
    const b = ctx.battle;
    if(b && b.over && !ctx.force) return;
    const h = EFFECTS[e.type];
    if(!h){ console.warn('알 수 없는 효과', e.type); continue; }
    await h(e, ctx);
    if(b && !ctx.force) checkBattleEnd();
  }
}

/* 대상 해석 */
function isAllySide(u){ return u && (u.kind === 'player' || u.kind === 'spirit'); }
function aliveEnemies(){ const b = G.battle; return b ? b.enemies.filter(e => e.hp > 0) : []; }
function resolveTargets(e, ctx, def){
  const b = ctx.battle;
  if(!b) return [];
  const src = ctx.source || b.player;
  const t = e.target || def;
  const ally = isAllySide(src);
  const alive = aliveEnemies();
  switch(t){
    case 'enemy':
      if(!ally) return [b.player];
      if(ctx.target && ctx.target.hp > 0 && ctx.target.kind === 'enemy') return [ctx.target];
      return alive.length ? [pick(b.rng, alive)] : [];
    case 'randomEnemy': return ally ? (alive.length ? [pick(b.rng, alive)] : []) : [b.player];
    case 'frontEnemy': return ally ? alive.slice(0, 1) : [b.player];
    case 'allEnemies': return ally ? alive : [b.player];
    case 'player': return [b.player];
    case 'self': return [src];
    case 'allSpirits': return b.spirits.filter(s => s.hp > 0);
    case 'randomSpirit':{
      const sp = b.spirits.filter(s => s.hp > 0);
      return sp.length ? [pick(b.rng, sp)] : [b.player];
    }
    case 'allAllies': return ally ? [b.player, ...b.spirits.filter(s => s.hp > 0)] : alive;
    default: return [];
  }
}

/* 피해 계산 */
function st(u, k){ return (u && u.status && u.status[k]) || 0; }
function calcDamage(src, tgt, base){
  let dmg = base;
  if(src){
    if(src.kind === 'spirit') dmg += src.atkBonus || 0;
    else dmg += st(src, 'str');
    if(st(src, 'weak') > 0) dmg *= 0.75;
    if(src.kind === 'enemy' && st(src, 'charm') > 0) dmg *= 0.75;
    if(src.kind === 'enemy' && ascLv() >= 2){ const d = ENEMIES[src.id]; if(d && (d.elite || d.boss)) dmg *= 1.15; }
  }
  if(tgt && (st(tgt, 'grudge') > 0 || st(tgt, 'vuln') > 0)) dmg *= 1.5;
  return Math.max(0, Math.floor(dmg));
}
async function dealDamage(src, tgt, base, opts){
  opts = opts || {};
  if(!tgt || tgt.hp <= 0) return 0;
  let dmg = opts.raw ? base : calcDamage(src, tgt, base);
  let blocked = 0;
  if(!opts.pierce){ blocked = Math.min(tgt.block || 0, dmg); tgt.block -= blocked; dmg -= blocked; }
  tgt.hp = Math.max(0, tgt.hp - dmg);
  renderBattle();
  if(dmg > 0){
    fxShake(tgt.uid);
    fxText(tgt.uid, '-' + dmg, opts.cls || 'dmg');
    Sound.play(opts.sound || 'hit');
  }else if(blocked > 0){
    fxText(tgt.uid, '막음', 'blk');
    Sound.play('block');
  }
  if(tgt.kind === 'enemy' && tgt.hp > 0) checkPhase(tgt);
  if(tgt.hp <= 0) await onUnitDeath(tgt);
  return dmg;
}
function applyStatus(tgt, key, val){
  if(!tgt || tgt.hp <= 0 || !val) return;
  tgt.status[key] = (tgt.status[key] || 0) + val;
  if(tgt.status[key] <= 0) delete tgt.status[key];
  renderBattle();
  const cls = {burn:'burn', charm:'charm', grudge:'grudge'}[key] || 'st';
  fxText(tgt.uid, STATUS_INFO[key].name + (val > 0 ? ' +' : ' ') + val, 'st ' + cls);
  if(key === 'burn') Sound.play('burn');
  else if(key === 'charm') Sound.play('charm');
  else if(key === 'grudge') Sound.play('grudge');
}
function gainBlock(u, v){
  if(!u || u.hp <= 0 || v <= 0) return;
  u.block = (u.block || 0) + v;
  renderBattle();
  fxText(u.uid, '방어 +' + v, 'blk');
  Sound.play('block');
}

/* --- 전투 효과 --- */
EFFECTS.damage = async (e, ctx) => {
  const b = ctx.battle; if(!b) return;
  const src = ctx.source || b.player;
  const hits = e.hits || 1;
  for(let i = 0; i < hits; i++){
    if(b.over) return;
    const targets = resolveTargets(e, ctx, 'enemy');
    for(const t of targets){
      let v = e.value || 0;
      if(e.bonusIf && st(t, e.bonusIf) > 0) v += e.bonus || 0;
      if(e.perDeadSpirit) v += e.perDeadSpirit * b.deadSpirits;
      await dealDamage(src, t, v);
    }
    if(src.kind === 'enemy' && targets.length) fxClass(src.uid, 'lunge');
    if(hits > 1) await sleep(140);
  }
};
EFFECTS.block = async (e, ctx) => {
  const b = ctx.battle; if(!b) return;
  const src = ctx.source || b.player;
  const def = src.kind === 'enemy' ? 'self' : 'player';
  resolveTargets(e, ctx, def).forEach(t => gainBlock(t, e.value));
};
for(const k of ['burn','charm','grudge']){
  EFFECTS[k] = async (e, ctx) => {
    if(!ctx.battle) return;
    resolveTargets(e, ctx, 'enemy').forEach(t => applyStatus(t, k, e.value));
    await sleep(60);
  };
}
EFFECTS.weak = async (e, ctx) => { if(!ctx.battle) return; resolveTargets(e, ctx, 'enemy').forEach(t => applyStatus(t, 'weak', e.value)); };
EFFECTS.vuln = async (e, ctx) => { if(!ctx.battle) return; resolveTargets(e, ctx, 'enemy').forEach(t => applyStatus(t, 'vuln', e.value)); };
EFFECTS.strength = async (e, ctx) => {
  const b = ctx.battle; if(!b) return;
  const src = ctx.source || b.player;
  const def = src.kind === 'spirit' ? 'player' : 'self';
  resolveTargets(e, ctx, def).forEach(t => applyStatus(t, 'str', e.value));
};
EFFECTS.cleanse = async (e, ctx) => {
  const b = ctx.battle; if(!b) return;
  const src = ctx.source;
  if(!src) return;
  let any = false;
  ['burn','charm','grudge','weak','vuln'].forEach(k => { if(src.status[k]){ delete src.status[k]; any = true; } });
  if(any){ renderBattle(); fxText(src.uid, '정화', 'st'); }
};
EFFECTS.draw = async (e, ctx) => { if(ctx.battle) await drawCards(e.value || 1); };
EFFECTS.energy = async (e, ctx) => {
  const b = ctx.battle; if(!b) return;
  b.energy += e.value || 1;
  renderBattle();
  fxText('P', '요력 +' + (e.value || 1), 'st');
};
EFFECTS.heal = async (e, ctx) => {
  const b = ctx.battle;
  if(!b){ healRun(e.value); return; }
  const src = ctx.source || b.player;
  const t = src.kind === 'enemy' ? src : b.player;
  if(t.hp <= 0) return;
  const before = t.hp;
  t.hp = Math.min(t.maxHp, t.hp + e.value);
  if(t.hp > before){ renderBattle(); fxText(t.uid, '+' + (t.hp - before), 'heal'); Sound.play('heal'); }
};
EFFECTS.selfDamage = async (e, ctx) => {
  const b = ctx.battle; if(!b) return;
  await dealDamage(null, b.player, e.value, {raw:true, pierce:true});
};
EFFECTS.summon = async (e, ctx) => { if(ctx.battle) await summonSpirit(e.spirit, !!e.plus); };
EFFECTS.buffSpirits = async (e, ctx) => {
  const b = ctx.battle; if(!b) return;
  const list = b.spirits.filter(s => s.hp > 0 && !(e.others && s === ctx.source));
  list.forEach(s => { s.atkBonus = (s.atkBonus || 0) + e.value; fxText(s.uid, '공격 +' + e.value, 'st'); });
  if(list.length) renderBattle();
};
EFFECTS.healSpirits = async (e, ctx) => {
  const b = ctx.battle; if(!b) return;
  b.spirits.filter(s => s.hp > 0).forEach(s => {
    const before = s.hp; s.hp = Math.min(s.maxHp, s.hp + e.value);
    if(s.hp > before) fxText(s.uid, '+' + (s.hp - before), 'heal');
  });
  renderBattle();
};
EFFECTS.spiritActAll = async (e, ctx) => {
  const b = ctx.battle; if(!b) return;
  for(const sp of b.spirits.slice()){
    if(b.over) return;
    if(sp.hp > 0 && b.spirits.includes(sp)) await spiritAct(sp);
  }
};
EFFECTS.drawPerSpirit = async (e, ctx) => {
  const b = ctx.battle; if(!b) return;
  const n = b.spirits.filter(s => s.hp > 0).length;
  if(n > 0) await drawCards(n); else toast('아군 요괴가 없다');
};
EFFECTS.detonateBurn = async (e, ctx) => {
  const b = ctx.battle; if(!b) return;
  const t = resolveTargets({target:'enemy'}, ctx, 'enemy')[0];
  if(!t) return;
  const v = st(t, 'burn') * (e.mult || 2);
  if(v <= 0){ fxText(t.uid, '화상 없음', 'st'); return; }
  fxFlash();
  await dealDamage(ctx.source || b.player, t, v, {raw:true, cls:'burn', sound:'burn'});
};
EFFECTS.sacrifice = async (e, ctx) => {
  const b = ctx.battle; if(!b) return;
  const sp = b.spirits.filter(s => s.hp > 0).sort((a, c) => a.hp - c.hp)[0];
  if(!sp){ toast('제물로 바칠 요괴가 없다'); return; }
  fxText(sp.uid, '제물', 'st grudge');
  await killSpirit(sp);
};
EFFECTS.grow = async (e, ctx) => {
  const src = ctx.source;
  if(src && src.kind === 'spirit' && src.hp > 0){ src.atkBonus = (src.atkBonus || 0) + e.value; fxText(src.uid, '공격 +' + e.value, 'st'); renderBattle(); }
};

/* --- 런 단위 효과 (사건·보물 획득 등) --- */
EFFECTS.gold = async (e, ctx) => {
  G.run.gold = Math.max(0, G.run.gold + e.value);
  if(e.value > 0) Sound.play('coin');
};
EFFECTS.loseHp = async (e, ctx) => {

EFFECTS.healRun = async (e, ctx) => { healRun(e.value); Sound.play('heal'); };
EFFECTS.gainMaxHp = async (e, ctx) => { G.run.maxHp += e.value; G.run.hp += e.value; Sound.play('heal'); };
EFFECTS.addCard = async (e, ctx) => {

EFFECTS.removeCard = async (e, ctx) => {

  if(uid){ G.run.deck = G.run.deck.filter(c => c.uid !== uid); Sound.play('tap'); }
};
EFFECTS.upgradeCard = async (e, ctx) => {
  const uid = await pickFromDeck('강화할 카드를 고르세요', c => canUpgrade(c), false);
  if(uid){ const c = G.run.deck.find(x => x.uid === uid); if(c) c.up = true; Sound.play('relic'); }
};
EFFECTS.upgradeRandom = async (e, ctx) => {
  const rng = ctx.rng || makeRng(G.run.seed, 'upr', G.run.floorTotal);
  const list = shuffle(rng, G.run.deck.filter(canUpgrade)).slice(0, e.value || 1);
  list.forEach(c => c.up = true);
  ctx.gained = ctx.gained || [];
  list.forEach(c => ctx.gained.push({kind:'upgrade', id:c.id}));
};
EFFECTS.chance = async (e, ctx) => {
  const rng = ctx.rng || Math.random;
  const ok = rng() < e.p;
  ctx.resultText = ok ? e.successText : e.failText;
  await executeEffects(ok ? e.success : e.fail, ctx);
};

/* 효과 설명문 생성 (카드·요괴·보물 공용) */
function targetPrefix(t){
  return t === 'allEnemies' ? '모든 적에게 ' : t === 'randomEnemy' ? '무작위 적에게 ' : t === 'player' ? '주인에게 ' : t === 'frontEnemy' ? '맨 앞 적에게 ' : '';
}
function describeEffect(e){
  const v = e.value;
  switch(e.type){
    case 'damage':{
      let s = targetPrefix(e.target) + '피해 <em>' + v + '</em>' + (e.hits > 1 ? ' ×' + e.hits : '');
      if(e.bonusIf) s += ` (${STATUS_INFO[e.bonusIf].name} 상태면 +${e.bonus})`;
      if(e.perDeadSpirit) s += ` (쓰러진 요괴당 +${e.perDeadSpirit})`;
      return s;
    }
    case 'block': return targetPrefix(e.target) + '방어도 <em>' + v + '</em>';
    case 'burn': case 'charm': case 'grudge': case 'weak': case 'vuln':
      return targetPrefix(e.target) + STATUS_INFO[e.type].name + ' <em>' + v + '</em>';
    case 'strength': return '요기 <em>' + v + '</em>';
    case 'draw': return '카드 <em>' + v + '</em>장 뽑기';
    case 'energy': return '요력 <em>' + v + '</em> 획득';
    case 'heal': return '생명 <em>' + v + '</em> 회복';
    case 'selfDamage': return '생명 ' + v + ' 잃음';
    case 'summon':{
      const s = spiritStats(e.spirit, e.plus);
      let txt = `<b>소환</b> · 체력 ${s.hp}<br>매 턴: ${s.action.map(describeEffect).join(', ')}`;
      if(s.death) txt += `<br>쓰러질 때: ${s.death.map(describeEffect).join(', ')}`;
      return txt;
    }
    case 'buffSpirits': return (e.others ? '다른 ' : '') + '아군 요괴 공격력 <em>+' + v + '</em>';
    case 'healSpirits': return '아군 요괴 체력 <em>' + v + '</em> 회복';
    case 'spiritActAll': return '모든 아군 요괴가 즉시 행동';
    case 'drawPerSpirit': return '아군 요괴 수만큼 카드 뽑기';
    case 'detonateBurn': return '대상의 화상 수치 <em>×' + e.mult + '</em> 피해';
    case 'sacrifice': return '가장 약한 아군 요괴를 제물로 바침';
    case 'grow': return '자신의 공격력 +' + v;
    case 'cleanse': return '자신의 해로운 효과 제거';
    default: return '';
  }
}
function describeCard(def){
  if(def.text) return def.text;
  let s = def.effects.map(describeEffect).filter(Boolean).join('. ');
  if(def.type === 'spirit') s = def.effects.map(describeEffect).join('');
  if(def.exhaust) s += '. <em>소멸</em>';
  return s;
}

/* ---------------------------------------------------------------
   17. 전투 엔진
   턴 단계: turnStart → draw → playerPhase → spiritPhase → enemyPhase → turnEnd
   훅: battleStart, turnStart, draw, cardPlay, summon, spiritAct, spiritPhase,
       enemyPhase, spiritDeath, enemyDeath, turnEnd, battleWin
---------------------------------------------------------------- */
function newEnemyUnit(id, idx, rng){
  const d = ENEMIES[id];
  let hp = rint(rng, d.hp[0], d.hp[1]);
  const asc = ascLv();
  if(asc >= 1 && !d.elite && !d.boss) hp = Math.round(hp * 1.1);
  if(asc >= 4 && d.boss) hp = Math.round(hp * 1.15);
  codexSee('enemies', id);
  return {uid:'E' + idx, kind:'enemy', id, name:d.name, hp, maxHp:hp, block:0, status:{}, intent:null, aiIdx:0, history:[], seq:null, phaseDone:[], pendingPhase:null};
}
function startBattle(enemyIds, kind, nodeId){
  const run = G.run;
  const rng = makeRng(run.seed, 'battle', run.act, nodeId, run.floorTotal);
  const L = LEADERS[run.leader];
  const b = {
    kind, nodeId, rng, turn:0, phase:'start', busy:true, over:null, finished:false,
    player:{uid:'P', kind:'player', name:L.name, hp:run.hp, maxHp:run.maxHp, block:0, status:{}},
    enemies:enemyIds.map((id, i) => newEnemyUnit(id, i, rng)),
    spirits:[], spiritUid:0, deadSpirits:0,
    drawPile:shuffle(rng, run.deck.map(c => ({uid:c.uid, id:c.id, up:c.up}))),
    hand:[], discard:[], exhaust:[],
    energy:0, maxEnergy:3, selected:null, hooks:{}, newCards:new Set(), cardsPlayed:0,
  };
  G.battle = b;
  // 보물 훅 등록
  for(const rid of run.relics){
    const d = RELICS[rid];
    if(d && d.triggers) registerTriggers('relic:' + rid, d.triggers, rid);
  }
  b.enemies.forEach(e => chooseIntent(e));
  setScreen('battle');
  Sound.bgm('battle');
  (async () => {
    await sleep(350);
    showBanner(kind === 'boss' ? '우두머리 출현' : kind === 'elite' ? '정예 출현' : '전투 개시');
    await sleep(500);
    await emit('battleStart');
    if(b.over){ await finishBattle(); return; }
    await beginTurn();
  })();
}
function registerTriggers(source, triggers, relicId){
  const b = G.battle;
  for(const t of triggers){
    if(!b.hooks[t.on]) b.hooks[t.on] = [];
    b.hooks[t.on].push(Object.assign({}, t, {source, relicId}));
  }
}
function unregisterSource(prefix){
  const b = G.battle;
  for(const k in b.hooks) b.hooks[k] = b.hooks[k].filter(h => !h.source.startsWith(prefix));
}
function checkCond(h, ctx){
  const b = G.battle;
  if(h.family && (!ctx.spirit || ctx.spirit.family !== h.family)) return false;
  if(h.firstTurn && b.turn !== 1) return false;
  if(h.everyN && b.turn % h.everyN !== 0) return false;
  if(h.minSpirits && b.spirits.filter(s => s.hp > 0).length < h.minSpirits) return false;
  return true;
}
async function emit(name, ctx, force){
  const b = G.battle;
  if(!b || (b.over && !force)) return;
  ctx = ctx || {};
  const list = (b.hooks[name] || []).slice();
  for(const h of list){
    if(b.over && !force) return;
    if(!checkCond(h, ctx)) continue;
    if(h.relicId) flashRelic(h.relicId);
    await executeEffects(h.effects, {battle:b, source:ctx.source || b.player, target:ctx.target, spirit:ctx.spirit, force});
    await sleep(80);
  }
}
function refreshSynergies(){
  const b = G.battle;
  unregisterSource('syn:');
  const cnt = {};
  b.spirits.filter(s => s.hp > 0).forEach(s => cnt[s.family] = (cnt[s.family] || 0) + 1);
  b.synergy = cnt;
  for(const fam in SYNERGIES){
    SYNERGIES[fam].tiers.forEach((tier, i) => {
      if((cnt[fam] || 0) >= tier.need) registerTriggers('syn:' + fam + i, tier.triggers);
    });
  }
}
function checkBattleEnd(){
  const b = G.battle;
  if(!b || b.over) return;
  if(b.player.hp <= 0) b.over = 'lose';
  else if(aliveEnemies().length === 0) b.over = 'win';
}
function checkPhase(e){
  const d = ENEMIES[e.id];
  if(!d.phases) return;
  d.phases.forEach((p, i) => {
    if(!e.phaseDone.includes(i) && e.hp <= e.maxHp * p.below){ e.phaseDone.push(i); e.pendingPhase = p; }
  });
}
async function onUnitDeath(u){
  const b = G.battle;
  if(u.kind === 'enemy'){
    if(u.dead) return;
    u.dead = true;
    Sound.play('death');
    G.run.stats.kills++;
    renderBattle();
    await sleep(280);
    await emit('enemyDeath', {target:u});
  }else if(u.kind === 'spirit'){
    await killSpirit(u);
  }else{
    checkBattleEnd();
  }
}
async function killSpirit(sp){
  const b = G.battle;
  if(sp.dead) return;
  sp.dead = true; sp.hp = 0;
  Sound.play('death');
  renderBattle();
  await sleep(300);
  b.spirits = b.spirits.filter(s => s !== sp);
  b.deadSpirits++;
  renderBattle();
  const stats = spiritStats(sp.id, sp.plus);
  if(stats.death){ toast(sp.name + '의 마지막 원한!'); await executeEffects(stats.death, {battle:b, source:sp}); }
  await emit('spiritDeath', {spirit:sp, source:b.player});
  refreshSynergies();
  renderBattle();
}
async function summonSpirit(id, plus){
  const b = G.battle;
  if(b.spirits.length >= spiritSlots()){ toast('요괴 자리가 가득 찼다'); return; }
  const d = SPIRITS[id];
  const s = spiritStats(id, plus);
  const sp = {uid:'S' + (++b.spiritUid), kind:'spirit', id, name:d.name + (plus ? '+' : ''), family:d.family, hp:s.hp, maxHp:s.hp, block:0, status:{}, atkBonus:0, plus, fresh:true};
  b.spirits.push(sp);
  refreshSynergies();
  Sound.play('summon');
  renderBattle();
  await sleep(380);
  sp.fresh = false;
  await emit('summon', {spirit:sp, source:b.player});
}
async function drawCards(n){
  const b = G.battle;
  let drew = 0;
  for(let i = 0; i < n; i++){
    if(b.hand.length >= 10){ toast('손이 가득 찼다'); break; }
    if(!b.drawPile.length){
      if(!b.discard.length) break;
      b.drawPile = shuffle(b.rng, b.discard);
      b.discard = [];
    }
    const c = b.drawPile.pop();
    b.hand.push(c);
    b.newCards.add(c.uid);
    drew++;
  }
  if(drew){ Sound.play('card'); renderBattle(); await sleep(120); }
}
function chooseIntent(e){
  const b = G.battle;
  const d = ENEMIES[e.id];
  const seq = e.seq || (d.ai.type === 'cycle' ? d.ai.seq : null);
  let key;
  if(seq){ key = seq[e.aiIdx % seq.length]; e.aiIdx++; }
  else{
    let entries = Object.entries(d.ai.weights);
    const h = e.history.slice(-2);
    if(h.length === 2 && h[0] === h[1]) entries = entries.filter(([k]) => k !== h[0]);
    if(!b.spirits.length){
      const f = entries.filter(([k]) => !d.moves[k].effects.every(x => x.target === 'allSpirits'));
      if(f.length) entries = f;
    }
    key = weighted(b.rng, entries);
  }
  e.intent = key;
  e.history.push(key);
}
function intentInfo(e){
  const b = G.battle;
  const mv = ENEMIES[e.id].moves[e.intent];
  if(!mv) return {icons:[], name:''};
  const icons = [];
  for(const x of mv.effects){
    if(x.type === 'damage'){
      const tgt = x.target || 'enemy';
      if(tgt === 'allSpirits') icons.push({k:'seal', v:calcDamage(e, null, x.value)});
      else if(tgt === 'randomSpirit') icons.push({k:'spirit', v:calcDamage(e, null, x.value), h:x.hits});
      else icons.push({k:'attack', v:calcDamage(e, b.player, x.value), h:x.hits});
    }else if(x.type === 'block') icons.push({k:'block'});
    else if(x.type === 'strength' || x.type === 'cleanse') icons.push({k:'buff'});
    else icons.push({k:'debuff'});
  }
  // 같은 종류 아이콘 정리
  const seen = new Set(), out = [];
  for(const i of icons){ if(i.v === undefined && seen.has(i.k)) continue; seen.add(i.k); out.push(i); }
  return {icons:out, name:mv.name, desc:mv.effects.map(x => enemyEffectText(e, x)).join(', ')};
}
function enemyEffectText(e, x){
  const b = G.battle;
  switch(x.type){
    case 'damage':{
      const t = x.target || 'enemy';
      const v = calcDamage(e, t === 'enemy' ? b.player : null, x.value);
      const who = t === 'allSpirits' ? '모든 아군 요괴에게 ' : t === 'randomSpirit' ? '무작위 아군 요괴에게 ' : '';
      return who + '피해 ' + v + (x.hits > 1 ? '×' + x.hits : '');
    }
    case 'block': return x.target === 'allAllies' ? '모든 동료 방어도 ' + x.value : '방어도 ' + x.value;
    case 'strength': return (x.target === 'allAllies' ? '모든 동료 ' : '') + '요기 +' + x.value;
    case 'weak': return '쇠약 ' + x.value + ' 부여';
    case 'vuln': return '취약 ' + x.value + ' 부여';
    case 'burn': return '화상 ' + x.value + ' 부여';
    case 'cleanse': return '자신의 해로운 효과 제거';
    default: return '';
  }
}

async function beginTurn(){
  const b = G.battle;
  if(b.over){ await finishBattle(); return; }
  b.turn++;
  b.phase = 'start';
  b.busy = true;
  b.player.block = 0;
  b.energy = b.maxEnergy;
  // 플레이어 화상
  if(st(b.player, 'burn') > 0){
    const v = b.player.status.burn;
    await dealDamage(null, b.player, v, {raw:true, pierce:true, cls:'burn', sound:'burn'});
    b.player.status.burn--; if(b.player.status.burn <= 0) delete b.player.status.burn;
    checkBattleEnd();
    if(b.over){ await finishBattle(); return; }
  }
  showBanner(b.turn + '번째 밤길');
  Sound.play('turn');
  renderBattle();
  await sleep(300);
  await emit('turnStart');
  if(b.over){ await finishBattle(); return; }
  await drawCards(5);
  await emit('draw');
  if(b.over){ await finishBattle(); return; }
  b.phase = 'player';
  b.busy = false;
  renderBattle();
}
async function endTurn(){
  const b = G.battle;
  if(!b || b.phase !== 'player' || b.busy || b.over) return;
  b.busy = true;
  b.selected = null;
  b.phase = 'spirit';
  Sound.play('tap');
  // 손패 버리기
  b.discard.push(...b.hand);
  b.hand = [];
  renderBattle();
  await sleep(200);
  // 요괴 행동 단계
  await emit('spiritPhase');
  if(b.over){ await finishBattle(); return; }
  for(const sp of b.spirits.slice()){
    if(b.over) break;
    if(sp.hp > 0 && b.spirits.includes(sp)) await spiritAct(sp);
  }
  if(b.over){ await finishBattle(); return; }
  // 적 행동 단계
  b.phase = 'enemy';
  renderBattle();
  await sleep(250);
  Sound.play('enemyturn');
  await emit('enemyPhase');
  for(const e of b.enemies.slice()){
    if(b.over) break;
    if(e.hp <= 0) continue;
    await enemyAct(e);
    await sleep(200);
  }
  if(b.over){ await finishBattle(); return; }
  // 턴 종료
  b.phase = 'end';
  for(const e of b.enemies){
    if(e.hp <= 0) continue;
    ['charm','grudge','weak','vuln'].forEach(k => { if(e.status[k]){ e.status[k]--; if(e.status[k] <= 0) delete e.status[k]; } });
  }
  ['weak','vuln'].forEach(k => { if(b.player.status[k]){ b.player.status[k]--; if(b.player.status[k] <= 0) delete b.player.status[k]; } });
  await emit('turnEnd');
  if(b.over){ await finishBattle(); return; }
  b.enemies.forEach(e => { if(e.hp > 0) chooseIntent(e); });
  renderBattle();
  await beginTurn();
}
async function spiritAct(sp){
  const b = G.battle;
  const alive = aliveEnemies();
  if(!alive.length) return;
  const target = pick(b.rng, alive);
  fxClass(sp.uid, 'act');
  Sound.play('spirit');
  await sleep(160);
  const s = spiritStats(sp.id, sp.plus);
  await executeEffects(s.action, {battle:b, source:sp, target});
  await sleep(200);
  if(b.over) return;
  await emit('spiritAct', {spirit:sp, source:sp, target});
}
async function enemyAct(e){
  const b = G.battle;
  e.block = 0;
  renderBattle();
  // 화상
  if(st(e, 'burn') > 0){
    const v = e.status.burn;
    await dealDamage(null, e, v, {raw:true, pierce:true, cls:'burn', sound:'burn'});
    if(e.status.burn){ e.status.burn--; if(e.status.burn <= 0) delete e.status.burn; }
    renderBattle();
    await sleep(200);
    if(e.hp <= 0 || b.over) return;
  }
  // 2단계 전환
  if(e.pendingPhase){
    const p = e.pendingPhase; e.pendingPhase = null;
    showBanner(p.name);
    fxFlash();
    await sleep(500);
    await executeEffects(p.effects, {battle:b, source:e});
    if(p.seq){ e.seq = p.seq; e.aiIdx = 0; chooseIntent(e); }
    await sleep(300);
  }
  // 홀림 5 이상: 행동 불가
  if(st(e, 'charm') >= 5){
    delete e.status.charm;
    fxText(e.uid, '넋을 잃었다!', 'st charm');
    Sound.play('charm');
    renderBattle();
    await sleep(500);
    return;
  }
  const mv = ENEMIES[e.id].moves[e.intent];
  if(!mv) return;
  fxText(e.uid, mv.name, 'st');
  await sleep(250);
  await executeEffects(mv.effects, {battle:b, source:e});
}
async function playCard(idx, target){
  const b = G.battle;
  if(!b || b.phase !== 'player' || b.busy || b.over) return;
  const inst = b.hand[idx];
  if(!inst) return;
  const def = getCardDef(inst);
  if(def.unplayable){ toast('사용할 수 없는 카드다'); Sound.play('error'); return; }
  if(def.cost > b.energy){ toast('요력이 부족하다'); Sound.play('error'); return; }
  if(def.type === 'spirit' && b.spirits.length >= spiritSlots()){ toast('요괴 자리가 가득 찼다'); Sound.play('error'); return; }
  if(def.target === 'enemy' && (!target || target.hp <= 0)) target = aliveEnemies()[0];
  b.busy = true;
  b.selected = null;
  b.energy -= def.cost;
  b.hand.splice(idx, 1);
  Sound.play('card');
  fxCardPlay(def);
  renderBattle();
  await sleep(160);
  await executeEffects(def.effects, {battle:b, source:b.player, target, card:def});
  if(def.exhaust) b.exhaust.push(inst); else b.discard.push(inst);
  b.cardsPlayed++;
  if(!b.over) await emit('cardPlay', {card:def});
  b.busy = false;
  renderBattle();
  if(b.over) await finishBattle();
}
async function finishBattle(){
  const b = G.battle;
  if(!b || b.finished) return;
  b.finished = true;
  b.busy = true;
  const run = G.run;
  if(b.over === 'win'){
    await emit('battleWin', {}, true);
    run.hp = Math.max(1, Math.min(b.player.hp, run.maxHp));
    if(b.kind === 'battle') run.actBattles++;
    if(b.kind === 'elite') run.stats.elites++;
    if(b.kind === 'boss'){
      run.stats.bosses++;
      if(run.act === 1 && !G.meta.unlocks.act1Boss){ G.meta.unlocks.act1Boss = true; G.ui.newUnlock = true; }
      G.meta.stats.bestAct = Math.max(G.meta.stats.bestAct, run.act);
    }
    G.meta.stats.kills += b.enemies.length;
    saveMeta();
    Sound.play('victory');
    showBanner(b.kind === 'boss' ? '봉인 파괴!' : '승리');
    await sleep(1100);
    Sound.bgm('map');
    run.rewardState = makeReward(b.kind, b.nodeId);
    saveRun();
    G.battle = null;
    setScreen('reward');
  }else{
    run.hp = 0;
    Sound.play('defeat');
    showBanner('행렬이 흩어졌다');
    await sleep(1400);
    Sound.bgm(null);
    G.battle = null;
    endRun(false);
  }
}
function makeReward(kind, nodeId){
  const run = G.run;
  const rng = makeRng(run.seed, 'reward', run.act, nodeId);
  const gold = kind === 'boss' ? 85 + run.act * 10 : kind === 'elite' ? rint(rng, 30, 40) + run.act * 5 : rint(rng, 13, 21) + run.act * 3;
  const r = {kind, gold, goldTaken:false, cards:rollCards(rng, 3, kind === 'boss' ? 'boss' : kind), cardTaken:false, relic:null, relicTaken:false, bossRelics:null};
  r.cards.forEach(id => codexSee('cards', id));
  if(kind === 'elite'){ const pool = relicPool('common'); if(pool.length) r.relic = pick(rng, pool); }
  if(kind === 'boss'){ r.bossRelics = shuffle(rng, relicPool('boss')).slice(0, 3); }
  return r;
}
function endRun(win){
  const run = G.run;
  updatePlayTime();
  G.ui.result = {
    win, leader:run.leader, act:run.act, floor:run.floorTotal, kills:run.stats.kills, cards:run.deck.length,
    relics:run.relics.length, time:run.stats.playTime, seed:run.seed, asc:run.ascension, unlocked:false,
  };
  if(win){
    G.meta.stats.wins++;
    G.meta.stats.bestAct = 3;
    if(run.ascension >= G.meta.ascension.max && G.meta.ascension.max < ASCENSION.length - 1){
      G.meta.ascension.max = run.ascension + 1;
      G.ui.result.unlocked = true;
    }
  }
  saveMeta();
  clearRun();
  setScreen(win ? 'victory' : 'gameOver');
}
function nextAct(){
  const run = G.run;
  if(run.act >= 3){ endRun(true); return; }
  run.act++;
  run.map = generateMap(run.seed, run.act);
  run.path = [];
  run.actBattles = 0;
  run.pendingNode = null; run.nodeState = null; run.rewardState = null;
  const heal = Math.ceil((run.maxHp - run.hp) * 0.7);
  run.hp += heal;
  G.ui.actHeal = heal;
  saveRun();
  G.ui.storyAct = run.act;
  setScreen('actTransition');
}

const $ = s => document.querySelector(s);
function appRect(){ return $('#app').getBoundingClientRect(); }
const _fxStack = {};
function unitEl(uid){ return document.querySelector(`[data-uid="${uid}"]`); }
function fxText(uid, text, cls){
  const el = unitEl(uid);
  if(!el) return;
  const target = el.querySelector('.u-art') || el;
  const r = target.getBoundingClientRect(), a = appRect();
  const now = Date.now();
  const s = _fxStack[uid] && now - _fxStack[uid].t < 450 ? _fxStack[uid].n + 1 : 0;
  _fxStack[uid] = {t:now, n:s};
  const d = document.createElement('div');
  d.className = 'ftext ' + (cls || '');
  d.textContent = text;
  d.style.left = (r.left - a.left + r.width / 2 + (s % 2 ? 14 : -10)) + 'px';
  d.style.top = (r.top - a.top + r.height * 0.35 - s * 18) + 'px';
  $('#fx').appendChild(d);
  setTimeout(() => d.remove(), 1050);
}
function fxClass(uid, cls){
  const el = unitEl(uid);
  if(!el) return;
  const t = el.querySelector('.u-art') || el;
  t.classList.remove(cls); void t.offsetWidth; t.classList.add(cls);
  setTimeout(() => t.classList.remove(cls), 450);
}
function fxShake(uid){ fxClass(uid, 'shake'); }
function fxFlash(){ const d = document.createElement('div'); d.className = 'flash-screen'; $('#fx').appendChild(d); setTimeout(() => d.remove(), 450); }
function fxCardPlay(def){
  const d = document.createElement('div');
  d.className = 'flycard';
  d.innerHTML = cardHtml(def, {cls:'md'});
  $('#fx').appendChild(d);
  setTimeout(() => d.remove(), 600);
}
function showBanner(text){
  const d = document.createElement('div');
  d.className = 'turn-banner serif';
  d.textContent = text;
  $('#fx').appendChild(d);
  setTimeout(() => d.remove(), 1050);
}
function flashRelic(id){
  const el = document.querySelector(`.relic[data-id="${id}"]`);
  if(!el) return;
  el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
}
function toast(msg){
  const d = document.createElement('div');
  d.className = 'toast';
  d.innerHTML = msg;
  const box = $('#toast');
  while(box.children.length > 2) box.firstChild.remove();
  box.appendChild(d);
  setTimeout(() => d.remove(), 1850);
}

    <div class="modal-body">${body}</div>${foot ? `<div class="modal-foot">${foot}</div>` : ''}</div>`;

SCREENS.map = () => {
  const run = G.run;
  const m = run.map;
  const W = 400, RH = 92;
  const H = 150 + MAP_ROWS * RH;
  const pos = n => n.id === 'boss' ? {x:W / 2, y:62} : {x:40 + (n.c + 0.5 + (n.jx || 0)) * (320 / MAP_COLS), y:H - 56 - n.r * RH + (n.jy || 0) * 30};
  const avail = new Set(availableNodes());
  const visited = new Set(run.path);
  const pathEdges = new Set();
  for(let i = 1; i < run.path.length; i++) pathEdges.add(run.path[i - 1] + '>' + run.path[i]);
  let edges = '';
  for(const e of m.edges){
    const [a, b] = e.split('>');
    const pa = pos(m.nodes[a]), pb = pos(m.nodes[b]);
    const on = pathEdges.has(e);
    edges += `<line x1="${pa.x}" y1="${pa.y}" x2="${pb.x}" y2="${pb.y}" stroke="${on ? '#ffb24a' : 'rgba(230,210,170,.35)'}" stroke-width="${on ? 4 : 2.5}" stroke-dasharray="${on ? '0' : '6 7'}" stroke-linecap="round"/>`;
  }
  let nodes = '';
  const cur = run.path[run.path.length - 1];
  for(const id in m.nodes){
    const n = m.nodes[id];
    const p = pos(n);
    const isAvail = avail.has(id);
    const isDone = visited.has(id);
    const cls = isAvail ? 'avail' : isDone ? 'done' : (n.r < (run.path.length) ? 'unreach' : '');
    const r = id === 'boss' ? 26 : 17;
    nodes += `<g transform="translate(${p.x} ${p.y})"><g class="map-node ${cls}" ${isAvail ? `data-action="node" data-id="${id}"` : ''}>
      <circle r="${r + 7}" class="ring"/>
      ${isAvail ? `<circle r="${r + 10}" fill="#ffb24a" opacity=".18"/>` : ''}
      <circle r="${r}" fill="${id === 'boss' ? '#1a0606' : '#efe3c6'}" stroke="${INK}" stroke-width="2.5"/>
      ${NODE_ICON[n.type]()}
      ${isDone ? `<path d="M-10 0 L-3 8 L12 -9" fill="none" stroke="#c8323a" stroke-width="4" stroke-linecap="round" opacity=".9"/>` : ''}
      ${id === cur ? `<circle r="${r + 4}" fill="none" stroke="#c8323a" stroke-width="3"/>` : ''}
    </g></g>`;
  }
  const lanterns = Array.from({length:10}, (_, i) => {
    const rr = makeRng(run.seed, 'lan', run.act, i);
    const x = rr() < 0.5 ? 10 + rr() * 22 : W - 10 - rr() * 22, y = 120 + rr() * (H - 200);
    return `<g opacity=".7"><circle cx="${x}" cy="${y}" r="9" fill="#ffb24a" opacity=".18"/><rect x="${x - 3}" y="${y - 4}" width="6" height="8" fill="#e8572a" stroke="${INK}" stroke-width="1"/></g>`;
  }).join('');
  return `<div class="screen">
    <div class="bgart">${actBackground(run.act)}</div>
    ${topbarHtml()}
    <div class="map-head"><b class="serif">${run.act}막 · ${ACTS[run.act].name}</b><span>등불이 켜진 곳을 고르세요</span></div>
    <div class="map-scroll" id="mapScroll">
      <svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">
        ${lanterns}
        ${edges}
        ${nodes}
      </svg>
    </div>
    <div class="map-legend">${['battle','elite','event','shop','inn','treasure'].map(t => `<span><svg viewBox="-14 -14 28 28">${NODE_ICON[t]()}</svg>${NODE_NAME[t]}</span>`).join('')}</div>
  </div>`;
};
function afterMapRender(){
  const sc = $('#mapScroll');
  if(!sc) return;
  const av = sc.querySelector('.map-node.avail');
  if(av){
    const r = av.getBoundingClientRect(), sr = sc.getBoundingClientRect();
    sc.scrollTop += (r.top - sr.top) - sr.height * 0.55;
  }else sc.scrollTop = sc.scrollHeight;
}

SCREENS.battle = () => {
  const b = G.battle;
  const run = G.run;
  if(!b) return '';
  const sel = b.selected !== null && b.selected !== undefined ? getCardDef(b.hand[b.selected]) : null;
  const targeting = sel && sel.target === 'enemy';
  const single = b.enemies.length === 1 ? 'single' : '';
  const enemies = b.enemies.map(e => {
    const d = ENEMIES[e.id];
    const ii = e.hp > 0 ? intentInfo(e) : {icons:[]};
    const intent = ii.icons.map(i => `<svg viewBox="0 0 24 24">${INTENT_ICON[i.k]}</svg>${i.v !== undefined ? `<span>${i.v}${i.h > 1 ? '×' + i.h : ''}</span>` : ''}`).join('');
    let deadCls = '';
    if(e.hp <= 0){ G.ui.renderedDead = G.ui.renderedDead || new Set(); deadCls = G.ui.renderedDead.has(e.uid) ? 'gone' : 'dead'; G.ui.renderedDead.add(e.uid); }
    return `<div class="unit enemy ${d.boss ? 'boss' : ''} ${d.elite ? 'elite' : ''} ${single} ${deadCls} ${targeting && e.hp > 0 ? 'targetable' : ''}" data-action="unit" data-uid="${e.uid}">
      <div class="intent">${(b.phase === 'player' || b.phase === 'start' || b.phase === 'spirit') ? intent : ''}</div>
      <div class="u-art">${enemyArtSvg(e.id)}</div>
      ${hpbarHtml(e)}
      ${statusesHtml(e)}
      <div class="u-name">${esc(e.name)}</div>
    </div>`;
  }).join('');
  const slots = spiritSlots();
  G.ui.renderedSpirits = G.ui.renderedSpirits || new Set();
  let spirits = b.spirits.map(s => {
    const isNew = !G.ui.renderedSpirits.has(s.uid);
    G.ui.renderedSpirits.add(s.uid);
    return `<div class="unit spirit ${isNew ? 'summoned' : ''} ${s.dead ? 'dead' : ''}" data-action="unit" data-uid="${s.uid}">
      <div class="u-art">${art(SPIRITS[s.id].art)}<div class="fam-dot" style="background:${FAMILIES[s.family].color}"></div>${s.atkBonus ? `<div class="atk">+${s.atkBonus}</div>` : ''}</div>
      ${hpbarHtml(s, true)}
      ${statusesHtml(s)}
      <div class="u-name">${esc(s.name)}</div>
    </div>`;
  }).join('');
  for(let i = b.spirits.length; i < slots; i++) spirits += `<div class="slot-empty"></div>`;
  const cnt = b.synergy || {};
  const synBar = Object.keys(SYNERGIES).filter(f => cnt[f]).map(f => {
    const n = cnt[f];
    const on = n >= 2;
    return `<span class="syn ${on ? 'on' : ''}" style="background:${FAMILIES[f].color}">${FAMILIES[f].name} ${n}/${n >= 3 ? 3 : n >= 2 ? 3 : 2}</span>`;
  }).join('');
  // 손패
  const W = Math.min($('#app').clientWidth || 400, 480);
  const n = b.hand.length;
  const cw = 88;
  const spacing = n > 1 ? Math.min(cw + 2, (W - 28 - cw) / (n - 1)) : 0;
  const total = spacing * (n - 1) + cw;
  const start = (W - total) / 2;
  const hand = b.hand.map((c, i) => {
    const def = getCardDef(c);
    const off = i - (n - 1) / 2;
    const isSel = b.selected === i;
    const rot = isSel ? 0 : off * 2.2;
    const left = isSel ? clamp(start + i * spacing, 24, W - cw - 24) : start + i * spacing;
    const y = isSel ? -64 : Math.abs(off) * Math.abs(off) * 1.6;
    const scale = isSel ? 1.4 : 1;
    const dim = (def.unplayable || def.cost > b.energy || b.phase !== 'player') ? 'dim' : '';
    const isNew = b.newCards.has(c.uid);
    return cardHtml(def, {cls:`${dim} ${isSel ? 'sel' : ''} ${isNew ? 'drawin' : ''}`,
      attrs:`data-action="card" data-idx="${i}"`,
      style:`left:${left}px;transform:translateY(${y}px) rotate(${rot}deg) scale(${scale});z-index:${isSel ? 60 : i + 1};${isNew ? `animation-delay:${(i % 5) * 40}ms` : ''}`});
  }).join('');
  b.newCards.clear();
  const phaseText = b.phase === 'player' ? '' : b.phase === 'spirit' ? '요괴 행동 중…' : b.phase === 'enemy' ? '봉요사의 차례…' : '';
  const hint = sel ? (targeting ? '대상 적을 누르세요' : '한 번 더 누르면 사용') : phaseText;
  return `<div class="screen battle">
    <div class="bgart">${actBackground(run.act)}</div>
    ${topbarHtml()}
    <div class="b-field" data-action="bg">
      <div class="b-enemies">${enemies}</div>
      <div class="b-divider"></div>
      <div class="syn-bar">${synBar}</div>
      <div class="b-allies">
        <div class="unit ally-leader" data-action="unit" data-uid="P">
          <div class="u-art">${art(LEADERS[run.leader].art)}</div>
          ${hpbarHtml(b.player)}
          ${statusesHtml(b.player)}
          <div class="u-name">${esc(LEADERS[run.leader].name)}</div>
        </div>
        <div class="spirit-row">${spirits}</div>
      </div>
    </div>
    <div class="b-controls">
      <div class="energy">${coinSvg()}<b>${b.energy}/${b.maxEnergy}</b></div>
      <button class="pile" data-action="pile" data-pile="drawPile"><svg viewBox="0 0 14 18"><rect x="1" y="1" width="12" height="16" rx="2" fill="#f2e8d0" stroke="#1b1512" stroke-width="1.5"/></svg>${b.drawPile.length}</button>
      <button class="pile" data-action="pile" data-pile="discard"><svg viewBox="0 0 14 18"><rect x="1" y="1" width="12" height="16" rx="2" fill="#8a7a68" stroke="#1b1512" stroke-width="1.5"/></svg>${b.discard.length}</button>
      ${b.exhaust.length ? `<button class="pile" data-action="pile" data-pile="exhaust">소멸 ${b.exhaust.length}</button>` : ''}
      <div class="hint">${hint}</div>
      <button class="btn primary small endturn" data-action="endTurn" ${b.phase !== 'player' || b.busy ? 'disabled' : ''}>턴 종료</button>
    </div>
    <div class="b-hand">${hand}</div>
  </div>`;
};
