const KEYS = { left: false, right: false, up: false, down: false };
const MOUSE = { x: -100, y: -100, world: [800, 450], inside: false, useKeys: false };

function hitProp(wx, wy) {

  if (Math.hypot(wx - PROPS.hour.x, wy - (PROPS.hour.y - 36)) < 34) return 'hour';

const KEYMAP = { ArrowLeft: 'left', a: 'left', A: 'left', ArrowRight: 'right', d: 'right', D: 'right', ArrowUp: 'up', w: 'up', W: 'up', ArrowDown: 'down', s: 'down', S: 'down' };
addEventListener('keydown', e => {
  const k = e.key;
  if (k === ' ' || k === 'Enter' || k.startsWith('Arrow')) e.preventDefault();
  initAudio();
  if (KEYMAP[k]) KEYS[KEYMAP[k]] = true;
  if (e.repeat) return; // 키를 누르고 있는 것만으로는 진행되지 않음
  if (k === 'm' || k === 'M') { setMute(!AU.muted); return; }
  if (k === 'Escape' && S.sealPick) { S.sealPick = false; return; }
  if (k === 'p' || k === 'P' || k === 'Escape') { togglePause(); return; }
