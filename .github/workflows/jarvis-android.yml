name: JARVIS Android build

on:
  push:
    paths:
      - "jarvis-android/**"
      - ".github/workflows/jarvis-android.yml"
  pull_request:
    paths:
      - "jarvis-android/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jarvis-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK + lint
        run: ./gradlew --no-daemon assembleDebug lintDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-debug-apk
          path: jarvis-android/app/build/outputs/apk/debug/*.apk
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: jarvis-android/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
