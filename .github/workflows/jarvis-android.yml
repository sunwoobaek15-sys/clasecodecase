name: JARVIS Android build

on:
  push:
    paths:
      - "jarvis-android/**"
      - ".github/workflows/jarvis-android.yml"
  pull_request:
    paths:
      - "jarvis-android/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: jarvis-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK + lint
        run: ./gradlew --no-daemon assembleDebug lintDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-debug-apk
          path: jarvis-android/app/build/outputs/apk/debug/*.apk
      - name: Publish APK (direct download link)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/jarvis.apk
          gh release delete jarvis-latest --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create jarvis-latest /tmp/jarvis.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "JARVIS 최신 빌드" \
            --notes "폰 브라우저에서 jarvis.apk 를 눌러 바로 설치하세요. (커밋 ${GITHUB_SHA::7})"
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: jarvis-android/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
      - name: HUD screenshot tests (Robolectric + Roborazzi)
        run: ./gradlew --no-daemon testDebugUnitTest --tests "com.jarvis.assistant.HudScreenshotTest"
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hud-screenshots
          path: jarvis-android/app/build/shots/
          if-no-files-found: ignore
      - name: Print screenshots (base64 JPEG, for remote review)
        if: always()
        run: |
          ls -la app/build/shots || exit 0
          for f in app/build/shots/*.png; do
            n=$(basename "$f" .png)
            if command -v convert >/dev/null; then
              convert "$f" -resize 400x -quality 72 "/tmp/$n.jpg"
            else
              cp "$f" "/tmp/$n.jpg"
            fi
            echo "=====BEGIN $n====="
            base64 -w 0 "/tmp/$n.jpg"
            echo
            echo "=====END $n====="
          done
